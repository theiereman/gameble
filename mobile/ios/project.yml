name: Gameble
options:
  bundleIdPrefix: net.gameble
  deploymentTarget:
    iOS: "16.0"
packages:
  HotwireNative:
    url: https://github.com/hotwired/hotwire-native-ios
    from: 1.2.0
targets:
  Gameble:
    type: application
    platform: iOS
    sources: [Gameble]
    dependencies:
      - package: HotwireNative
    entitlements:
      path: Gameble/Gameble.entitlements
      properties:
        aps-environment: development
    info:
      path: Gameble/Info.plist
      properties:
        CFBundleDisplayName: Gameble
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        GamebleRootURL: $(GAMEBLE_ROOT_URL)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gameble.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          GAMEBLE_ROOT_URL: http://localhost:3000
        Release:
          GAMEBLE_ROOT_URL: https://gameble.net

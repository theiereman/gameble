# Ticketing config: GitHub issues and the "Gamble Kanban" project board, kept in step with the ticket tree by
# script/github_board/sync.py. Read by every skill that creates, reads, or moves tickets.
# Skills read [tickets] and [verbs] through a script, so comments are never loaded.
# Started from the gh-ticketing starter; every verb goes through the sync script so there is one path to GitHub.
#
# GitHub is the source of truth for a ticket's state: the board's Status column (Backlog, Ready, In progress,
# In review, Done). The ticket files under `output_folder` are the agents' working copy: their text is the
# issue's body, and `tracker_status` mirrors the board. A release is a milestone (0.2.0, 0.3.0, ... 1.0.0),
# set per epic by `release` in the initiative's tickets.toml.

description = "GitHub issues and the Gamble Kanban project board, synced with the ticket tree by script/github_board/sync.py."

[tickets]
store = "github"
key = ""    # ids are the repo's issue numbers
repo = "theiereman/gameble"
project = "theiereman/1"   # https://github.com/users/theiereman/projects/1
access = """
Every read and write goes through `python3 script/github_board/sync.py` from the main checkout, which uses the gh
CLI (2.94 or later, authenticated with the repo and project scopes). Without --apply it is a dry run that lists
what it would change. If gh fails on auth, tell the user and ask them to run `gh auth login` or
`gh auth refresh -s project`.
"""

fields = """
risk, severity, and estimate stay in the ticket's frontmatter and travel in the issue's folded
"BMad source (for agents)" block, with the ticket's covers, after, hitl, and its original text verbatim.
"""

reference = """
A reference is a line in the ticket's References section: `type — location, section`, location a
path from {project-root} or a url for a remote source, opened before it is cited. The issue shows repo paths as links.
"""

[verbs]
setup = """
Done: the labels (types, backlog, in-progress, review, hitl, risk:*, P0-P3), the release milestones and the
board exist. A new release is a milestone created with `gh api repos/theiereman/gameble/milestones -f title=<x.y.z>
-f description=<what it holds>`, then named as `release` on its epics in tickets.toml.
"""

write = """
Write the ticket's file in the tree first (a new entry in its epic's tickets.toml, `tickets.py pull` for its leaf
file, or an edit of the file), with `release` on a new epic. Then run `python3 script/github_board/sync.py --apply`:
it creates the missing issues with their milestone, labels, parent and blocked-by relations, refreshes every body,
places each issue on the board, and writes tracker_id, remote and tracker_status back into the files.
A status change is `python3 script/github_board/sync.py set <ref> <state> --apply`, state one of backlog,
in-progress, review, done, dropped (dropped closes the issue as not planned). Never `tickets.py mark`: the
tracker store refuses it. The build's own `status` in the plan is the build's; sync carries its progress to the
board on its next run.
An issue opened on GitHub (a player's request, with the `triage` label) becomes a ticket only when the author
has accepted it and named its epic: `python3 script/github_board/sync.py import <issue> <epic-slug> --apply` adds a
refine-first entry with `requested_in` to that epic and files the ticket as a new issue linking to the request,
which sync closes when the ticket is done.
Commit the files sync changed (it lists them as `local <path>`) on the current branch, by exact path; never push.
"""

query = """
Run `python3 script/github_board/sync.py --apply` first: it reads the board and writes each ticket's column into
its file's tracker_status. Then `tickets.py next --synced` gives the candidates to start, and `tickets.py find
<folder> <ref>` resolves a ref, a title, or an issue number to one ticket. One issue: `gh issue view <n> -R
theiereman/gameble`; its folded "BMad source (for agents)" block holds the ticket's fields and original text.
Candidates to start: what `next --synced` lists under ready_to_start (the board's Ready column), unassigned. Offer
them all; when one must be chosen, the one that unblocks the most work behind it.
"""

[tickets.types]
initiative = "milestone"   # each epic's release is its milestone
epic = "epic"
story = "story"
spike = "spike"
bug = "bug"

[tickets.status]
backlog = "backlog"
in-progress = "in-progress"
review = "review"
done = "closed"   # state, not a label
dropped = "closed: not planned"   # state, not a label

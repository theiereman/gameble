title = "Duels and the duel screen on desktop"
description = "At desktop width, as boards 11 and 12 and DESIGN.md's Duels, Desktop draw them: the Duels screen keeps entry 42.2's 1120px column and puts DÉFIER UN AMI and EN LIGNE in a 400px left column beside the decks; Défier un ami opens as a centred dialog (the Modal pattern) instead of the phone sheet; the challenge received stays the Modal; a duel fills the window without the hub menu, the opponent's deck on the left and the player's on the right, each a 3 × 4 grid at 74px tall with names, the choices in the centre (stats and directions side by side, then ANNONCER), the hand of three at the foot, the chosen card raised 12px; the reveal and the result keep their phone order. No behaviour changes."

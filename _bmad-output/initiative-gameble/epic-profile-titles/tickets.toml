# tickets.toml — the stories of the profile titles epic, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Profile titles read from the set tier rows"
description = "Adds Game::ProfileTitles, a query over the player's game_set_tiers rows returning one title per distinct set kind, key and title rank across seasons (bronze counts as apprentice, silver as adept, gold as master, complete as Complétiste) with the latest season it was reached in; the title is rendered from the rank and the set's name in en.yml and fr.yml and never stored as text."
verify = "Query tests cover each tier and complete, a legacy bronze and a later apprentice of the same set giving one title, the same set across seasons showing the latest season, and a player with no tier having no title; i18n-tasks is clean."
covers = ["R1"]
after = ["13.22"]
hitl = false
risk = "low"

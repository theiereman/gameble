[[entry]]
id = 8
type = "story"
title = "The author ships the duels alpha in release 1.4.0"
description = "HITL. The author lands the retros' pre-release items still open (the broadcast-level secrecy test over DuelStreamJob, the nil rating value in the rules test, a stale acceptor deck token refused inline without lapsing, epic 44's migrations timed on a production copy if not yet deployed), cuts a 1.4.0 candidate per RELEASING.md and, on staging with two accounts on a phone and a desktop, walks epics 42 and 43's Done when, epic 44's record and DERNIERS DUELS (no capsule or achievement), and this epic's: the ALPHA tag and banner, practice against two archetypes, ÉCHANGES on MARCHÉ for a new account and on ENTRE AMIS for a friend trader, the back-office page, a live duel refused, cancelled, lapsed, timed out, reloaded, dropped and with a banned opponent; then promotes the candidate, runs entry 3's ÉCHANGES backfill task once in production and checks its count, checks the duel stats computed at deploy, plays one duel in production, writes the release notes and publishes v1.4.0."
verify = "The author confirms each Done when item of this epic and of epics 42 and 43 on staging, and in production a duel reaches its result, a practice duel names its archetype, and the release v1.4.0 is published."
covers = ["R10"]
after = [7]
hitl = true
risk = "high"
unknown = "When the native apps with DUELS go to the stores; the author's choice of timing."
references = ["retrospective — _bmad-output/initiative-gameble/epic-live-friend-duels/epic-live-friend-duels-retrospective.md, Action items A1 (F3), A2 to A4", "retrospective — _bmad-output/initiative-gameble/epic-duel-stats-and-decks/epic-duel-stats-and-decks-retrospective.md, Action items 2 and 9"]

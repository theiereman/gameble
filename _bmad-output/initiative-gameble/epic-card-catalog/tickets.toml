[[entry]]
id = 7
type = "story"
title = "A visitor's collection entry suggests sets to discover"
description = "On the collection entry (/library), a signed-out visitor sees a section \"À DÉCOUVRIR\" (\"TO DISCOVER\") in place of EN COURS and its empty line \"Aucun set en cours pour l'instant…\": a few popular sets of the published season (Catalog::PopularSets or its equivalent), as set rows with their name and kind only, no count, bar or tier (as 14.5 shows a visitor's search rows), each opening its album. A signed-in player keeps EN COURS and its empty line; a public profile is unchanged. Copy in French and English."
verify = "Signed out, in fr and en, /library shows À DÉCOUVRIR with popular sets and no progress, each leading to its album, and no EN COURS; signed in, EN COURS and its empty line are unchanged; no database id; the full suite, vitest, packwerk, rubocop and typecheck pass."
covers = ["R4"]
after = [5]
hitl = false
risk = "low"
notes = ["Decision (author, 2026-10-20): replace the visitor's empty EN COURS line with a list of sets to discover. À DÉCOUVRIR existed for every player until 13.18 removed it (epic-recognizable-sets); its earlier build is in git history."]

[[entry]]
id = 8
type = "story"
title = "A visitor reaches only the landing, the catalog and the shared pages"
description = "A signed-out visitor reaches only the landing, Toutes les cartes and its card detail, the public card page, public profiles with their albums, and Comment ça marche; the hub, the collection entry (/library), a set album outside a public profile, the feed and every other page redirect a visitor to the landing. The GAMEBLE link leads a visitor to the landing from every page, Toutes les cartes included. The landing's \"Embarquer sur le pont\" becomes the Steam sign-in (POST to Steam's auth, returning to the hub). Every action that needs an account shows greyed and disabled for a visitor, with nothing else (ÉCHANGE and SIGNALER on a public profile, the tab bar and menu entries a visitor cannot open, etc.); the sign-in panel and its triggers are removed. The visitor's À DÉCOUVRIR section built by 14.7 is removed with the collection entry. EXPERIENCE.md (Navigation's signed-out visitors, landing Hero, Signed out, Friendship action, Sign-in panel rows) records the rules (author, 2026-10-20)."
verify = "Signed out, in fr and en, on phone and desktop: the landing, /library/cards, a card detail, a public card page, a public profile and its album, and Comment ça marche open; the hub, /library, the feed, trades, friends and achievements redirect to the landing; GAMEBLE leads to the landing from Toutes les cartes; Embarquer sur le pont starts Steam sign-in; actions needing an account are greyed and disabled with no sign-in panel; signed-in behaviour unchanged; full suite, vitest, packwerk, rubocop, typecheck pass."
covers = ["R4", "R5"]
after = [5]
hitl = false
risk = "medium"
notes = ["Decision (author, 2026-10-20) on reviewing 14.7 on staging: a signed-out visitor has no reason to be on the hub or the collection; they see the landing and every card, and the shared pages. 14.7 is dropped; its visitor À DÉCOUVRIR goes with the collection entry."]

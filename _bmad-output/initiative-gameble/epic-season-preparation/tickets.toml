# tickets.toml — the stories of the season preparation epic, in build order. tickets.py reads it.

[[entry]]
id = 3
type = "story"
title = "Rarity follows popularity, the rating only orders games of equal popularity"
description = "Replaces Steam::PrestigeScore so the review count (the game's popularity) decides the rarity almost alone and the share of positive reviews only orders games of the same popularity, chosen by the author on the staging draft; the spec's rarity rule follows."
verify = "On the staging draft preview, the Légendaires and Épiques are the best-known games, a much-reviewed game never ranks below a far less reviewed one for a better rating, and two games of the same popularity are ordered by their rating."
covers = ["CAP-3"]
after = ["2.12"]
hitl = true
risk = "medium"
unknown = "How strictly popularity leads: popularity bands (for example by order of magnitude of reviews) with the rating ordering inside a band, or the count alone with the rating as a tie-break; the author chooses on the staging draft, as for story 2.12."
notes = ["il faut encore revoir le calcul de rareté des cartes et passer quasiment totalement sur le nombre de joueurs / reviews parce que c'est encore trop bizarre", "la positivité des notes servira juste à classer les jeux de même popularité"]

[[entry]]
id = 1
type = "story"
title = "An import builds beside the draft and replaces it only once validated"
description = "An import run writes its cards into a staging draft of its own; an administrator reviews it and promotes it to replace the draft, or throws it away, so a failed or bad run never leaves a mixed draft."
verify = "A run that fails or is discarded leaves the current draft exactly as it was; promoting a completed run replaces the draft in one step; a promoted draft can still be published."
covers = ["CAP-2", "CAP-3"]
after = ["2.12"]
hitl = true
risk = "high"
notes = ["il faut pouvoir rollback et donc faire un import à côté en attendant de le valider ou qqch dans le genre", "vérifier que l'import utilise bien la nouvelle formule (2026-10-08 ; voir deferred-work.md)"]

[[entry]]
id = 2
type = "story"
title = "An administrator curates the theme list in the back-office before publishing"
description = "A back-office screen lists every Steam tag the import met with its game count; the administrator marks each tag as a theme, with French and English names (English tag name by default), or as not a theme; the preview shows each theme's size and the UFOs' share; a draft with an unclassified tag, or whose UFOs exceed the agreed share, cannot be published; replaces the theme list in code (13.3), seeded from it."
verify = "Marking Roguelite as a theme and rescoring moves those games into it in the preview and lowers the UFOs' share; a new unclassified tag, or a UFOs' share above the limit, blocks the publish with a reason; a renamed theme shows its names as the card's genre."
covers = ["CAP-6"]
after = [1, "13.3"]
hitl = true
risk = "medium"
notes = ["après un import et avant de publier une saison je peux voir tous les genres qui ont été ajoutés et c'est moi qui décide lesquels fusionner vers un genre", "il faut tout classer avant de pouvoir publier ; le nom anglais sert par défaut mais je dois pouvoir entrer les traductions manuellement"]

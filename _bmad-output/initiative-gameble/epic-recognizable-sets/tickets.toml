# tickets.toml — the stories of the recognizable sets epic, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "spike"
title = "Sets on real data"
description = "On staging's imported catalog, confirms developers and franchises sit in steam_apps.details, counts games per franchise and studio, drafts the theme list from Steam::GenreTags and the tag counts, measures the UFOs' share and proposes hall of fame thresholds; the author settles the numbers and confirms the tier percentages."
verify = "A short report beside the epic gives the counts, the proposed theme list with the UFOs' share under about 5 %, the franchise and studio minimum, and the hall of fame thresholds, and the tier percentages, each marked agreed by the author in the epic's Notes."
covers = ["R1", "R2", "R3"]
after = []
hitl = true
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "The import keeps developers, franchises and the review count"
description = "Reads developers and franchises from the raw item each Steam app already stores, keeps them on the card through the draft upsert, keeps each card-season's Steam review count for the hall of fame, frozen at publication, and fills developers and franchises once for the cards already imported from the stored Steam items, without a new import (AD-4, AD-5)."
verify = "On a copy of staging's data every card whose Steam item names a developer or franchise has it and every card-season has its review count; a fresh import run fills them too; packwerk and the import tests pass."
covers = ["R3"]
after = [1, "2.10"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Themes, franchises, studios, hall of fame and the UFOs replace the old sets"
description = "Replaces the set builder's kinds with the five new ones using the spike's numbers, moves the theme list with French and English names into code in place of Steam::GenreTags, records each card-season's main theme at publication, identifies sets by kind and key, writes each set's tier requirements as rows at publication, widens the set kind check (expand only; entry 4 narrows it), and adapts Catalog::DraftPreview and Catalog::CollectionGrid, which read tomes; the current collection screens show the new sets (AD-5)."
verify = "Publishing a draft builds only the five kinds; every card is in at least one set and the UFOs stay under the agreed share; a card's genre is its main theme in both languages; the collection lists the new sets on staging."
covers = ["R1", "R2", "R3", "R4"]
after = [1, 2, "2.7"]
hitl = false
risk = "high"

[[entry]]
id = 11
type = "story"
title = "Franchise and studio sets"
description = "Builds franchise and studio sets at publication with the spike's agreed filters: franchises of at least 3 games, not named like a developer or publisher, titles sharing a whole word with separator-free matching, a keep-list for Science Adventure and World of Darkness, suffixes stripped; studios by first developer, names normalized, at least 3 games and a most-reviewed game of 20,000 reviews. Each set has its key and name, a complete tier row, and its label on every screen that shows sets."
verify = "Publishing a staging-like draft builds the franchise and studio sets the spike's report lists, each with one complete tier row; a franchise named like its developer builds no set; the collection names them in both languages."
covers = ["R1", "R2", "R3"]
after = [3]
hitl = false
risk = "medium"
notes = ["Split from entry 3 at the author's choice (2026-10-12); entry 3 already widened the kind check for these kinds."]

[[entry]]
id = 12
type = "story"
title = "Hall of fame sets"
description = "Builds the hall of fame sets at publication from each card season's frozen rating and review count: Les Intouchables (at least 97 % and 20,000 reviews), Les Pépites (at least 98 % and under 1,000), Les Mal-aimés (40 to 69 % and at least 20,000), Les Phénomènes (at least 200,000), with fixed keys, bronze, silver, gold and complete tier rows, and their French and English names."
verify = "Publishing a staging-like draft builds the four sets with the cards their thresholds select and four tier rows each; a card at exactly a threshold is in; the collection names them in both languages."
covers = ["R1", "R2", "R3"]
after = [3]
hitl = false
risk = "low"
notes = ["Split from entry 3 at the author's choice (2026-10-12), with the franchise and studio sets."]

[[entry]]
id = 4
type = "story"
title = "The retired set kinds removed"
description = "A migration deletes the sets of the retired kinds (tome, publisher, best_of_year) in every season, with their memberships, tiers and completion rows, then narrows the set kind check to the five kinds (added unvalidated, validated in the next migration); the retired-kind code (Catalog::Set enum and BUILT_KINDS, SetLabel, routes, shelf and card-detail orders, back-office, locales, catalog.genres) and its tests and fixtures go (AD-5, AD-10)."
verify = "Migrating a database holding a season of retired kinds leaves no retired set, membership, tier or their completion rows, every other set and completion untouched; the kind check refuses a tome; that season's card pages render with no set and no genre; the published season's screens are unchanged."
covers = ["R10"]
after = [3, 11, 12]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "Tiers and the celebration at opening"
description = "Replaces set completions with one row per player, set and tier reached, read against the tier rows written at publication; each new row publishes one event (bronze, silver or gold Game::SetTierReached; complete Game::SetCompleted, a theme or hall of fame set completing at 100 % after gold); the opening's response carries the tiers reached (AD-10, AD-23); and adds a celebration banner after the reveal that the booster live region announces; builds on entry 4, which dropped the published season's old completions. Adds Game::HeldGames, the games measure (distinct games at their best minted rarity, any edition) whose SQL the tier pass shares: a set's member counts when the player holds it in any season; only the published season's sets earn tiers, found through each credited card's card-season in the published season, so an earlier edition received by trade crosses current tiers; the opening reads the published season once after its bank lock and passes it to the draw, the tier pass and its response; each tier row records how it was reached (pack or trade); set achievements count a set once across seasons by kind and key, and card-counting achievements count games (AD-5, AD-10)."
verify = "Opening the pack that crosses 10 % of a theme shows the bronze celebration once and writes one row and one event; a second crossing writes nothing; a franchise completed shows the completion; a theme reaching 100 % shows SET COMPLET after its gold; the live region announces it. A copy minted in an earlier season counts toward a published-season theme's bronze and gives no tier on that earlier season's set; POST /packs stays within 200 ms p95 on staging's seasons 1 to 4."
covers = ["R5", "R6", "R11"]
after = [4, "6.7"]
hitl = false
risk = "medium"
unknown = "The celebration banner is drawn with bmad-ux before the build."

[[entry]]
id = 6
type = "story"
title = "Tiers and completions in the feed and the LIVE ticker"
description = "Adds feed entries and ticker items for a set tier reached and a set completed, from the events of entry 5, behind the feed's visibility rules; the tiers and completions one opening reaches make one entry and one ticker item, naming the highest and the count ('Léa atteint 4 paliers · Metroidvania OR'), a single result naming the set and the tier; no pack or card (AD-13)."
verify = "A player reaching silver on a theme appears in the feed and the ticker for a signed-out visitor; an opening reaching four tiers makes one entry and one ticker item; a private profile's tier does not appear."
covers = ["R6"]
after = [5, "6.1", "6.2", "6.4"]
hitl = false
risk = "low"

[[entry]]
id = 7
type = "story"
title = "The collection opens on sets in progress"
description = "Makes \"EN COURS\" (sets sorted by closeness to their next tier or completion, plus those just progressed in), \"À DÉCOUVRIR\" and a search over every set the collection's entry screen, on the player's own collection and on public and friends' profiles, and turns the hub panel into \"SETS EN COURS\"; adds no migration, reading tier rows and holdings' last_gained_at. Set progress counts every edition through entry 5's Game::HeldGames."
verify = "A player with progress sees their closest sets first; a new player sees \"À DÉCOUVRIR\" filled; searching \"souls\" finds Souls-like; a signed-out visitor sees a public profile's sets in progress; the hub shows four sets in progress. After a new season is published on staging, a player's sets in progress keep their progress, less what the grown sets add."
covers = ["R7", "R11"]
after = [5, "10.7"]
hitl = true
risk = "medium"
unknown = "The screen design is drawn with bmad-ux before the build."

[[entry]]
id = 8
type = "story"
title = "The set album"
description = "Opens a set as an album page: name, kind, owned / total, tier marks or the \"COMPLET\" stamp, its cards in set order with missing-card slots; reached from \"EN COURS\", the search, the hub and the card detail's sets. A slot is filled by any edition, showing the best one owned, read through entry 5's Game::HeldGames."
verify = "A theme at silver shows its tier marks with silver reached and its missing games named; a completed franchise shows \"COMPLET\"; the same album opens signed out on a public profile."
covers = ["R8", "R11"]
after = [7]
hitl = true
risk = "medium"
unknown = "The album design is drawn with bmad-ux before the build."

[[entry]]
id = 9
type = "story"
title = "The card grid as the secondary view"
description = "Moves the grid of every card with its filter zone and search behind \"TOUTES LES CARTES\" from the collection, its set filter choosing a kind then a set by search instead of listing every set as chips."
verify = "From the collection, \"TOUTES LES CARTES\" opens the grid with its filters; filtering on one theme and one rarity combines as before; the set filter finds a franchise by typing its name."
covers = ["R9"]
after = [8, "10.7"]
hitl = false
risk = "low"

[[entry]]
id = 15
type = "story"
title = "Every edition counts in the collection"
description = "The grid shows one card per game with its best owned rarity and copies across editions, an edition count when several are held, through entry 5's Game::HeldGames; the total counter and RAPPORT count distinct games across editions; the rarity counter and the opening's counts before opening (Game::TierCounts) move to the copies measure, quantities per minted rarity across editions with no season filter; the card detail lists the editions owned grouped by rarity; the public profile reads the same; replaces every collection read of the published season only."
verify = "On staging with seasons 1 to 4 published, a player holding Hades in S1 Rare and S4 Épique sees one Hades tile at Épique with \"2 éd.\", a total counter that does not drop at publication, and both editions on the card detail; the rarity counter at the top of the booster does not drop to 0 when a season is published."
covers = ["R11"]
after = [9]
hitl = false
risk = "medium"
unknown = "The edition count on the tile and the ÉDITIONS row of the card detail are drawn with bmad-ux before the build."

[[entry]]
id = 13
type = "story"
title = "The card grid fills its row"
description = "The collection grid shows fixed 160 × 240 card faces in as many columns as fit, where the design asks cards resized between 120 and 170 px wide to fill the row, the small face layout under 140 px, and the pixel filter run again at the rendered art size after a resize."
verify = "At several window widths the grid's row is filled with cards between 120 and 170 px wide; under 140 px the small face layout shows; after a resize the art is redrawn at its new size."
covers = ["R9"]
after = [15]
hitl = false
risk = "low"
notes = ["From the deferred work triage (author, 2026-10-12)."]

[[entry]]
id = 14
type = "story"
title = "The card detail beside the grid on tablet and desktop"
description = "From 1180 px a grid slot opens the card detail in the screen beside the grid (340 px, 300 px below that width) instead of a separate page, with an accent frame on the selected card; it browses the set shown and fades a card not held; Back returns to the grid at its scroll. On a phone the slot keeps opening the detail page."
verify = "On a desktop, choosing a card shows its detail beside the grid with the card framed, and the next card in the set replaces it; on a phone the detail page opens as before; Back returns to the grid where it was."
covers = ["R9"]
after = [15]
hitl = false
risk = "medium"
notes = ["From the deferred work triage (author, 2026-10-12)."]

[[entry]]
id = 10

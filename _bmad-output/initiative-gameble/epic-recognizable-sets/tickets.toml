[[entry]]
id = 22
type = "story"
title = "Set tiers cut by the set's size"
description = "The tier table by set size in Catalog replaces Catalog::Themes::TIER_PERCENTS and applies to every kind in the set builder: 3 to 4 cards complete only, then one to five ranks before completion (novice, apprentice, adept, expert, master) counted from the top, the last always master and a smaller set dropping ranks from novice up, each share rounded up (catalog-and-rarity.md, Tiers). Catalog::SetTier and the three checks (catalog_set_tiers_tier_check, game_set_tiers_tier_check, game_feed_entries_tier_check) accept both families, bronze, silver and gold kept for published seasons, widened expand/contract; Game::SetStanding orders a set's tiers by required count and a set is tiered when it has any tier below complete; the feed and the celebration rank results by the share of its set a tier stands for, complete highest; any tier but complete publishes Game::SetTierReached; the rank names in en.yml and fr.yml (Novice, Apprentice, Adept, Expert, Master; Novice, Apprenti, Adepte, Expert, Maître) and the help page's tier sentence (EXPERIENCE.md, Copy deck) (AD-5, AD-10)."
verify = "A season published in a test cuts a 3-, 7-, 12-, 40-, 100- and 250-card set into 1 to 6 tiers with the rounded-up counts; a published season's bronze, silver and gold rows still read, celebrate and show in the feed unchanged; no code orders tiers by name; the help page states the table in both languages."
covers = ["R5", "R6"]
after = [6, 17, 19]
hitl = false
risk = "medium"
notes = ["From change-set-tiers-by-size (author, 2026-10-19). The next season published on staging waits for this entry and entry 23."]


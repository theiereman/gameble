title = "The set album"
description = "Opens a set as an album page: name, kind, owned / total, tier marks or the \"COMPLET\" stamp, its cards in set order with missing-card slots; reached from \"EN COURS\", the search, the hub and the card detail's sets. A slot is filled by any edition, showing the best one owned, read through entry 5's Game::HeldGames."
verify = "A theme at silver shows its tier marks with silver reached and its missing games named; a completed franchise shows \"COMPLET\"; the same album opens signed out on a public profile."
covers = ["R8", "R11"]
after = [7]
hitl = true

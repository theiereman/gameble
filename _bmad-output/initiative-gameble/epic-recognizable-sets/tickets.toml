verify = "On staging, after a season published with the table, a 7-, a 40- and a 250-card set show one, three and five rank ticks; reaching Novice, the back tier and completion each celebrate at their level; the feed names the rank; a greyscale screenshot tells every mark apart; the author approves on the phone and the desktop."

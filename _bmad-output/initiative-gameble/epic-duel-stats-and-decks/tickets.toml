# tickets.toml — the epic's agreed children, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Every card's detail shows its duel profile, recomputed each Monday"
description = "Tracer through the stats lane. One migration creates game_duel_stats, one row per card-season, holding for each of the five stats (popularity, rating, release, discovery, circulation) its exact value, its percentile and its distance from the median, the trump (stat and direction), the last weekly percentiles and computed_at. Game::ComputeDuelStats, an ApplicationOperation writing rows that belong to no player, computes them for every card-season with a rarity in every published regular season (tribute and unrated card-seasons get no row): popularity from the edition's season review count and release from its release date, each ranked over the edition's season catalog; rating from Catalog's whole percent positive, the review count breaking an equal percent; discovery from the stored time in game_first_discoveries, ranked among the season's pulled editions; circulation from the distinct holders with a positive quantity, the Archives excluded, ranked among the held editions of its rarity tier and season; an edition nobody has pulled has no discovery or circulation value. Each percentile is the midrank share of the ranked cards a card beats, to one decimal; the trump is the most extreme stat in either direction. It replaces every row in one transaction, rotates the last weekly percentiles only on a first or weekly run, and publishes Game::DuelStatsComputed with its reason (first, season, weekly), heard by nobody yet. Game::ComputeDuelStatsJob runs it one at a time. A game rake task run from bin/docker-entrypoint beside game:backfill_achievements computes the first run when the table is empty, and db/seeds.rb does the same in development; Game::Handlers::SeasonPublished enqueues the job after commit with the season reason; config/recurring.yml runs it every Monday at 00:00 UTC in the development and production blocks. One query reads the rows for the card detail, the deck editor and later the duel snapshot and automatic moves; nothing else computes a percentile. The card detail (app/views/cards/_detail.html.erb) shows after ÉDITIONS the DUEL block of the edition its Prix moyen reads, as board 9 and DESIGN.md's Duel profile draw it: five rows with the stat's name, an 8px bar toward the stat's first direction hidden from assistive technology, the percentile in words naming the card's stronger side and the raw value, the trump's row marked ATOUT in an outline of the new --color-capsule-duel token (#9ec3e6, added to tokens.css), and Valeurs du <date>; every viewer sees it, a visitor included; the public card page does not; a card-season with no row has no block. Copy of Copy deck, Duel stats in en.yml and fr.yml, the labels in sentence case set in capitals by CSS."
verify = "One system test: after a run on fixture seasons, a visitor and a player open a card's detail and read its five stats in words, its ATOUT row and the values' date, and the public card page shows no DUEL block. Operation, query and job tests cover each measure, midrank ties, the rating tie broken by the review count, circulation ranked within its tier and season with the Archives excluded, an unpulled edition with no discovery or circulation, tribute and unrated card-seasons with no row, median distances, a trump in either direction, the rotation on first and weekly runs only, the event's reason, the season handler enqueueing after commit, the job running one at a time, and config/recurring.yml carrying it on Mondays at 00:00 UTC in both blocks."
covers = ["R1", "R2", "R3", "R4", "R5", "R17"]
after = []
hitl = false
risk = "high"

[[entry]]
id = 3
type = "story"
title = "A player builds a deck of twelve cards in the deck editor"
description = "Decks live in Game. One migration set creates game_decks (token, player, name of 1 to 24 characters by check) and game_deck_cards (deck, card-season, the card-season's card, slot 1 to 12 by check), unique on deck and slot and on deck and card, with every column this epic and epic 43 need. Each editor change is one Game operation taking player: (create, rename, add a card, take a card out, delete), under the player's bank lock in AD-10's order (decks and their cards before holdings), publishing one event heard by nobody, and refusing with a code: at most five decks, a name of 1 to 24 characters not already used by the player, an edition the player owns, a game at most once whatever its edition, at most 12 cards, an edition with no stats yet (not_yet_ranked, read from entry 1's query), and an edition needing a free copy (no_free_copy) unless it is already in another of the player's decks. Entering the player's first deck raises the holding's reserved by 1; leaving the last lowers it; deleting a deck frees only the copies this deck alone blocked. The deck editor is a rich screen at its own addresses (a new deck, and a deck by its token), a policy letting only the owner in and its POSTs rate limited per player, with one root controller holding its state module in app/frontend/lib/deck_editor.ts, as board 8 and DESIGN.md's Deck editor draw it: the name field saved on blur with its inline refusals (State Patterns, Deck name refused), the 12 slots each a button taking its card out, the collection with one entry per owned edition and its season beside its trump, Stats lundi in place of the trump for an edition with no stats, the Reserved tag on a fully reserved card; choosing a card fills the first empty slot, DANS LE DECK takes it out, a second edition of a game and a full deck are refused with their lines; each change saves at once, a failed save stays on screen with Enregistrement impossible, réessayez. and is retried with the next change; SUPPRIMER LE DECK asks its confirmation; on the phone a line under the top bar keeps the name and <n> / 12 in view; the collection is one tab stop with arrow keys, each card a toggle button (aria-pressed) whose name ends with dans le deck; status lines and focus as Focus after each step says. Game::ReleasePlayer drops the player's decks and their cards before their holdings, and the export (Game::ExportOf, PlayerExport) lists each deck's name and its cards. Copy of Copy deck, Decks and every errors.game code in en.yml and fr.yml."
verify = "One system test of Flow 11's first step: a player creates a deck, names it, adds twelve cards, is refused a second edition of one game and a thirteenth card, takes a card out by its slot, then deletes the deck after its confirmation and finds the copies free. Operation, model and policy tests cover each rule and failure code, reserved raised once for an edition in two decks and lowered only when it leaves the last, a fully reserved edition refused unless already in another deck, not_yet_ranked, the database checks, the lock order, another player refused the editor, the decks in the export and their drop at account deletion; Vitest covers the state module's retry of a failed save."
covers = ["R7", "R8", "R9", "R10", "R16", "R17"]
after = [1]
hitl = false
risk = "high"

[[entry]]
id = 2
type = "story"
title = "The DUELS tab, the Duels screen with the player's decks, and ÉCHANGES with its two sub-tabs"
description = "The crossed-blades tab icon joins script/pixel_art/export.mjs from the grid in DESIGN.md (Special capsules, Duel pixel grids) and is exported, never hand-edited. The phone's tabs (ShellHelper#shell_tabs, app/views/shell/_tab_bar.html.erb) become PONT · CAPSULE · SETS · ÉCHANGES · DUELS: ÉCHANGES is current on both its sub-tabs, the trade board and the Annonce, its badge sums the trades waiting for the player and the auctions needing them, named with both parts (Copy deck, Duel and Échanges badges, French plurals with their zero form), and the DUELS tab is aria-current true over the deck editor; the player menu shows on the Duels screen as on other top-level screens. The desktop hub menu (app/views/pages/_menu*.html.erb) reads 03 ÉCHANGES with the summed badge and 04 DUELS in MARCHÉ's place. ENTRE AMIS and MARCHÉ are links between the trade list's and the market's existing addresses, in a nav named Échanges with aria-current page on the current one, each with its own badge, focus going to the screen's h1; the ÉCHANGES tab and menu 03 open the sub-tab the player last used, kept per player through a housekeeping POST (a GET never writes), ENTRE AMIS the first time; the market's teaser and every link to the market keep working. A visitor keeps ACCUEIL and TOUTES LES CARTES and sees the market alone, with no sub-tab bar. The native apps' tab lists (mobile/ios/Gameble/Tabs.swift, mobile/android/app/src/main/java/net/gameble/app/Tabs.kt, their icons and strings) replace MARCHÉ with DUELS. The Duels screen is a new tab root with a policy for signed-in players (a visitor goes to the landing) and no back: MES DECKS · <n> / 5 with up to five deck rows (the name, <n> / 12 for a draft, the twelve covers as thumbnails hidden from assistive technology, one link to the editor named <deck>, 12 cartes or <deck>, brouillon, 9 sur 12), + NOUVEAU DECK while fewer than five, the five-deck line at five, and + NOUVEAU DECK alone with no deck, as board 1 draws it; on desktop the 1120px column of board 11 with the decks in the wide column, three per row, each in a 4 × 3 grid. The deck editor shows ◀ DUELS when opened from it. Slashes read as words through visually hidden text (MES DECKS · 3 / 5 as Mes decks, 3 sur 5). Copy in en.yml and fr.yml."
verify = "One system test at phone width: the DUELS tab opens the Duels screen with the player's decks and + NOUVEAU DECK, a deck row opens its editor with ◀ DUELS, ÉCHANGES opens ENTRE AMIS the first time and MARCHÉ once MARCHÉ was last used, an old market link still opens the market, and a visitor keeps two tabs and sees the market without the sub-tab bar; at desktop width the hub menu shows 03 ÉCHANGES and 04 DUELS. Helper, policy and component tests cover the tab list, the summed badge and its names, the kept sub-tab, the deck rows' accessible names and the five-deck and no-deck states; node script/pixel_art/export.mjs --check passes."
covers = ["R14", "R15", "R17"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "The deck editor sorts by stat, shows the week's moves and fills the gaps"
description = "In the deck editor, the collection sorts by any of the five stats in either direction and filters by trump, through the editor's state module. Each deck card shows, under it and never on its face, a text arrow in the text colour on each stat whose percentile moved by 5 points or more against the last weekly percentiles of entry 1, at 10px or more, hidden from assistive technology, with a visually hidden sentence (Popularité en hausse : 62, contre 55 lundi dernier) ending the card's name. One object, Game::DeckCoverage, gives for a deck the ten calls (five stats, two directions) with the deck's best percentile in each, a gap being a call with no card at 90 or above, and the fill: the player's best free card for each gap in turn, then the best remaining trumps, skipping a game already in the deck, an edition with no stats and an edition with no free copy that no other deck holds. The coverage strip COUVERTURE above the slots draws it (two rows of five, one row per direction pair wrapping on the phone, Manque on a gap); choosing a gap sorts the collection by that call; COMPLÉTER LES MANQUES, a secondary button under the strip, adds the chosen cards through one operation in one transaction under the rules of entry 3. Copy in en.yml and fr.yml."
verify = "One system test: on a draft deck, a player chooses a gap in the coverage strip and sees the collection sorted by that call, then COMPLÉTER LES MANQUES fills the empty slots, and a deck card moved by 5 points since the last weekly run shows its arrow. Query and operation tests cover DeckCoverage's best percentile per call, the 90 threshold, the fill order and what it skips, the arrows' 5-point threshold against the last weekly percentiles, and the fill refused as a whole when a rule refuses a card; Vitest covers the sort and the trump filter."
covers = ["R11"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "A deck card's copy is named and freed on the trade, sale and entrust screens"
description = "Game::ReservedCopies (app/domains/game/app/queries/game/reserved_copies.rb) gains the in-deck share, 1 when the edition is in one of the player's decks, in trade becoming what remains after it and the listings. The Reserved tag reads Dans un deck, one copy whatever the number of decks. On the card picker (app/views/trades/_picker.html.erb), Confier (app/views/market/entrustments) and Mettre en vente (app/views/market/sales), for the owner only, Game::DecksHolding names the decks that hold the edition (Dans : Vieux briscards, Confidentiels) and RETIRER DES DECKS opens its confirmation (Retirer <carte> de <n> decks ? Un deck complet redevient un brouillon.) then runs Game::RemoveFromDecks, one operation taking the edition out of every deck of the player under the deck lock order and lowering reserved once, after which the copy can be picked, entrusted or listed. On a friend's side of the trade board a deck-blocked copy counts as unavailable, is never offered and names no deck. Spare copies (free copies beyond one per game) come from one function, used by the trade suggestions (Game::TradeSuggestions::Spares, FreeEditions) and the market desk (Game::Market::PlayerDesk) alike. Tests prove that declining, cancelling and expiring a trade, cancelling or selling a listing, and going private never free a deck block. Copy in en.yml and fr.yml."
verify = "One system test of Flow 11's failure: a player opens a trade board, finds a deck card tagged Dans un deck with its deck named, takes it out of its decks after the confirmation and places it; Confier and Mettre en vente show the same tag and action. Query and operation tests cover the in-deck share beside listings and trades, DecksHolding, RemoveFromDecks over two decks, the friend's picker never offering a deck-blocked copy, the one spare-copy function giving the same count to suggestions and the desk, and trade and market releases and going private leaving the deck block."
covers = ["R12", "R13"]
after = [3]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Each Monday the feed says the cards' standing has moved"
description = "Expand/contract migrations on game_feed_entries: one makes player_id nullable and adds a check, not valid, that only kind duel_stats has no player, a second validates it; one adds the moved cards column; one adds concurrently a unique index giving one duel_stats entry per week. Game::FeedEntry::KINDS gains duel_stats, and the feed queries (Game::FeedEntries, Game::NewFeedEntries), the visibility question and anything reading an entry's player handle an entry with no player. A feed handler on a weekly Game::DuelStatsComputed, and only a weekly one, inserts the week's entry with ON CONFLICT DO NOTHING: per card its move is its largest change of one stat's percentile against the last weekly percentiles (the first Monday comparing with the deploy's run), and the entry keeps the three largest rises and the three largest falls with the stat and both percentiles. It is drawn as the Chattomètre's weekly entry is, with no card image: Le cours des cartes a bougé., then up to six rows, each the card's name linked to its page, the stat and both percentiles in words (Quake, popularité en hausse, de 55 à 62), any arrow as text. It shows under TOUS and the TOUT filter only, never under AMIS or another filter, and never in the ticker. Copy in en.yml and fr.yml."
verify = "One system test: after a weekly run that moves cards, the feed's TOUS shows Le cours des cartes a bougé. with three rises and three falls linked to their cards, and neither AMIS nor the ticker shows it. Migration, handler and query tests cover one entry per week whatever the number of weekly runs, none from a first or a season run, the largest single-stat change chosen per card, the first Monday comparing with the deploy's run, the check refusing an entry of another kind with no player, and the feed pages and the visibility question with an entry that has no player."
covers = ["R6"]
after = [1]
hitl = false
risk = "high"


type = "story"
title = "Two streak achievements over capsules and daily bonuses"
description = "Adds Luck Is a Marketing Concept (ten standard capsules in a row, in opened_at order, with no card of Rare or better) and Leave Request Denied (the daily bonus collected seven UTC days in a row) as longest-run metrics over game_packs and game_daily_bonus_claims, GrantAchievementsJob following Game::DailyBonusCollected, with the approved copy and glyphs; their backs come with entry 11."
verify = "Query tests on fixtures grant each at exactly ten capsules and seven days and not at nine and six, a broken run restarts the count, the backfill grants them from history, and the achievements screen shows them in both languages."
covers = ["E1", "E3"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Two collection achievements, one on copies and one on a studio"
description = "Adds Diversified Portfolio (five copies of one game held at once, summed across its editions) and Market Concentration (ten different games of one studio held at once, the studio being the card's first developer normalised as studio sets do, read through a new Catalog query), as metrics over the current game_holdings, with the approved copy and glyphs."
verify = "Query tests grant Diversified Portfolio at five copies spread over two editions and Market Concentration at ten games whose developer names differ only in the forms studio sets merge, neither at one less, the backfill grants them from the current collection, and packwerk passes."
covers = ["E1", "E3"]
after = [7]
hitl = false
risk = "medium"
unknown = "Whether copies reserved by an open trade count as held (counting them, as quantity does, is recommended), and the cost of normalising the studios of a player's held cards in Ruby on every grant job."
references = ["spec-gameble/catalog-and-rarity.md"]


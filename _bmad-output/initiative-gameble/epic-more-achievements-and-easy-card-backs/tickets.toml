# tickets.toml — the epic's agreed children, in build order. tickets.py reads it.
# Requirement ids E1-E5 are the epic's Requirements; references are relative to _bmad-output/initiative-gameble/.

[[entry]]
id = 1
type = "story"
title = "A capsule with two Rare-or-better cards earns Statistical Non-Compliance, in play and from history"
description = "The tracer bullet: Game::AchievementProgress computes only the metrics of achievements the player has not unlocked and Game::GrantAchievement re-reads under the bank lock only the metric it grants, the first one-capsule metric counts opened regular packs whose card_season_ids hold two cards of Rare or better, Game::Achievements gains statistical_non_compliance, and its name and condition keys land in en.yml and fr.yml (English from achievements.md, French a builder draft, both replaced by entry 5) with an existing glyph on the achievements screen."
verify = "On staging a player whose recorded packs already hold one with two Rare-or-better cards gets the achievement from bin/rails game:backfill_achievements with no toast, a new such opening grants it once with a toast, the screen shows it in English and French, and query, operation, job and system tests cover the metric on fixtures."
covers = ["E1", "E3"]
after = []
hitl = false
risk = "medium"
unknown = "Whether AchievementProgress stays one SQL statement once it skips earned metrics, or splits into one query per metric family that the later entries extend."
references = ["architecture-gameble/architecture-gameble.md#ad-37", "spec-gameble/achievements.md"]

[[entry]]
id = 2
type = "story"
title = "The achievements' final titles and glyphs are written and drawn"
description = "The author and bmad-ux write in EXPERIENCE.md the final English and French title and condition of all twenty-three achievements, in the Brotherhood's tone and with no flavor text, and draw in DESIGN.md the glyphs of the thirteen new ones; the list, the four backs (Trèfle fané, Assidu, Siège social, Contrat), N = 10 and the Personalization page were settled on 2026-10-31 and 2026-11-01."
verify = "EXPERIENCE.md holds the twenty-three titles and conditions in both languages, DESIGN.md holds the thirteen glyphs, and the author approves them."
covers = ["E1", "E2"]
after = []
hitl = true
risk = "low"
references = ["spec-gameble/achievements.md", "spec-gameble/brotherhood-tone.md", "ux-gameble/DESIGN.md", "ux-gameble/EXPERIENCE.md"]

[[entry]]
id = 3
type = "story"
title = "The booster records how each capsule was revealed"
description = "Adds game_packs.reveal_mode (null, all or one_by_one; the check added then validated in a second migration), Game::RecordReveal behind POST /:locale/packs/:token/reveal with its Pundit policy, accepted only for the player's latest opened pack while its mode is null and publishing Game::PackRevealed with the player id (which entry 10 follows), the booster sending it for every pack kind, all when Tout révéler was used and one_by_one otherwise, once the last card is face up, and the player data export listing each pack's mode."
verify = "On staging a regular and a special capsule revealed with Tout révéler store all and one turned card by card stores one_by_one, a repeat or a POST on an older pack changes nothing, the export shows the mode, db/schema.rb is regenerated from the migrations, and operation, request, vitest and booster system tests cover both modes."
covers = ["E1"]
after = []
hitl = false
risk = "high"
unknown = "A capsule left before its last card is face up keeps a null mode and breaks both reveal streaks; and whether the legal page's stored-data line on capsules already covers the reveal mode."
references = ["architecture-gameble/architecture-gameble.md#ad-23", "architecture-gameble/architecture-gameble.md#ad-37"]

[[entry]]
id = 4
type = "story"
title = "A release grants new achievements from history before it takes traffic"
description = "The entrypoint runs the idempotent achievement backfill (game:backfill_achievements) after db:prepare and before the server takes traffic, so achievements a release adds are granted retroactively without a toast, with RELEASING.md saying so; the author checks it on a staging candidate."
verify = "A staging deploy of a candidate with entry 1 grants Statistical Non-Compliance to players whose history meets it before the first request, announces nothing, a second boot grants nothing more, and the author records the boot time it added."
covers = ["E3"]
after = [1]
hitl = true
risk = "high"
unknown = "Whether the boot time the backfill adds inside Kamal's health-check window stays acceptable as players grow; if not, the step moves to RELEASING.md (author, 2026-11-01)."
references = ["architecture-gameble/architecture-gameble.md#ad-37"]

[[entry]]
id = 5
type = "story"
title = "The ten achievements are renamed"
description = "Swaps in the approved English and French titles and conditions of the ten existing achievements and the approved copy and glyph of Statistical Non-Compliance, keeping every key and earned grant, and updates the landing's Succès tile that lists the old names."
verify = "In English and French the achievements screen, the profile's latest achievements, the allocation recap, the landing tile and an unlock toast show the new titles, a player's earned rows are untouched before and after, and i18n-tasks and the system tests pass."
covers = ["E2"]
after = [1, 2]
hitl = false
risk = "low"
references = ["ux-gameble/EXPERIENCE.md"]

[[entry]]
id = 6
type = "story"
title = "Three more one-capsule achievements"
description = "Adds Packaging Irregularity (two copies of one game in any capsule), Excellence in Mediocrity (five Commune cards in a standard capsule) and Historical Asset Management (a game released before 2000 and one released in 2025 or later in any capsule, read from the card's release date) as one-capsule metrics over recorded packs, with the approved copy and glyphs."
verify = "Query tests on fixture packs grant each achievement on its matching pack and not on a near miss, the backfill grants them from history without a toast, and the achievements screen shows them in both languages."
covers = ["E1", "E3"]
after = [5]
hitl = false
risk = "low"
unknown = "How often Historical Asset Management can happen depends on the production catalog's share of games released before 2000 and from 2025."

[[entry]]

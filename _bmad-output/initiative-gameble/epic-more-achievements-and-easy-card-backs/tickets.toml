[[entry]]
id = 11
type = "story"
title = "The four hardest achievements unlock their backs"
description = "Draws and exports with script/pixel_art the four backs DESIGN.md describes (Trèfle fané, Assidu, Siège social, Contrat, with their pixel words TREFLE, ASSIDU, SIEGE, PACTE), adds their names under card_backs.names in en.yml and fr.yml, and adds them to Game::CardBacks::ACHIEVEMENT_BACKS for Luck Is a Marketing Concept, Leave Request Denied, Market Concentration and A Strictly Professional Relationship, so the existing back handler grants them on AchievementUnlocked, without a toast when the grant is retroactive, and each tile shows its DOS image; it leaves card_backs.conditions and the card backs helper to entry 12."

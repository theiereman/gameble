[[entry]]
id = 12
type = "story"
title = "The Personalization page picks a back in one step and says how each back was earned"
description = "Reworks the Personalization page to the design of 2026-10-31 (EXPERIENCE.md, mockups/personalization.html): Vitrine and Titre de profil grouped, the DOS DE CARTE mosaic grouped by origin in the catalog order with the active back framed in place, one strip naming the hovered, focused or tapped back, no toast on equip; the player equips a back in one action, Game::CardBackShelf gives each earned back how it was earned (the set and its seasons, the community goal, the achievement by its locale name, the event) and each locked back how to earn it (naming the achievement or the set), owning card_backs.conditions, the card backs helper and personalizations.show.card_back in en.yml and fr.yml, through the existing Game::ChooseCardBack."
verify = "In English and French a system test equips an unlocked back in one action, reads the earned line of a set back, the goal back and Centurion, reads the locked line naming its achievement as I18n gives it, sees a locked back refused even by a forged request, and the page passes the accessibility checks of the existing tests."
covers = ["E5"]
after = []
hitl = false
risk = "medium"
unknown = "Whether the goal back's line names the week it was earned, read from the player's first game_goal_rewards row, since the unlock row keeps only unlocked_at and CAP-20 says only weekly goal."
references = ["ux-gameble/DESIGN.md", "ux-gameble/EXPERIENCE.md", "ux-gameble/mockups/personalization.html", "epic-personalization/story-the-back-picker-on-the-personalization-page-plan.md"]


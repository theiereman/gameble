[[entry]]
id = 16
type = "story"
title = "An achievement that unlocks a card back is claimed by the player, and the menu flags a reward waiting"
description = "Staging feedback, 2026-11-02 (author): when an achievement unlocks something, the player must press a Claim button, and the Achievements entry shows an indicator while a reward waits for the player's interaction to be added to the list on the profile. Scope: every achievement that unlocks something (today a card back). Earning the achievement still happens as today; the back joins the player's backs (the Personalization shelf and the profile) only when claimed, through a POST operation that writes the claim and publishes its event. The Achievements row shows a Claim button on an earned achievement with an unclaimed back, then the usual 'back unlocked' state; the Achievements entry of the menu (desktop and phone) shows a count badge of unclaimed rewards, as the friend invitation count does. Decided 2026-11-02 (author): (1) the claim applies to every achievement that unlocks something, today the card backs, and any reward added later goes through the same claim; (2) what a player already holds stays claimed, with no action and no badge. Build after the achievement rows redesign, which owns the same row."
verify = "An achievement with a back earned but not claimed shows a Claim button and counts in the menu badge; claiming adds the back to the Personalization shelf and clears the badge when none is left; a back held before the release shows no Claim button; a GET never writes; the claim is refused for another player's achievement or one not earned."
covers = []
after = [14]
hitl = false
risk = "medium"

[[entry]]
id = 17
type = "story"
title = "Claiming an achievement updates the page in place, keeping the scroll"
description = "Author on staging, 2026-11-02: actions such as claiming an achievement must keep the scroll position and not reload the whole page. Answer the claim POST with a Turbo Stream (HTML redirect stays as the fallback without JavaScript): replace the claimed row (its Claim button gives way to the unlocked back state), update the Achievements menu badge on desktop and phone (and remove it at zero), update the earned and to-earn counts and the gauge of the page head, and send a toast or announce the result in a polite status for screen readers; keep focus on a sensible element (the row or the next Claim button). Check the other one-click actions of the Achievements and Personalization pages and of the settings sync button: where one redirects and loses the scroll, give it the same stream answer, within the same story if small, else list it in the plan."
verify = "On a long Achievements page, claiming a row far down leaves the scroll where it was, updates the row, the counts and the menu badge without a full reload (the page's navigation timing shows no new document), and still works without JavaScript through the redirect; the claim tests cover both formats."
covers = []
after = [16]
hitl = false
risk = "low"

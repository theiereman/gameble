[[entry]]
id = 14
type = "story"
title = "The achievement tiles read cleanly and are not squashed"
description = "Staging feedback, 2026-11-02 (author): the new achievements are right but the display is not: the tiles are too squashed, the texts are not clean and the information is too packed (title in uppercase over two lines, condition, and the unlocked back with its thumbnail all in one small tile). Redesign the tile of the Achievements page: give it room, a clear hierarchy (glyph, title, condition), the earned back shown apart from the condition, titles that never wrap awkwardly, on desktop and phone. Check the same titles on the landing tile and in the toasts. Decided 2026-11-02 (author), from the mockup ux-gameble/mockups/achievements-and-personalization-layout.html: option B, one row per achievement (glyph, title in the title font with the condition beneath, the earned or unlockable back and the progress on the right, below the text on a phone)."
verify = "On staging at desktop and phone widths, no tile clips, squashes or wraps a title over more than two lines; the back unlocked by an achievement is readable beside it; the achievements system tests pass."
covers = []
after = []
hitl = true
risk = "low"

[[entry]]
id = 15
type = "story"
title = "The Personalization page shows the card back picker before the title picker, and the title picker takes less room"

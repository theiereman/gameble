# tickets.toml — the stories of epic 10, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Collection and sets"
description = "Rebuilds the collection screen: set filters and progress, the grid of owned faces with copy badges and missing slots naming the game, pagination beyond about 60 slots, and NOUVEAU from a holding's last_gained_at against the watermark in game_player_states, moved by a POST from the player's own collection page."
verify = "A player sees each set's progress and slots on desktop and phone; cards gained after the last visit show NOUVEAU once and lose it after the next visit; reserving a card never marks it; a visitor sees every slot empty."
covers = ["R1", "R6"]
after = ["4.7", "8.4", "8.6"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "Card detail"
description = "Rebuilds the card detail (\"FICHE DE LA CARTE\"): the card large with its facts, copies owned, \"VOIR SUR STEAM\" and \"PARTAGER\", the Standard back faded for a card not owned, and on the phone a sub-view frame advancing the URL with previous and next buttons and swipe."
verify = "From the collection, a revealed booster card or the showcase, the detail opens with every fact in both languages; on a phone, previous and next move through the set and Back returns to the grid at its scroll."
covers = ["R2", "R6"]
after = ["8.6"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Public profile and shared card page"
description = "Restyles the public profile, and the shared card page as the design's public card page without any sharer: the card tilting, its facts, the Steam link, the call to sign in, and a share sheet; previews keep title and rarity with no image; a browser below the supported floor sees a line asking to update it instead of the invitation to sign in."
verify = "A signed-out visitor opens a shared link and sees the card only, no player named; a profile shows its sets in the new design; preview tags carry no image."
covers = ["R3", "R6"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Daily booster and settings"
description = "Adds the hub's daily booster panel (claim into the reserve with its arc to the packs chip, full-reserve state, countdown to midnight UTC, the 3-card reveal count) and the profile and settings screen with language, \"Animations réduites\" stored in Accounts and mirrored in a cookie, and sign-out, driving one shared motion switch for CSS, Stimulus, islands and View Transitions."
verify = "A player claims the daily booster once a day and is refused at a full reserve; turning on \"Animations réduites\" stops the ticker, every loop and the screen transitions, signed in or out."
covers = ["R4", "R5", "R6"]
after = ["8.2", "8.11"]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Airier spacing, a centred booster opening and a still star field"
description = "Raises the panel padding and the gaps between panels, rows, chips and cards across every screen by about one step of the scale, centres the booster opening horizontally and vertically in the window without resizing it, and stops the star field's sideways shift at screen changes, leaving a few stars that twinkle softly."
verify = "On a large window the opening sits centred with room between its components and nothing resized; changing screen leaves the stars where they are; with \"Animations réduites\" on, nothing twinkles; the hub, collection and card detail show more space between their parts."
covers = ["R7"]
after = [4]
hitl = false
risk = "low"
notes = ["exact gap values are tuned on the built screens (DESIGN.md Breathing room, confirmed by the author on 2026-10-07)"]

[[entry]]
id = 7
type = "story"
title = "Collection opens on owned cards, with a filter zone and a search"
description = "The collection opens on the cards the player owns, newest first; one folded FILTRES zone of toggleable chips (state: owned, all, missing, new, duplicates; rarity; set; genre; OR within a group, AND across) with an active count and a clear-all replaces the rows of chips, and a search over title and publisher combines with them, on desktop and phone (a sheet)."
verify = "A player opens the collection and sees owned cards first; switching state to missing shows the empty slots naming the game; two genre chips show either genre, adding a rarity chip narrows to both; typing a title narrows the grid as they type; the empty result shows the empty-filter line."
covers = ["R7", "R1"]
after = [1, 6]
hitl = false
risk = "medium"
notes = ["filter groups, the folded default and the search were confirmed by the author on 2026-10-07", "the sets progress rows keep their place; RAPPORT panel unchanged", "a sort and filter by average market sale price is a V2 requirement (later-roadmap.md): no sales exist before the auction house, so this story builds none of it but leaves room for one more filter group and a sort"]

[[entry]]
id = 5
type = "story"
title = "Refactor sweep"
description = "Cleanup only, scoped when it starts from the epic's build records and the review findings deferred during it, ending with no screen of the medieval direction left."
verify = "The full test suite, lint, packwerk and typecheck pass, no medieval asset or style remains, and every deferred finding is fixed, recorded or dropped with a reason."

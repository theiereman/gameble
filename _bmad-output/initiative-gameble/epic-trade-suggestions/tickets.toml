hitl = false
risk = "low"
references = ["ux-gameble/DESIGN.md", "ux-gameble/EXPERIENCE.md"]

[[entry]]
id = 3
type = "story"
title = "Mutual suggestions come first, at a cost that does not grow with friends"
description = "`Game::TradeSuggestions` adds, for each friend open to trades, the missing games of their goals on game sets only (never a custom set) against the player's own spares by the same rule, in a batched read whose query count does not depend on the number of friends, puts mutual suggestions first with every player spare the friend misses placed on the give side up to 4, fills the suggestions in friend order without placing a game or a copy twice, and measures its cost on the seeded worst case."
verify = "A friend who spares a card the player misses and misses a card the player spares is listed before a one-sided friend, a friend's custom-set goal never makes a suggestion mutual, sending it proposes both sides, a query-count test holds with 1 and 30 friends, and the read stays under 200 ms of server time on a seeded worst case of 100 friends each with 5 goals of 50-game sets."
covers = ["E2", "E4"]
after = [2]
hitl = false
risk = "high"
unknown = "Whether AD-38's deferred suggestion cache is needed to hold the 200 ms budget; if the measure fails, bmad-architecture designs it before this entry ships."
references = ["architecture-gameble/architecture-gameble.md#ad-38", "architecture-gameble/architecture-gameble.md#ad-11"]

[[entry]]
id = 4
type = "story"
title = "A trade started from a suggestion follows the trade rules"
description = "A suggestion places at most four card-seasons per side ranked by AD-38, drops a placed card the friend or the player no longer spares when the board opens or the proposal is sent, writes the friend's stored new-proposal draft only when the player changes the prefilled board or sends it and then replaces the address with the plain new-trade one, and leaves an opened but unsent suggestion a suggestion, the prefill contract of entry 2 being the only way in."
verify = "A suggestion with six candidate cards prefills four in AD-38's order; a card traded away since the list was read is not placed; a hand-built draft survives looking at a suggestion; reload or Back after a send never re-applies it; a crafted prefill URL for a private friend or for cards the friend lacks is refused or ignored; controller, vitest and system tests cover it."
covers = ["E3"]
after = [2]
hitl = false
risk = "medium"
references = ["architecture-gameble/architecture-gameble.md#ad-8", "architecture-gameble/architecture-gameble.md#ad-38"]


[[entry]]
id = 11
type = "story"
title = "Suggestions stay few: only friends who hold the missing card as a duplicate, capped per goal"
description = "Staging feedback, 2026-11-02 (author): suggestions take too much room, above all when a goal's set is large (an adventure set with many missing cards), and risk dominating the page. Narrow Game::TradeSuggestions: a friend is suggested only for a card they hold as a duplicate (more than one copy), so a single free copy no longer counts (this reverses the earlier reading where any free copy counted); cap the suggestions per goal so one large set cannot fill the list, and keep the list of three. Ranking, mutual-first and the declined-never-returns rule stay. Decided 2026-11-02 (author): at most one suggestion per goal, and a friend holding only a single copy of the card is never suggested."
verify = "A goal with fifty missing cards gives at most one suggestion and never more than three in all; a friend whose only copy is the one they use is not suggested; the existing tests are updated to the duplicate rule and pass."
covers = []
after = []
hitl = false
risk = "medium"

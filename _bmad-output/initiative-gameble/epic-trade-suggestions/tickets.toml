# tickets.toml — the epic's agreed children, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "The trade suggestions are designed"
description = "The author and `bmad-ux` design, in DESIGN.md and EXPERIENCE.md with French and English copy, the SUGGESTIONS section of the Échanges screen, its rows, the start and send actions, the states with no suggestion and a private player, the Brotherhood's go-between line, and the friend actions that open a new draft once trades between two friends are unlimited."
verify = "DESIGN.md and EXPERIENCE.md describe each of those places and states with copy in both languages, and the author approves them."
covers = ["E1", "E2", "E3", "E4", "E5"]
after = ["28.2"]
hitl = true
risk = "low"
references = ["ux-gameble/EXPERIENCE.md", "ux-gameble/mockups/trade-suggestions.html", "spec-gameble/brotherhood-tone.md"]

[[entry]]
id = 8
type = "story"
title = "Two friends can hold any number of open trades"
description = "Lifts the one-open-trade-per-pair rule as AD-8's Costs list it: drops the per-pair partial unique index on game_trades concurrently in its own migration, removes ProposeTrade's trade_already_open check and the new-trade redirect with their locale keys, adds the trade_already_sent refusal of a proposal equal to an open one the same player sent the same friend, stops OpenTradesByFriend mapping a friend to one trade, makes ÉCHANGE on the friend row, the friend chooser, the friend profile and the public profile open the friend's new-proposal draft, and has the remove-friend dialog count the open trades it cancels."
verify = "A player sends two different proposals to one friend and both stay open, reserving only their own offers; the same proposal sent twice creates one trade; ÉCHANGE opens the friend's draft with trades open; removing the friend cancels every trade and releases every reservation; db/schema.rb is regenerated from the migrations; operation, controller and system tests cover it."
covers = ["E5"]
after = []
hitl = false
risk = "high"
references = ["architecture-gameble/architecture-gameble.md#ad-8", "architecture-gameble/architecture-gameble.md#ad-10", "spec-gameble/spec-gameble.md#cap-11", "ux-gameble/EXPERIENCE.md"]

[[entry]]
id = 10
type = "story"
title = "The menu shows how many friend invitations wait for the player's answer"
description = "Friend invitations the player received and has not answered get the orange count badge, built like the trades-waiting badge: on 05 AMIS in the desktop menu, and on the phone on the PLUS tab and on Amis in the PLUS list; a sent invitation never counts; the number is part of the item's accessible name, hidden at zero in the tab bar and greyed at zero in the menu; it updates live through the player stream when an invitation arrives, is accepted, ignored or cancelled."
verify = "A player who receives an invitation sees the badge with 1 on AMIS on desktop and on PLUS and its Amis row on the phone, in English and French, without reloading; accepting or ignoring it clears the badge; the sender sees no badge; helper, controller and system tests cover it."
covers = ["E6"]
after = []
hitl = false
risk = "low"
references = ["ux-gameble/EXPERIENCE.md", "spec-gameble/spec-gameble.md#cap-10"]

[[entry]]
id = 2
type = "story"
title = "A player sees which friends spare their goals' missing cards and starts a trade from one"
description = "The tracer bullet: `Game::TradeSuggestions` reads, on the reading role, the player's `Game::GoalNeeds` and the holdings of each friend open to trades, applies AD-38's spare rule (a game already in an open trade between the pair is not a spare), ranks friends and cards and keeps at most 3 one-sided suggestions; the Échanges screen shows them in the SUGGESTIONS section as the design draws them (goal bookmarks, the title summary, ENVOYER), hides the section when there is none, shows none to a private player and never names a private, banned or deleted friend; ENVOYER posts the suggestion through `Game::ProposeTrade`, and the row's opener is a link that renders the prefilled board, addressed by slug and season, without writing the stored draft."
verify = "On staging a player whose goal misses two games sees, in English and French, the friend holding a spare of each but not one holding a single copy, one whose spare is reserved, or a private friend, and sees nothing once they go private; ENVOYER sends the trade and the suggestion leaves the list; the opener shows the board with those cards requested and a reload keeps the stored draft; query, policy, controller and system tests cover it."
covers = ["E1", "E3", "E4"]
after = [1, 8, "28.9"]
hitl = false
risk = "high"
references = ["architecture-gameble/architecture-gameble.md#ad-38", "architecture-gameble/architecture-gameble.md#ad-35", "architecture-gameble/architecture-gameble.md#ad-8", "ux-gameble/mockups/trade-suggestions.html"]

[[entry]]
id = 9
type = "story"
title = "Goal bookmarks show on every trade board"
description = "The cards of every trade board, on both sides, carry the player's goal bookmarks with the Goal bookmark rule (top-left corner of the card's image), and a card's accessible name ends with its goals, as everywhere the player's goals mark cards."

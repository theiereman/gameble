[[entry]]
id = 16
type = "story"
title = "Connection pools sized"
description = "The reading role opens a second connection pool to the primary, so each web process may hold up to 2 x RAILS_MAX_THREADS primary connections. Counts every pool (web reading and writing, Solid Queue, Solid Cache, Solid Cable) per process and per host, sets the pool sizes so their total stays under Postgres max_connections on the staging host, and records the figures."
verify = "A test or a check task computes the connections the configured pools can open and fails above a set limit; on staging, the author compares that total with Postgres max_connections and the figures are recorded in the epic Notes."
covers = ["R7"]
after = [13]
hitl = true
risk = "medium"
references = ["epic-space-terminal-redesign/epic-space-terminal-redesign-retrospective.md", "deferred-work.md"]

[[entry]]
id = 17
type = "story"
title = "Quiet benchmark task in full test runs"
description = "A full or directory run of bin/rails test prints the pack-opening benchmark's constant-redefinition warnings once per worker, because test:prepare loads the .rake files before the workers fork. Moves the benchmark class out of packs/game/lib/tasks/game_benchmark.rake into a file loaded once, so the task keeps its behavior and the warnings disappear."
verify = "A full bin/rails test run prints no already-initialized-constant warning on stderr, and RAILS_ENV=test bin/rails game:benchmark_open_pack still runs and reports its p95."
covers = []
after = [13]
hitl = false
risk = "low"
references = ["deferred-work.md"]

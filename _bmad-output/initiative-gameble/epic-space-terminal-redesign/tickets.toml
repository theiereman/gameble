[[entry]]
id = 10
type = "story"
title = "Opening exchange"
description = "Turns POST /packs into AD-23's JSON exchange: an idempotency key and the pack's card back stored on the opened pack and replayed before any throttle or availability check, the response with the kind, the server-rendered faces, slugs, tiers, covers, bank count and times, server time and pre-open tier counts, the fixed error codes, and the \"mon dernier booster\" page face up."
verify = "Two posts with one key open one pack and return the same cards, a refused open returns its code and opens nothing, a daily bonus pack returns 3 faces, and the last-booster page shows the pack face up."
covers = ["R5"]
after = [4, 6]
hitl = false
risk = "high"


[[entry]]
id = 9
type = "spike"
title = "Performance on the reference phone"
description = "Measures, on the low-end Android the author picks, the filter worker on a 30-card page, a Légendaire sequence and an idle hub, and the POST /packs p95, and records whether AD-27's budget holds or what must change."
verify = "A short report gives the measured frame rates and p95 with the device and method, and names any change the booster stories must make."

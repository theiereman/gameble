[[entry]]
id = 7
type = "story"
title = "The landing's modules power on"
description = "Adds the modules' one-time power-on as their top edge passes 85% of the viewport, the star field's drift with the scroll on the landing only, and the side position gauge from 1440px with its focus-moving markers, their maths in tested pure modules, all still under reduced motion."

[[entry]]
id = 10
type = "story"
title = "The roadmap derives from the initiative"
description = "Adds opt-in roadmap fields to the initiative's epics and entries for the author's player-facing wording, a script that generates the app's roadmap data and its en/fr strings from them, a CI check that fails on drift, and the AGENTS.md rule that keeps both in step."
verify = "Running the script on the initiative produces the roadmap data with each chosen ticket's status, and changing a chosen ticket's status or wording without rerunning it fails CI."
covers = ["R5", "R8"]
after = []
hitl = false
risk = "medium"

[[entry]]
id = 19
type = "story"
title = "Roadmap milestones created from the initiative and curated in the back-office"
description = "Keeps the roadmap in the database: milestones, and a few player-facing stories under each, each with its wording in French and English, whether it is shown, its status (done, in progress, to come) and its order. Every deploy creates one milestone for each epic of the initiative's tickets.toml that has none yet, identified by the epic's slug, in that file's order, worded with the epic's title and to come, never editing or deleting an existing milestone. Milestones come only from that creation, so a removed epic leaves a milestone to hide rather than one recreated at the next deploy; administrators manage them and the stories under each in back-office pages that follow the existing ones. Nothing in the repository has to be kept in step and no CI check compares the roadmap with the initiative; a stale roadmap is accepted. No public display: stories 11 and 12 render it."
verify = "After a deploy (or the task it runs) on a database without milestones, there is one milestone per initiative epic in the file's order with its title and to come; running it again, or after an epic is renamed, creates nothing and leaves staff edits as they were. An administrator can reword in both languages, show or hide, set the status of and reorder each milestone, and add, reword, show or hide, set the status of, reorder and delete the stories under it; a moderator and a player cannot reach those pages."
covers = ["R5"]
after = []
hitl = false
risk = "medium"


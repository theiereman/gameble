[[entry]]
id = 8
type = "story"
title = "Cards drift over the landing"
description = "Adds the few cards passing over the content faster than the scroll on desktop with a fine pointer and room in both gutters, draggable aside until reload, faded while focus is in the content, hidden from assistive technology, absent on the phone and under reduced motion."

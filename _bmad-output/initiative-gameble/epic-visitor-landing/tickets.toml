# tickets.toml — the epic's stories, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "The app speaks JetBrains Mono"
description = "Replaces Space Mono with JetBrains Mono 700 across the app and the static error pages, fonts, preloads and licence file included, keeping VT323 for large text as DESIGN.md says."
verify = "No Space Mono file or reference is left in the app or public/errors, every screen and error page renders in JetBrains Mono, and the font licence ships beside it."
covers = ["R8"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 2
type = "story"
title = "The landing's shell for visitors"
description = "Serves the landing to signed-out visitors at a provisional address with its top bar, the hero without its lamp, the nine modules with their static copy and example tiles, and the footer, in French and English, on phone and desktop, under the enforced CSP; a signed-in player who opens it gets the hub."
verify = "Signed out, the provisional address shows the nine modules in both languages on phone and desktop with no CSP report and one h1 and one h2 per module; signed in, it redirects to the hub."
covers = ["R1"]
after = [1, "7.10"]
hitl = false
risk = "medium"
unknown = "Which cards the hero, module 01 and the moving cards sample."

[[entry]]

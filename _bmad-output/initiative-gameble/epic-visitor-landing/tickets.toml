title = "The roadmap page and the pioneer row designed"
description = "A bmad-ux session with the author designs the full roadmap page and the card detail's pioneer row (with its « anonyme » form), and rewords the landing's « Découvrez » tile so it promises no name to every viewer; DESIGN.md and EXPERIENCE.md record both."
verify = "DESIGN.md and EXPERIENCE.md describe the roadmap page and the pioneer row, and the author approved them."
covers = ["R5", "R6"]
after = []
hitl = true
risk = "low"

[[entry]]
id = 4
type = "story"
title = "The lamp finds the lost games"
description = "Builds the hero's lamp field: cards under a veil, the lamp following a fine pointer and sweeping on its own on touch, the found-games count, the veil moved by translate3d, its maths in a tested pure module, and its reduced-motion form."
verify = "With a mouse the lamp follows the pointer and sweeps after it stops, on a phone it sweeps, the count stops once every card is found, and under reduced motion the lamp jumps to the pointer with nothing animating."
covers = ["R1", "R3"]
after = [2]
hitl = false
risk = "high"

[[entry]]
id = 5
type = "story"
title = "The landing shows the season and the weekly goal"
description = "Adds the queries the landing reads (the goal's participants, active players this week, capsules opened today, first discoveries this week) and shows the season panel and module 02's goal panel from them, the end time in the visitor's time zone, each block cached per locale."
verify = "The landing shows the published season with its three facts and the current goal with its count, gauge and participants, a second request inside the cache window runs none of the queries, and an empty game shows the designed empty states."
covers = ["R2"]
after = [2, "6.3"]
hitl = false
risk = "medium"
unknown = "What « cette semaine » and « aujourd'hui » mean (calendar week or the goal's week, which time zone)."


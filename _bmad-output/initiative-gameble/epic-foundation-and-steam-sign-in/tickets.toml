[[entry]]
id = 5
type = "story"
title = "Front-end toolchain"
description = "Sets up TypeScript, Stimulus and Turbo Mount under Vite, with one sample React component that receives its data and its translated strings as props."
verify = "The sample component renders in both locales and the type check runs in CI."
covers = ["R5"]
after = [4]
hitl = false
risk = "low"

[[entry]]
id = 6
type = "story"
title = "Steam sign-in"
description = "Adds sign-in through OmniAuth and omniauth-openid: `Steam` verifies the response, `Accounts::SignIn` creates or reuses the player and publishes `Accounts::PlayerRegistered` (the event that later fills a new player's pack bank), and the session is an encrypted cookie holding the player id."
verify = "On production, signing in with a Steam account creates a player and signing in again reuses it; no password is stored."
covers = ["R1", "R4"]
after = [3, 4]
hitl = true
risk = "medium"
unknown = "omniauth-openid 2.0.2 is not verified on Rails 8.1; if it fails, the OpenID check is written inside the Steam pack, as the spine allows."

[[entry]]
id = 7
type = "story"
title = "Roles, policies and ban check"
description = "Adds Pundit with the roles visitor, player, moderator and administrator, a ban check on every request, and the rule that a Game operation requires a player."
verify = "Tests show a signed-out request to a mutating action is refused, and a banned player loses access at the next request."
covers = ["R4"]
after = [6]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "Attic page shell"
description = "Adds the attic page as the landing after sign-in, the same page for a signed-out visitor with the Steam sign-in button, and an empty back-office shell for staff."
verify = "Signed in, a player lands on the attic page; signed out, the page shows the sign-in button; only staff open the back-office."
covers = ["R9", "R4"]
after = [7]
hitl = false
risk = "low"
references = ["ux-gameble/EXPERIENCE.md", "ux-gameble/mockups/attic.html"]


# tickets.toml — the stories of epic 1, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Walking skeleton live in production"
description = "Creates the Rails 8.1 application with PostgreSQL, Vite and the four empty packs, and deploys one placeholder page with Kamal 2 behind Cloudflare."
verify = "The production URL serves the placeholder page and `/up` answers healthy."
covers = ["R2", "R7"]
after = []
hitl = true
risk = "medium"
unknown = "Whether every pinned gem runs on Ruby 4.0.7; the spine's fallback is Ruby 3.4.11."
references = ["architecture-gameble/architecture-gameble.md#ad-21--one-image-three-processes-adopted", "architecture-gameble/architecture-gameble.md#stack"]

[[entry]]
id = 2
type = "story"
title = "CI gates"
description = "Adds the GitHub Actions workflow that runs Minitest, Packwerk, strong_migrations, i18n-tasks and RuboCop on every pull request."
verify = "A pull request that crosses a pack boundary or drops a translation key fails CI; a clean one passes."
covers = ["R2", "R8"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Operations and events wiring"
description = "Adds the dry-operation base class with its ActiveRecord transaction, configures Rails Event Store, and sets the failure-code-to-locale-key convention with one sample operation."
verify = "A test shows the sample operation commits its change and its event together, and rolls both back on a Failure."
covers = ["R3"]
after = [2]
hitl = false
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "Locales and layout shell"
description = "Adds French and English with the locale in the URL, the page layout with its status band placeholder, the DESIGN.md tokens as CSS custom properties, the Jost typeface, and the text plate and button view components."
verify = "`/fr` and `/en` render the shell in each language, and a first visit follows the browser language."
covers = ["R5", "R6"]
after = [3]
hitl = false
risk = "low"

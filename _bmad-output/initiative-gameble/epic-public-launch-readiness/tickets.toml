[[entry]]
id = 14
type = "story"
title = "Personal data kept only as long as the privacy notice says"
description = "Purges what the privacy notice gives a period for: handled reports one year after they were handled, server logs after 30 days, and what a deleted account leaves (invitations, reports it made or received once handled) anonymised or removed, by a recurring job."
verify = "A report handled more than a year ago and the invitations of a deleted account are gone after the job runs; logs older than 30 days are not kept on the server; nothing younger is touched."
covers = ["R2"]
after = [3, 5]
hitl = false
risk = "medium"
notes = ["Decision (2026-10-08): the privacy notice states retention periods and a purge ticket lands before opening (author, 7.3 question 3)."]

[[entry]]

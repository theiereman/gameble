description = "The static error pages in public/ (400, 404, 406 unsupported browser, 422, 500) are still the Rails defaults, white with Rails' own illustration; they take the space terminal theme of the rest of the game (colors, fonts, pixel art, tone of voice) while staying self-contained static files that render when the app itself is down, styled only from files in public/ under the enforced CSP (no inline style or script), with a link back to the home page."
verify = "Each of the five pages reads as gameble in the game's theme on phone and desktop, carries no inline style or script and no asset from Vite's build, still renders with the Rails server stopped (served by the proxy or opened as a file), and the error pages test passes."
covers = []
after = [10]
hitl = true
risk = "low"
unknown = "The pages have no locale: French only, English only, or both texts on one page; whether they reuse the app's fonts and pixel art by copying them into public/ or a script that generates them; and how a change to errors.css reaches browsers, which cache public/ files for a year with no fingerprint."
notes = ["Requested by the author on 2026-10-14, during the build of entry 10, which moved the pages' styles into public/errors.css.", "The author approves the look of the pages."]

[[entry]]
id = 55
type = "story"
title = "Public pages throttled or cached"
description = "Throttles or caches the public profile, card page and library reads without ever caching a private or hidden page; a per-address throttle reads the client's real address restored behind Cloudflare, or every visitor would share one limit."
verify = "Repeated reads of a public page are throttled or served from cache; a private or hidden page is never cached; two clients behind Cloudflare are counted apart."
covers = ["R7"]
after = [25]
hitl = false
risk = "medium"
notes = ["Split from entry 10 by the author on 2026-10-14, at the start of its build."]


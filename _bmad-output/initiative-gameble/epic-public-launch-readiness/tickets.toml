description = "Moves error tracking to a service whose data stays in the EU, Sentry's EU region or a self-hosted Sentry-compatible tracker (GlitchTip, Bugsink), keeping the current privacy settings (no personal data beyond the internal player id), and updates the privacy notice's processors."
verify = "An error raised on staging appears in the EU-hosted tracker with no IP or request data; the privacy notice lists no transfer outside the EU for error tracking."

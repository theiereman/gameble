[[entry]]
id = 17
type = "story"
title = "Moderation by rank, a hidden back-office and staff reading every profile"
description = "A staff member bans, unbans and dismisses the reports of only a lower rank: a moderator acts on players, an administrator on players and moderators, no one on an administrator or on themselves. Every back-office page, the jobs dashboard included, answers 404 to a signed-out visitor and to a player who is not staff, as if it did not exist. Game::Visibility lets staff see every profile and what is attributed to it, whatever its visibility and banned included, never a deleted one. Also closes the follow-up review story 5 asked for: the self-dismiss refusal and the queue's row skip under a concurrent action."
verify = "A moderator cannot ban or dismiss the reports of another moderator, an administrator can; no one bans an administrator or themselves; a visitor and a non-staff player get 404 on every back-office address; a moderator opens a private, a friends-only and a banned player's profile; a non-staff viewer still sees them unavailable."
covers = ["R4", "R1"]
after = [5]
hitl = false
risk = "medium"



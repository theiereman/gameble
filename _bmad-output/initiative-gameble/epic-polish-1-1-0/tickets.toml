# tickets.toml — the epic's agreed children, in build order. tickets.py reads it.

[[entry]]
id = 2
type = "bug"
title = "A goal on the Steam library set shows its name"
description = "Author on staging (v1.1.0-rc.6), 2026-11-03: once the Steam library set is marked as an active goal, the goal shows no name, so nothing says the goal is the Steam library. Reproduction: sign in as a player with a synced Steam library set, mark it as an active goal, open the collection: the goal row has a bookmark, a gauge and a count but an empty name. Cause hypothesis: the goal's set name is read from the custom set's stored name, which the Steam library set does not carry; its displayed name (My Steam library / Ma bibliothèque Steam) comes from elsewhere. Every place a goal is named must show it: the collection's goal rows, the goal bookmark's words on cards, the grid's goal filter, the trade boards' bookmarks and the accessible sentences, in both languages."
verify = "With the Steam library set as an active goal, the collection's goal row, the card bookmark words, the goal filter and a trade board name it My Steam library in English and Ma bibliothèque Steam in French; a helper or view test covers the Steam library goal and a game-set and custom-set goal still show their own names."
covers = []
after = []
hitl = false
risk = "low"
severity = "P2"


# tickets.toml — the stories of the seasons carry over epic, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Carried tiers are received once per season, silently"
description = "Adds Game::ReceiveSeasonAllocation, which inserts the tier rows a player already meets in the published season's sets, marked as reached by the allocation, records the received season even when nothing is carried, and publishes one Game::SeasonAllocationReceived carrying the inserted rows and no tier event; the achievement handler answers it, and the card back handler of epic-card-backs will, the feed handler does not. Adds the received and seen seasons on game_player_states as season numbers (null means none; existing players and new accounts start at the published one). Game::OpenPack and Game::AcceptTrade (both players) receive the pending allocation as a step of their own transaction, after the bank locks and before any credit, under the season they read once; the check under the bank lock makes concurrent operations receive once. The screen of entry 2 calls the same operation (AD-9, AD-10, AD-25)."
verify = "After a publication in a test, a player's first opening receives the tiers they met with the new season and celebrates only the tiers the opening crosses; a friend's accepted trade does the same with no feed entry; a concurrent opening and trade receive once; a second receipt writes nothing; a player with no holding from an earlier season receives nothing."
covers = ["R2", "R3", "R5"]
after = ["13.5", "13.6", "epic-human-readable-codebase"]
hitl = false
risk = "medium"
notes = ["From the sets epic retrospective (2026-10-20): today the first credit in a new season records, through Game::SetTier.record, every tier the player already meets, as tier events with a feed line and a celebration crossing every tick (a player at 45/62 opening one member card gets novice to expert at once); a set already complete through earlier editions has no complete row until a member is credited again. This story's receipt must run before that recording so the burst never happens."]

[[entry]]
id = 7
type = "story"
title = "The seasonal allocation screen designed"
description = "Draws the seasonal allocation screen with the author using bmad-ux and records it in DESIGN.md and EXPERIENCE.md before any build: the section \"Obtenu pendant la saison N\" with the ended season's tiers, the section \"Débloqué pendant la saison N\" with the achievements earned and the card backs unlocked in it (omitted when there are none) and the section \"Vos paliers dans la saison suivante\" with the tiers received at once (no sentence under the title, no tiers to win back, no \"see more\"), on a phone and a desktop, in French and English."
verify = "The author has approved the mockups and DESIGN.md and EXPERIENCE.md describe the screen, its states and its copy."
covers = ["R1", "R2", "R4", "R5"]
after = [1, "13.7"]
hitl = true
risk = "low"

[[entry]]
id = 2
type = "story"
title = "The seasonal allocation screen"
description = "Builds the screen drawn in the design entry before it, which the author approved: no sentence under the title, the section \"Obtenu pendant la saison N\" with the ended season's tiers, the section \"Débloqué pendant la saison N\" with the achievements earned during the ended season (name and date, oldest first, weekly goal rewards excluded) and the card backs unlocked in it, left to the card backs epic's entry 8 until the backs exist, and omitted when there are none, and the section \"Vos paliers dans la saison suivante\" with the tiers received at once (no tiers to win back, no \"see more\", two columns on large screens, the button sticky at the bottom on the phone); the redirect covers only the hub and the booster page, and they redirect to it while the published season is unseen, reading that check from the primary, and its POST receives the allocation through entry 1's operation if still pending and marks it seen, a write that publishes no event and goes through a Game operation shaped like MarkCollectionSeen; the first section reads tier rows reached in play, the achievements section the player's achievements dated in the ended season, the last the allocation's rows."
unknown = "The screen is drawn with bmad-ux and approved by the author in the design entry before this build starts."
verify = "On staging after a publication, a returning player is led to the screen once, also when opening the booster page first, and then reaches the hub; a player with no card from an earlier season goes straight to the hub; the screen reads in French and English on a phone and a desktop."
covers = ["R1", "R2", "R4", "R5"]
after = [1, "13.7", 7]
hitl = true
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Unopened packs are redrawn in the published season"
description = "When a season is published, Game::HealBanksJob also redraws every unopened pack of an earlier season in the published one, with the same kind, odds, guarantees and availability time, one player per transaction under the bank lock, so an opening after a publication gives only the published season's cards (AD-7)."
verify = "In a test, a player with ten banked packs and a weekly reward pack from season N sees, after season N+1 is published and the job runs, the same packs with the same availability times holding only season N+1 cards, the reward pack still holding an Épique or better; an opened pack is untouched; running the job twice changes nothing."
covers = ["R7"]
after = []
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Refactor sweep"
description = "Cleans up what this epic's build records and deferred review findings name; scope set when it starts. Also: Game::OpenPack locks the player state row after the holdings upsert, in the order bank, holdings, state rows; a player state row created by an upsert before Game::CreatePlayerState carries the received and seen season markers, so the first opening publishes no extra Game::SeasonAllocationReceived."
verify = "The full test suite, packwerk and zeitwerk pass."
covers = []
after = [1, 2, 6]
hitl = false
risk = "low"

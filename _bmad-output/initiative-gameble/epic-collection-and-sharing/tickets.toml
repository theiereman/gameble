# tickets.toml — the stories of epic 4, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "Library of sets"
description = "Adds the library reached from the attic's lectern: the published season's sets shown as tomes on shelves by kind, each with its localised name (publisher, genre and volume, year) and the viewer's owned / total distinct cards, empty for a visitor."
verify = "A player who owns cards sees each set's progress in the library in both languages; a visitor sees every set at 0 / total; one page load runs a bounded number of queries at catalog size."
covers = ["R1", "R6", "R7"]
after = ["2.7", "3.1"]
hitl = false
risk = "medium"
references = ["ux-gameble/EXPERIENCE.md", "ux-gameble/DESIGN.md", "ux-gameble/mockups/key-screens.html"]

[[entry]]
id = 2
type = "story"
title = "Tome slots"
description = "Opens a tome onto its slots in order: an owned card's face with its copy count, a missing card as an empty slot naming the game, addressed by the set's kind and key."
verify = "In a tome, owned cards show their face and copies, missing ones name the game; a visitor sees every slot empty; the URL carries no database id."
covers = ["R2", "R6"]
after = [1, "3.5"]
hitl = false
risk = "low"

[[entry]]
id = 3
type = "story"
title = "Card detail"
description = "Adds a card's detail page by its slug: art, title, short description, year, rarity, season, its sets leading to their tomes, publisher and copyright, and the Steam store link, in the viewer's language; cards anywhere lead to it."
verify = "From a tome or the reveal faces, a card opens its detail in French and English with every field and a working Steam link; signed out it opens too."
covers = ["R3", "R6"]
after = [2]
hitl = false
risk = "low"

[[entry]]
id = 4
type = "story"
title = "Public profile"
description = "Adds each player's public profile at a link built on their token: their collection's set progress and owned cards, reachable signed out, titled from the token as no name is stored."
verify = "A visitor opens a player's profile link and sees that player's set progress; an unknown token is a 404; no database id appears."
covers = ["R4", "R6"]
after = [1]
hitl = false
risk = "low"

[[entry]]
id = 5
type = "story"
title = "Share a card"
description = "Lets a player share a card they own as a link to their public profile with the card shown, with Open Graph and Twitter card tags giving the title and rarity and no game image, and a copy-link button."
verify = "The share link opens the profile with the card shown, and its tags carry the title and rarity and no image; a request with a Discord, X or WhatsApp user agent gets the same tags; a card not owned cannot be shared."
covers = ["R5", "R6"]
after = [3, 4]
hitl = false
risk = "medium"

[[entry]]
id = 6
type = "story"
title = "Refactor sweep"
description = "Cleans up the epic's code from the build records and the review findings deferred during the epic; its scope is set when it starts."
verify = "CI is green and every deferred review finding of the epic is fixed or recorded."
covers = []
after = [1, 2, 3, 4, 5]
hitl = false
risk = "low"

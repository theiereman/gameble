[[entry]]
id = 3
type = "story"
title = "A banned account can be erased by staff"
description = "The legal page promises erasure on request, yet Accounts::DeletePlayer refuses a banned player. Allow the operation for a banned player when an administrator runs it: the Pundit policy (administrator only; a banned player cannot start it), the operation, an erase action on a row of the back-office players index (no player page exists) confirmed by turbo_confirm naming the player, and the history row that records the erasure, which needs a new moderation kind: the check constraint on accounts_moderation_actions changes in two steps (add not validated, then validate). The ban stays in place after the erasure. Author, 2026-10-28."
verify = "A back-office test erases a banned player through the new action and finds the history row; the same operation is refused for a banned player acting alone; the legal page's promise holds."
covers = []
after = []
hitl = false
risk = "medium"


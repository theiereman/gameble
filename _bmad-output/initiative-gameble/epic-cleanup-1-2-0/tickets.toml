[[entry]]
id = 5
type = "story"
title = "Staging moves to test.gameble.net behind a Cloudflare Tunnel"
description = "Staging answers at gameble.dotsncircles.com through the author's Traefik. Move it to https://test.gameble.net on the pattern production already uses (config/deploy.production.yml, docs/operations.md, RELEASING.md): cloudflared runs as a systemd service on the staging LXC and forwards plain HTTP to kamal-proxy, Cloudflare holds the certificate (proxy ssl false, forward_headers true), and Kamal reaches the LXC over SSH through the tunnel on an Access-guarded route (for example ssh-test.gameble.net, proxy_command cloudflared access ssh --hostname %h), so no port is open. Change config/deploy.staging.yml (servers, proxy host, PUBLIC_URL, ssh), the staging deploy workflow and its secrets (SSH_KNOWN_HOSTS, the Access service token for the staging route), the Steam sign-in return URL and realm, the staging walkthrough URL in RELEASING.md and every doc that names gameble.dotsncircles.com, and make sure the client address behind the tunnel reaches the rate limits (the proxy address is trusted so X-Forwarded-For is kept). The tunnel, the DNS record and the Access application are made by the author in the Cloudflare dashboard, free tier only; the agent prepares the repository changes and the steps. Keep gameble.dotsncircles.com answering until the new route works, then retire it. Timing (author, 2026-10-28): done just before v1, not before; do not start it earlier. Author, 2026-10-28."
verify = "A candidate deploys to staging through the tunnel, https://test.gameble.net answers on a phone and a desktop, Steam sign-in returns to test.gameble.net, a player's rate limit counts their own address, the staging Discord and Sentry environment are unchanged, and no inbound port of the staging LXC is open."
covers = []
after = []
hitl = true
risk = "medium"

unknown = "what exotic means in the rarity model; how a card that is not a Steam game fits the catalog and its seasons"
notes = ["Moved out of the 0.4.0 screen walkthrough (formerly 16.33) on 2026-10-27: the author, 2026-10-27, \"sors la carte exotique du MVP, on le fera plus tard en 1.2.0\".", "Asked by the author, 2026-10-26, as a side task while the credits (16.14) were prepared; the beta testers' names are in 16.14's notes.", "Open questions for the author: (1) exotic: a seventh rarity above Légendaire, or a mark that sits outside the rarities; (2) the model: a card is a Steam game today (`Catalog` pack), so is a tribute card a catalog row with no Steam app, a separate kind of card, or a card in a dedicated set; (3) the seasons: is it carried over, and does it count in the collection totals and the set completions; (4) who receives it: the tester it honours only, every player (then how it is obtained: a gift on sign-in, a reward, a special pack), or no one but the tester as a unique card; (5) trading and reposting: can it be traded, shown in a showcase, reposted; (6) the art and the text: the face (name, pseudonym, a line), who draws it, and whether a tester may refuse or choose the pseudonym; (7) the public side: the visitor's view of the card, the feed entry when it is obtained, and its place in the credits.", "Placed in epic 16 because it came out of the credits ticket; it blocks nothing and can move to its own epic or to a later release when the author chooses.", "Answers from the author, 2026-10-27: (1) exotic is outside the rarities, a mark named \"exotique\" / \"exotic\"; (2) the six cards form a set of their own; (3) the cards have no season; (4) every player can receive one, rarer than a Légendaire; (5) it is a card like any other: traded, shown in a showcase, reposted; (6) the face carries the tester's pseudonym and the category \"beta-builder\"; the author provides a photo of each tester, pixelated for the art, and asks each tester's consent beforehand; (7) the public side is unchanged: a visitor sees the card like any other. Left for the spike: the drop rate, how a seasonless set sits beside the season's sets and totals, and the mockup."]

description = "Moves mockups/exotic-card/exotic.css into the app next to card.css and card-tilt-effects.css with the halo glow: CardComponent gains the exotic tier, its icon in both sizes, the name in both locales, no season mark for a tribute card, exotic in IRIDESCENT; the card detail, the public page, the showcase, the trade picker and the repost image show it as the face does; reduced motion stills the halo and the tilt."
verify = "The system tests of the collection, the card detail, the capsule reveal and a trade show an exotic card with its mark and its metal band, a grayscale render keeps its icon distinct from the five, and npm run format:check, lint:css and vitest pass."

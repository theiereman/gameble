type = "spike"
title = "An exotic card for each beta tester"
description = "The six beta testers (Hydrax, Skyora, Zohan, Feltpath, Micilico, Le chocotube; author, 2026-10-26) are paid tribute in the game with one \"exotic\" card each, bearing their name and their pseudonym. A card in gameble is a Steam game, so a card that is a person is outside the model: with the author, settle what the tribute card is and how it lives beside the catalog, then write the story that builds it. The output is the decisions, the mockup of the card, the DESIGN.md, EXPERIENCE.md and architecture notes they need, and a build story in the tree."
verify = "The author has settled each open question and picked the card's look from a mockup in `ux-gameble/mockups`; the decisions are recorded in DESIGN.md, EXPERIENCE.md and the architecture, and a build story for the six cards is in the tree."
covers = []
after = []

# tickets.toml — the stories of the card backs epic, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "The back catalogue, unlock rows and the active back"
description = "Adds game_card_back_unlocks (player, back key, unlocked_at, unique per player and key) and a nullable active back on game_player_states (expand only), the Game::CardBacks catalogue as one constant of key, asset and unlock rule (Standard needs no row, a set back is keyed by its set's kind and key), Game::UnlockCardBack as the single idempotent writer, and CardBacks.active_key reading the player's choice with a fallback to Standard when the back is not unlocked; when done, a back unlocked and equipped from the console is stored on the next pack the player opens."
verify = "Operation tests show an unlock written once however many times it is asked, Standard active for a new account and for an account whose active back is not unlocked, the opening storing the active back on the pack, and db/schema.rb regenerated from the migrations."
covers = ["R1", "R4"]
after = ["epic-human-readable-codebase", "13.22"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "A set's back unlocks on its back tier"
description = "A Game handler on SetTierReached and on the allocation receipt of 17.1 (SeasonAllocationReceived) unlocks the back of a theme or hall of fame set when the tier reached is that set's back tier (its first tier at or above half its cards, gold in seasons published before the tier table), once per set kind and key across seasons, inside the publishing transaction and without publishing; franchise, studio and UFO sets grant nothing; a rake task in app/domains/game/lib/tasks grants once the backs of tiers reached before this epic ships, and the author runs it on staging and production."
verify = "Tests cover each size row of the tier table, a legacy gold, a trade that crosses the tier, a tier received at the allocation, the same set in a later season (no second unlock), a franchise set (no back), and the backfill run twice writing once; packwerk and zeitwerk pass."
covers = ["R1", "R7"]
after = [1, "17.1"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "The set backs drawn and exported"
description = "Drafts the word, two or three colours and motif of each of the 42 themes and 4 hall of fame sets for the author's approval, then extends script/pixel_art/export.mjs with one shared set-back anatomy (frame, field, brackets, motif, 5 x 7 word) drawn from that list, exports the 46 backs in the five sizes and registers each asset in the catalogue; a catalogue test fails when a key of Catalog::Themes or Catalog::HallOfFame has no back."
unknown = "Whether the 5 x 7 font covers every letter of every set word, accents included; missing glyphs are drawn or the word is changed with the author."
verify = "node script/pixel_art/export.mjs --check passes, 46 x 5 = 230 new PNGs sit beside the existing 40, and the catalogue test passes."
covers = ["R6"]
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 4
type = "story"
title = "The back picker on the settings screen"
description = "Adds Game::ChooseCardBack (POST, Pundit policy, Failure(:back_locked)), a Game::CardBackShelf query listing every back with its state and unlock condition, and a card back section on the settings screen with a preview, the active mark, locked backs greyed under a padlock stating their condition, and the equipped and locked feedback; every back name and condition in en.yml and fr.yml, errors.game.back_locked added to both by hand."
unknown = "The picker's layout is not drawn in DESIGN.md (only copy in EXPERIENCE.md and Flow 3): a short bmad-ux pass with the author first, or the author accepts a grid of thumbnails under the preview."
verify = "A system test equips an unlocked back and sees the preview and the feedback, a locked back shows its condition and cannot be equipped even by a forged POST, and the choice survives a reload; i18n-tasks and the locale files agree."
covers = ["R2", "R4"]
after = [1, 2, "10.4"]
hitl = true
risk = "low"

[[entry]]
id = 5
type = "story"
title = "The active back on the booster and its unlocks announced"
description = "The server renders each opened pack's back as an asset the booster uses at its three layouts' sizes (replacing the Standard-only list of booster_motion.ts and its CSS), the opening's answer lists the backs it unlocked and the booster shows them after the reveal, a back unlocked by a trade reaches the player through the private stream from a job after commit, and the landing's back tile loses its soon tag."
unknown = "How the unlock line chains with the set celebration's order (EXPERIENCE.md, Set celebration) and with the special packs' intro of 19.5."
verify = "booster_test.rb opens a pack with a theme back equipped and sees it on all five face-down cards on desktop and phone, an opening that crosses a back tier announces the back once, and vitest covers the back's choice and the unknown-key fallback."
covers = ["R4", "R5"]
after = [3, 4, "8.11", "8.12", "21.3", "19.5"]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "A back earned in several seasons wears the season the player picks"
description = "Adds the picked season to game_player_states and to game_packs, reads the seasons a set back was earned in from the player's tier rows (allocation rows included) joined to catalog_sets.season_id, lets the picker choose the mark, and adds the season-mark stamp (DESIGN.md, Season mark) as a component laid over the existing back, never a redrawn one; the recap of entry 8 reuses the stamp."
verify = "A player with a back tier of the same set in two seasons sees both marks in the picker, the pack stores the picked season and the booster shows the stamp; a back earned once shows no choice."
covers = ["R3"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Goal, achievement and event backs"
description = "Adds the goal, achievement and event backs to the catalogue: handlers grant Semaine 38 on the player's first GoalRewardGranted and Centurion, Étoile d'or and Aurore on AchievementUnlocked for boosters_100, first_legendary and three_complete_sets; the SUCCÈS tile of those achievements shows the back; Game::GrantCardBack, one player per transaction, grants Saison 1, Millésime 2017 or Soldes d'hiver to a group from the console and a rake task; a rake task grants once the goal and achievement backs earned before this epic ships, and the author runs it on staging and production."
unknown = "Whether the goal back keeps the prototype's Semaine 38 lettering (author to confirm); changing the word redraws its five files through export.mjs."
verify = "Tests show each rule granting once, a goal reward claimed or refused for a full reserve granting the same back, the console operation granting a group with one failure not rolling back the others, the backfill run twice writing once, and the SUCCÈS tile naming the back."
covers = ["R1", "R7"]
after = [2, 4, "6.5", "6.10"]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "The seasonal recap lists the season's backs"
description = "Adds Game::CardBacksEarnedIn(player, season), the backs unlocked or marked in a season, and shows them with their season stamp on the allocation screen built by 17.2."
verify = "A query test returns the backs a player earned in the ended season and none earned before it, and the allocation's system test shows a back earned in the ended season."
covers = ["R8"]
after = [2, 6, 7, "17.2"]
hitl = false
risk = "low"


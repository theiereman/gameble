# tickets.toml — the stories of the card backs epic, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "The back catalogue, unlock rows and the active back"
description = "Adds game_card_back_unlocks (player, back key, unlocked_at, unique per player and key) and a nullable active back on game_player_states (expand only), the Game::CardBacks catalogue as one constant of key, asset and unlock rule (Standard needs no row, a set back is keyed by its set's kind and key), Game::UnlockCardBack as the single idempotent writer, publishing Game::CardBackUnlocked with a retroactive flag as Game::GrantAchievement publishes AchievementUnlocked, and CardBacks.active_key reading the player's choice with a fallback to Standard when the back is not unlocked; when done, a back unlocked and equipped from the console is stored on the next pack the player opens; before the code, the spec's CAP-20 and the architecture's AD-25 drop the faded back on a card not owned (bmad-spec, bmad-architecture), so entry 5 reads an owner-only back."
verify = "Operation tests show an unlock written and published once however many times it is asked, Standard active for a new account and for an account whose active back is not unlocked, the opening storing the active back on the pack, and db/schema.rb regenerated from the migrations."
covers = ["R1", "R4"]
after = ["epic-human-readable-codebase", "13.22"]
hitl = false
risk = "medium"

[[entry]]
id = 2
type = "story"
title = "A set's back unlocks on its back tier"
description = "A Game handler on SetTierReached and on the allocation receipt of 17.1 (SeasonAllocationReceived) enqueues Game::GrantCardBacksJob, as Handlers::Achievements enqueues GrantAchievementsJob, and the job unlocks through UnlockCardBack the back of a theme or hall of fame set when the tier reached is that set's back tier (its first tier at or above half its cards, gold in seasons published before the tier table), once per set kind and key across seasons; franchise, studio and UFO sets grant nothing; game:backfill_card_backs runs Game::BackfillCardBacksJob by perform_now, in the shape of game:backfill_achievements, granting retroactively (no toast) the backs of tiers reached before this epic ships, and the author runs it on staging and production; entry 7 extends that job."
verify = "Tests cover each size row of the tier table, a legacy gold, a trade that crosses the tier, a tier received at the allocation, the same set in a later season (no second unlock), a franchise set (no back), and the backfill run twice writing once; packwerk and zeitwerk pass."
covers = ["R1", "R7"]
after = [1, "17.1"]
hitl = false
risk = "medium"

[[entry]]
id = 3
type = "story"
title = "The set backs drawn and exported"
description = "Drafts the word, two or three colours and motif of each of the 42 themes and 4 hall of fame sets for the author's approval, then extends script/pixel_art/export.mjs with one shared set-back anatomy (frame, field, brackets, motif, 5 x 7 word) drawn from that list, exports the 46 backs in the five sizes and registers each asset in the catalogue; a catalogue test fails when a key of Catalog::Themes or Catalog::HallOfFame has no back."
unknown = "Whether the 5 x 7 font covers every letter of every set word, accents included; missing glyphs are drawn or the word is changed with the author."
verify = "node script/pixel_art/export.mjs --check passes, 46 x 5 = 230 new PNGs sit beside the existing 40, and the catalogue test passes."
covers = ["R6"]
after = [1]
hitl = true
risk = "medium"

[[entry]]
id = 5
type = "story"
title = "The active back on the booster and its unlocks announced"
description = "The server renders each opened pack's back as an asset the booster uses at its three layouts' sizes (replacing the Standard-only list of booster_motion.ts and its CSS), PlayerStream turns CardBackUnlocked into a toast as it does AchievementUnlocked (a retroactive unlock announces nothing), so a back unlocked by an opening or a trade reaches the player the same way, and the landing's back tile loses its soon tag."
unknown = "How the unlock toast lands during the reveal, the set celebration (EXPERIENCE.md, Set celebration) and with the special packs' intro of 19.5."
verify = "booster_test.rb opens a pack with a theme back equipped and sees it on all five face-down cards on desktop and phone, an opening that crosses a back tier announces the back once, and vitest covers the back's choice and the unknown-key fallback."
covers = ["R4", "R5"]
after = [3, "8.11", "8.12", "21.3", "19.5"]
hitl = false
risk = "high"

[[entry]]
id = 6
type = "story"
title = "A back earned in several seasons wears the season the player picks"
description = "Adds the picked season to game_player_states and to game_packs, reads the seasons a set back was earned in from the player's tier rows (allocation rows included) joined to catalog_sets.season_id, lets the picker choose the mark, and adds the season-mark stamp (DESIGN.md, Season mark) as a component laid over the existing back, never a redrawn one; the recap of entry 8 reuses the stamp."
verify = "A player with a back tier of the same set in two seasons sees both marks in the picker, the pack stores the picked season and the booster shows the stamp; a back earned once shows no choice."
covers = ["R3"]
after = [5]
hitl = false
risk = "medium"

[[entry]]
id = 7
type = "story"
title = "Goal, achievement and event backs"
description = "Adds the goal, achievement and event backs to the catalogue: handlers enqueue GrantCardBacksJob to grant Confrère on the player's first GoalRewardGranted and Centurion, Étoile d'or and Aurore on AchievementUnlocked for boosters_100, first_legendary and three_complete_sets; the SUCCÈS tile of those achievements shows the back; game:grant_card_back runs Game::GrantCardBackJob, which grants Saison 1, Millésime 2017 or Soldes d'hiver to a group by calling UnlockCardBack once per player, each in its own transaction; BackfillCardBacksJob of entry 2 also grants retroactively the goal and achievement backs earned before this epic ships."
verify = "Tests show each rule granting once, a goal reward claimed or refused for a full reserve granting the same back, the grant job granting a group with one failure not rolling back the others, the backfill run twice writing once, and the SUCCÈS tile naming the back."
covers = ["R1", "R7"]
after = [2, "6.5", "6.10", "6.11"]
hitl = false
risk = "medium"

[[entry]]
id = 8
type = "story"
title = "The seasonal recap lists the season's backs"
description = "Adds Game::CardBacksEarnedIn(player, season), the backs unlocked or marked in a season, and shows them with their season stamp on the allocation screen built by 17.2."
verify = "A query test returns the backs a player earned in the ended season and none earned before it, and the allocation's system test shows a back earned in the ended season."
covers = ["R8"]
after = [2, 6, 7, "17.2"]
hitl = false
risk = "low"

[[entry]]
id = 9
type = "story"
title = "Refactor sweep"
description = "Cleans up what this epic's build records and deferred review findings name; scope set when it starts."
verify = "The full test suite, packwerk, zeitwerk, vitest and the pixel art check pass."
covers = []
after = [1, 2, 3, 5, 6, 7, 8]
hitl = false
risk = "low"

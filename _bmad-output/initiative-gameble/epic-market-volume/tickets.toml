unknown = "UX assumptions to confirm: no paging; a line that would not fit the cap prefilled ENCHÈRES at the average or the minimum; the stamps paid from the same validation's proceeds; the reopened step showing the copies still set apart; the phone dock holding TOUT CONFIER."

[[entry]]
id = 15
type = "story"
title = "A player buys a card from the Archives' shop"
description = "game_market_archive_withdrawals (expand migrations, its concurrent indexes on their own) holds one row per Archive purchase: player, card-season, purchase token, price, settings version and time, unique on player and token, kept through an account deletion. SumArchiveStocks is rewritten to lock the stock rows in ascending card-season, upsert the card-seasons whose deposits less withdrawals is above zero and delete those at zero or less, never writing a zero. Game::Market::BuyFromArchives(player:, card_season_id:, purchase_token:, settings_token:) runs under the player's bank lock and refuses a closed market, a stale version, a rarity whose Archive price is null (not_in_shop) and a price above available; it locks the player's holding, then the stock row (out_of_stock when missing), inserts the withdrawal (a repeated token buys nothing more), decrements the stock row or deletes it at one, moves one copy in releasing nothing through story 7's settlement step for a buyer (allocation received, tiers reached by trade), posts archive_purchase, refreshes no edition price and publishes ArchivePurchased with story 1's keys. The Boutique de la Confrérie screen, open to visitors: the Brotherhood's line, the search, VOULUES · <n> from the viewer's own wanted rows, the season and sort menus (price ascending by default), the rarity chips of priced rarities only, the count of cards and editions, then a list of tiles (the card in the parchment ring, the ARCHIVES and VOULUE tags, the fixed price, '<n> en stock', ACHETER ▸; the whole tile one link) loading by scroll, the filters in the URL; a visitor reads it with the sign-in line, the tiles leading to the card detail; the empty line. This story builds the purchase confirmation story 17 reuses (the Modal, a bottom sheet on the phone, with Prix, Solde après, the short-of-PiCoins line offering CONFIER DES CARTES, the refusal of a changed price, a double activation submitting once). A tile opens it as the Archive purchase confirmation: card, edition, season, price, Solde après, the Brotherhood's line, ANNULER and ACHETER · <amount>; short of PiCoins it says by how much and offers CONFIER DES CARTES; the last copy taken or the price changed refuse with their lines, the new price drawn; bought, the result replaces the body and the tile's stock falls, or the tile leaves. Rate limited per player; copy in both locales."
verify = "One system test (test/system/market_shop_test.rb): with Rare priced, a player buys a Rare copy through the confirmation, reads the result, holds the copy and finds the stock one lower; a visitor reads the shop with nothing to buy. Operation tests: every refusal; a repeated token buying once; the last copy deleting the stock row; the archive_purchase entry destroyed in the reconciliation; no feed entry and no edition price change. SumArchiveStocks never writes zero after deposits and withdrawals."
covers = ["R17", "R18", "R13", "R24"]
after = [3, 6, 7, "38.12"]
hitl = false
risk = "high"
unknown = "Deferred: stock row contention on a popular Archive card is measured before the shop opens; if it is a problem, whether the decrement becomes one conditional UPDATE as the last write before the ledger post goes to the author."


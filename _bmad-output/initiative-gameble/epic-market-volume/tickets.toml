title = "A player at a free limit buys the next slot in context"
description = "Game::BuySlot(player:, kind:, slot:, settings_token:), with the blocked action's input, runs under the player's bank lock, then the capacity row: it refuses a slot other than the current limit plus one (slot_already_bought), a slot past the ceiling (slot_ceiling), a stale version and a price above available; it prices the slot from story 3's reader, raises bought (inserting the row at 1), posts slot_purchase through Game::Market::Ledger, last, and publishes Game::SlotBought with story 1's keys; it never asks whether the market is open and answers a deadlock with market_busy. For a goal it adds the goal in the same transaction through the goal step, which publishes nothing here, and succeeds only when the step inserts a new goal, any other outcome rolling everything back with the step's code; for a custom set or a deck the purchase raises the limit and its answer opens the editor, whose save creates the set or the deck. At a free limit below the ceiling, MARQUER COMME OBJECTIF on a set album, the new set tile in MES SETS and + NOUVEAU DECK on Duels stay enabled, described by the next slot's price, and open the slot purchase dialog, story 15's purchase confirmation: the title for the next slot, read in words; the free count; Prix; Solde après; ANNULER and ACHETER · <price>. Short of PiCoins it gives the missing amount with CONFIER DES CARTES, ANNULER alone while the market is suspended; a slot bought meanwhile in another tab refuses with 'Cet emplacement est déjà acheté.'; bought, the goal is added and the result posted politely, or the editor opens; closing returns focus to the button. A slot is kept for good; the ceilings keep their refusals with no dialog. Rate limited per player; copy in both locales, with English ordinals."

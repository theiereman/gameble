[[entry]]
id = 14
type = "story"
title = "Confier sets wanted copies apart and the wanted table applies them"
description = "Confier's cells carry DEMANDÉE · <n> as Mettre en vente's do. The recap sets wanted copies apart under MISES DE CÔTÉ · <n> CARTES VOULUES, one copy per player who wants the card, further ticked copies going with the batch, each card with its seekers and the line that the choice comes next; VOUS RECEVEZ, the gauge and the button count the rest only, which CONFIER <n> EXEMPLAIRES entrusts at once through EntrustCards; the grid reads Étape 1 sur 2 and the polite status adds the set-apart count; with only wanted copies ticked the button reads CHOISIR POUR LES <n> CARTES VOULUES ▸ and entrusts nothing. The second step, Étape 2 sur 2, at its own address, replaces the grid with the full-width table of EXPERIENCE.md's Confier wanted table: step 1's result line, then one line per wanted card and edition (seekers, the best eligible order drawn best first across the game's lines, each order once, average price, entrustment value), best order, then seekers, then value first, no paging. The choice is a radio group drawn by the SegmentedComponent this story builds: À L'ORDRE · <amount>, a native disabled radio described by 'Aucun ordre' when no order reaches the copy; ENCHÈRES, unfolding Mettre en vente's fields under the line; CONFIER · <amount>. The Prefill rule applies: the order at 90% of the average price or more; an auction at the average when the order is far below it, at the order's price with no average, at the minimum when under it; entrust with no order; an auction when entrusting would not fit the cap left. The dock holds VOUS RECEVEZ MAINTENANT, what goes to auction and what it brings, the stamps, TOUT CONFIER QUAND MÊME · <amount> (EntrustCards on every set-apart copy) and VALIDER LES <n> CHOIX, each total updating with one polite status, a double activation submitting once; the form submits the order tokens and the version it drew to story 8's ApplyWantedChoices. Refused on its own fields: each refusal under its field with aria-invalid and aria-describedby, the dock's count, focus on the first. Refused by a change elsewhere: the table redraws each changed line with its new best order, its new prefill and its sentence, keeps every typed price, the dock names the changed lines, focus goes to the first changed group. Success shows the result panel: the heading focused, what was received and the stamps paid, one line per table line with its chip, sentence and amount, VOIR L'ANNONCE ▸ for an auction, a copy over the cap named and kept, RETOUR AU MARCHÉ. Reopened, the step shows the copies still set apart, or the market when none. On the phone: stacked line panels, a vertical radio list of 44px rows, the dock with the total and both buttons. Choices and typed prices are a pending edit for Esc; the dock pins from 560 CSS px of height."
verify = "One system test (test/system/market_confier_wanted_test.rb): Flow 13 with Camille ticking three wanted copies and two others, entrusting the two, choosing an order, an auction and an entrustment, validating and reading the result; then its failure branch, an order served before the press, redraws the line with its new choice and nothing moves. Vitest covers the Prefill rule and the dock's totals; controller tests cover a visitor, the rate limit and the step reopened with nothing set apart."

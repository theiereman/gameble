<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Landing side gauge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Four ways to keep the side gauge's module names legible over page content without a heavy backdrop.
   Hover or focus a number: it swells with its neighbours (140ms) and its name appears, same typeface as the number, scaling with it.
   Tokens are those of app/frontend/styles/tokens.css. Pure CSS, no script. */
:root{
  --color-ground:#0b0f15;--color-panel:#121a24;--color-panel-raised:#1b2838;--color-accent:#66c0f4;
  --color-text:#c7d5e0;--color-text-bright:#e6eef5;--color-muted:#8f98a0;--color-dim:#5d6b78;--color-line:#2a475e;
  --font-family-jetbrains-mono:"JetBrains Mono",monospace;
  --font-number:700 1.125rem / normal var(--font-family-jetbrains-mono);
  --font-body:400 0.875rem / 1.3125rem var(--font-family-jetbrains-mono);
  --font-kicker:700 0.6875rem / normal var(--font-family-jetbrains-mono);
  --space-2:4px;--space-3:8px;--space-5:16px;--space-8:32px;
}
*{box-sizing:border-box}
body{margin:0;background:#05070a;color:var(--color-text);font:var(--font-body);padding:var(--space-5)}
h1{font:var(--font-kicker);letter-spacing:1.5px;text-transform:uppercase;color:var(--color-muted);margin:0 0 var(--space-5)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:var(--space-5)}
figure{margin:0}
figcaption{display:grid;gap:2px;margin-bottom:var(--space-3);font:var(--font-kicker);color:var(--color-muted)}
figcaption strong{color:var(--color-accent);letter-spacing:1px}
figcaption span{font-weight:400;line-height:1.4}
.stage{position:relative;height:560px;overflow:hidden;background:var(--color-ground);border:1px solid var(--color-line)}
.page{position:absolute;inset:0;padding:20px 20px 20px 52px;overflow:hidden}
.page p{margin:0 0 12px;color:var(--color-text)}
.card{position:absolute;left:78px;top:110px;width:150px;height:210px;padding:12px;display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(160deg,#fff3c4,#f4c542 60%,#8f5e0a);color:#120d05;font:var(--font-kicker);box-shadow:0 6px 18px #0008}
.card i{flex:1;background:linear-gradient(135deg,#2a6f9a,#b5e2ff)}
.card em{font-style:normal}
.card.two{left:150px;top:350px;background:linear-gradient(160deg,#d2efff,#66c0f4 60%,#2a6f9a)}

.gauge{position:absolute;top:50%;left:var(--space-5);z-index:2;display:flex;flex-direction:row-reverse;gap:var(--space-3);height:80%;transform:translateY(-50%)}
.gauge ol{display:flex;flex-direction:column;margin:0;padding:0;list-style:none}
.gauge li{flex:1}
.marker{position:relative;display:flex;align-items:center;height:100%;padding:0 var(--space-3);color:var(--color-muted);font:var(--font-number);text-decoration:none;outline:none}
.marker::before{content:"";position:absolute;inset:0 -140px 0 -8px}
.marker:hover,.marker:focus-visible{color:var(--color-accent)}
.marker:focus-visible .num{outline:1px solid var(--color-accent);outline-offset:3px}
.num{display:block;transform:scale(var(--swell,1));transform-origin:left center;transition:transform 140ms ease-out}
.marker:is(:hover,:focus-visible){--swell:1.5}
.gauge li:has(+ li > :is(:hover,:focus-visible)) > .marker,
.gauge li:has(> :is(:hover,:focus-visible)) + li > .marker{--swell:1.25}
.track{display:flex;flex-direction:column;gap:2px;width:var(--space-2)}
.seg{flex:1;background:var(--color-panel-raised)}
.seg.lit{background:var(--color-accent)}

.name{position:absolute;top:0;bottom:0;left:100%;height:fit-content;margin-block:auto;white-space:nowrap;
  font:var(--font-number);font-size:.875rem;color:var(--color-text-bright);
  opacity:0;pointer-events:none;transform-origin:left center;
  transform:translateX(calc((var(--swell,1) - 1) * 1.35rem)) scale(var(--swell,1));
  transition:opacity 140ms ease-out,transform 140ms ease-out}
.marker:is(:hover,:focus-visible) .name{opacity:1}

/* A: feathered gradient of the page colour, text only */
.v-a .name{padding:var(--space-3) 28px;
  background:radial-gradient(ellipse closest-side,rgb(11 15 21 / .72) 0,rgb(11 15 21 / .5) 45%,transparent 100%)}

/* B: halo, no box */
.v-b .name{padding:0 var(--space-3);
  text-shadow:0 0 2px var(--color-ground),0 0 5px var(--color-ground),0 0 9px var(--color-ground),0 0 16px rgb(11 15 21 / .9),0 0 26px rgb(11 15 21 / .7)}

/* C: faint blur, feathered by a mask */
.v-c .name{padding:var(--space-3) 28px;
  background:rgb(11 15 21 / .22);
  -webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(180deg,transparent,#000 35%,#000 65%,transparent);
  mask-composite:intersect}

/* D: the name slides out; the content behind is dimmed along a masked band */
.v-d .name{padding:0 var(--space-3);
  transform:translateX(calc(-10px + (var(--swell,1) - 1) * 1.35rem)) scale(var(--swell,1))}
.v-d .name::before{content:"";position:absolute;z-index:-1;left:-14px;right:-40px;top:-14px;bottom:-14px;
  background:rgb(5 7 10 / .35);
  -webkit-backdrop-filter:blur(3px) brightness(.7);backdrop-filter:blur(3px) brightness(.7);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 30%,#000 55%,transparent),linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);
  -webkit-mask-composite:source-in;
  mask-image:linear-gradient(90deg,transparent,#000 30%,#000 55%,transparent),linear-gradient(180deg,transparent,#000 40%,#000 60%,transparent);
  mask-composite:intersect}
.v-d .marker:is(:hover,:focus-visible) .name{transform:translateX(calc((var(--swell,1) - 1) * 1.35rem)) scale(var(--swell,1))}
.v-d .name{isolation:isolate}

@media (prefers-reduced-motion:reduce){.num,.name{transform:none!important;transition:none!important}.v-d .name{transform:none!important}}
</style>
</head>

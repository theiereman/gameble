<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&amp;family=Silkscreen:wght@400;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f15}
@keyframes tcgHolo{0%{background-position:160% 0}100%{background-position:-60% 0}}
@keyframes tcgFoil{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-10px) rotate(1.2deg)}}
@keyframes scan{0%{background-position:0 0}100%{background-position:0 6px}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:.15}}
@keyframes twinkle{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes sweep{0%{transform:translateX(-150%) skewX(-20deg)}55%,100%{transform:translateX(700%) skewX(-20deg)}}
@keyframes pulseGlow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes packShake{0%{transform:rotate(0) scale(1)}10%{transform:rotate(-7deg) scale(1.03)}20%{transform:rotate(7deg) scale(1.03)}30%{transform:rotate(-9deg) scale(1.06)}40%{transform:rotate(9deg) scale(1.06)}50%{transform:rotate(-11deg) scale(1.1)}60%{transform:rotate(11deg) scale(1.12)}70%{transform:rotate(0) scale(1.2)}100%{transform:scale(1.9);opacity:0}}
@keyframes flash{0%,62%{opacity:0}78%{opacity:.95}100%{opacity:0}}
@keyframes spark{from{transform:translateY(0) scale(1.4);opacity:1}to{transform:translateY(-300px) scale(.3);opacity:0}}
@keyframes deal{from{transform:translateY(-340px) rotate(-28deg) scale(.5);opacity:0}to{transform:none;opacity:1}}
@keyframes quake{0%{transform:translate(0,0)}20%{transform:translate(-8px,5px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}100%{transform:translate(0,0)}}
@keyframes keyLit{0%,18%{background:#66c0f4;color:#0b1520}19%,100%{background:#1b2838;color:#66c0f4}}
@keyframes flashOut{from{opacity:.9}to{opacity:0}}
.scanlines{position:absolute;inset:0;pointer-events:none;z-index:60;background:repeating-linear-gradient(0deg,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);animation:scan .6s steps(3) infinite}
.vignette{position:absolute;inset:0;pointer-events:none;z-index:59;box-shadow:inset 0 0 180px 30px rgba(0,0,0,.7)}
.hazard{height:8px;background:repeating-linear-gradient(-45deg,#66c0f4 0 8px,#0e141b 8px 16px)}
.brk{position:relative}
.brk::before,.brk::after{content:"";position:absolute;width:14px;height:14px;border:0 solid #66c0f4;pointer-events:none}
.brk::before{top:-5px;left:-5px;border-top-width:3px;border-left-width:3px}
.brk::after{bottom:-5px;right:-5px;border-bottom-width:3px;border-right-width:3px}
.px-btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;box-sizing:border-box;font-family:'Silkscreen',monospace;font-size:13px;letter-spacing:1px;border:0;cursor:pointer;padding:0 14px;height:44px;background:#2a475e;color:#e6eef5;text-decoration:none;box-shadow:0 -3px 0 0 #06090d,0 3px 0 0 #06090d,-3px 0 0 0 #06090d,3px 0 0 0 #06090d,inset 0 -4px 0 0 rgba(0,0,0,.35);transition:transform .14s steps(2),background-color .1s steps(2),color .1s steps(2)}
.px-btn:hover,.px-btn:focus-visible{transform:translateY(-3px);background:#66c0f4;color:#0b1520;outline:none}
.px-btn:active{transform:translateY(2px)}
.px-btn.go{background:#7aa60a;color:#0f1a03}
.px-btn.go:hover,.px-btn.go:focus-visible{background:#beee11;color:#0f1a03}
.quake{animation:quake .45s steps(6)}
.pack-btn{display:block;padding:0;border:0;background:transparent;cursor:pointer}
.pack-btn:focus-visible{outline:3px solid #66c0f4;outline-offset:10px}
.pack-idle{animation:bob 3s ease-in-out infinite}
.pack-btn:hover .pack-idle{animation-duration:1s;filter:brightness(1.15)}
.pack-shake{animation:packShake .95s cubic-bezier(.5,0,.8,.4) forwards}
.shine-mask{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.shine{position:absolute;top:0;bottom:0;left:0;width:36px;background:rgba(255,255,255,.28);animation:sweep 2.8s steps(28) infinite}
.spark{position:absolute;left:-5px;top:-5px;width:10px;height:10px;background:#66c0f4;box-shadow:0 0 0 2px #06090d;animation:spark .6s cubic-bezier(.2,.8,.4,1) .55s both}
.spark.gold{background:#f4c542;animation-delay:.05s}
.deal{animation:deal .7s cubic-bezier(.2,1.5,.4,1) both}
.flip{position:relative;display:block;width:160px;height:224px;padding:0;border:0;background:transparent;cursor:pointer;perspective:900px}
.flip:focus-visible{outline:3px solid #66c0f4;outline-offset:8px}
.flip-inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,1.6,.5,1)}
.flip:hover .flip-inner{transform:translateY(-12px) rotateY(14deg) rotate(-2deg)}
.flip.is-flipped .flip-inner{transform:rotateY(180deg)}
.flip.is-flipped:hover .flip-inner{transform:rotateY(180deg) translateY(-10px) rotate(2deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.front{transform:rotateY(180deg)}
.key{width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:#1b2838;color:#66c0f4;box-shadow:0 0 0 2px #06090d,inset 0 -3px 0 0 rgba(0,0,0,.4);animation:keyLit 2.4s steps(1) infinite}
</style>
</helmet>

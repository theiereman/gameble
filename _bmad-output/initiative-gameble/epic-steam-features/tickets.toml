# tickets.toml — the epic's agreed children, in build order. tickets.py reads it.

[[entry]]
id = 1
type = "story"
title = "A player adds a card's game to their Steam wishlist"
description = "On the card detail of a signed-in player, a control adds the card's game to the player's Steam wishlist and shows whether the game is already on it. Steam has no public API that writes a wishlist with an OpenID sign-in or a Web API key: the store's `addtowishlist` endpoint needs the player's own store session. So the story starts by settling with the author how it works: the honest minimum is a button that opens the game's Steam store page where the player presses the wishlist button themselves (and reads the wishlist state back through the public profile's wishlist when the player's profile is public); anything that asks the player for their Steam session cookies is out. The control is an outbound link or a POST that never calls a write on Steam on the player's behalf, with its text in `en.yml` and `fr.yml` and the app's CSP and external-link rules respected."
verify = "A signed-in player sees the control on a card detail in English and French; it opens the game's Steam store page in a new tab with no referrer leak the app does not already allow; no Steam session cookie is requested or stored; the controller test and the card detail system test cover it; `i18n-tasks missing` and `unused` are clean."
covers = ["R1"]
after = []
hitl = true
risk = "medium"
unknown = "Whether any official way to write a Steam wishlist exists for a third-party site; if not, whether the outbound link satisfies the author, or whether to read the wishlist state back."
notes = ["Asked by the author, 2026-10-27, for milestone 1.1.0."]

[[entry]]
id = 2
type = "story"
title = "A player signed in with Discord, Google or email links their Steam account from the settings"
description = "Accounts::Identity already holds several providers per player and Accounts::AddClerkSignIn adds a Clerk sign-in to a player from the settings, but the reverse does not exist: the Steam OpenID return (SessionsController#create) only signs in or creates a player, so a Discord or Google player who signs in with Steam gets a second account. Add a Link Steam button to the settings sign-ins row, shown only when the player has no steam identity. It records a link intent in the session and goes to /auth/steam; the Steam return, with a signed-in player and that intent, calls a new operation Accounts::AddSteamSignIn (modelled on AddClerkSignIn: lock the player, refuse identity_taken, AddIdentity with provider steam, refresh the persona name) and goes back to the settings without opening a new session. When the Steam id already belongs to another player the link is refused with a clear message; there is no account merge (author, 2026-10-29). Future Steam features (wishlist, library) will require the steam identity and point to this button otherwise. Needs a Pundit policy for the action, strings in en.yml and fr.yml, and tests including a system test. Release 1.1.0 (author, 2026-10-29)."
verify = "A player signed in with Discord or Google clicks Link Steam in the settings, signs in on Steam and comes back to the settings with Steam listed among their sign-ins and no second account; a Steam id already held by another player is refused with a message and links nothing; a player who already has Steam sees no button."
covers = ["R2"]
after = []
hitl = false
risk = "medium"
notes = ["Builds on the Clerk sign-in of tickets 27.6 and 27.7 (identities foundation and the settings sign-ins row). Decision by the author, 2026-10-29: refuse when the Steam id is taken, no merge. Flag: the spec still says Steam is the only sign-in method (CAP-1 and its non-goals); to update with the Clerk decision."]

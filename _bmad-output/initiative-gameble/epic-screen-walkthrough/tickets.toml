[[entry]]
id = 6
type = "story"
title = "The friendship action on a profile"
description = "The identity band shows the viewer's one action: « AJOUTER EN AMI » sends an invitation in one click that lands in Amis, « EN ATTENTE » once sent, « ACCEPTER » for an invitation received, « ÉCHANGE » between friends, the trades-closed line for a private viewer, and nothing on one's own profile or for a signed-out visitor."
verify = "Request and operation tests show each relation's action, the invitation arriving in the recipient's Amis, acceptance creating the friendship, and a repeated invitation refused."
covers = ["R3"]
after = [5]
hitl = false
risk = "medium"
references = ["design — _bmad-output/initiative-gameble/ux-gameble/EXPERIENCE.md, Component Patterns: Profile action; Copy deck: Public profile", "spec — _bmad-output/initiative-gameble/spec-gameble/spec-gameble.md, CAP-10"]


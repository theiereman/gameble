[[entry]]
id = 9
type = "bug"
title = "The public profile's card count capped at its total, and staff see a banned player's line again"
description = "From the author's review of entry 3 (2026-10-19): the identity band's CARTES counts games held in any edition over the published season's total, so after a season change it can read more than its total; it is capped at the total. With the visibility line gone, staff reading a banned player's profile no longer see that the player is banned; the line comes back for staff only, never for players or visitors."
verify = "A player holding more games across editions than the season counts sees CARTES n/total with n at most total; a moderator or administrator on a banned player's profile sees the banned line, a player or visitor never does; the profile's query count is unchanged."
covers = ["R3"]
after = [3]
hitl = false
risk = "low"


description = "« VOIR LA COLLECTION COMPLÈTE » and the friend profile's « VOIR LA COLLECTION » open that player's collection as the viewer's own collection screen shows it (sets and all cards, search and filters), read-only on the owner's cards; the friend profile loses its showcase and gains « VOIR LE PROFIL »; the old profile index of sets is retired, and a card opened from that collection leads back to it."

[[entry]]
id = 27
type = "story"
title = "View transitions only where the screen really changes"
description = "Navigations animate with a view transition (`view-transition-name: screen` in `app/frontend/styles/shell.css`, the `::view-transition-old(root)` and `new(root)` rules, the sub-view steps in `app/frontend/lib/sub_view_step.ts`), including between steps of Échanges where almost everything on screen stays the same, which feels meaningless (author, 2026-10-23, on staging). Inventory which navigations animate today, with the author keep the transition only where the layout or the content block really changes (for example hub to a screen, grid to card detail) and turn it off where the new screen shares nearly the same frame, starting with Échanges; reduced motion and the browsers without view transitions stay as they are. The trade board is a React island frozen to fixes, so keep the change to the transition rules and the page's `view-transition` meta, not the island."

[[entry]]
id = 11
type = "story"
title = "The market opens in production"
description = "HITL. With the market release deployed closed, the author exercises it on staging after opening it there, covering the Done when of the auction and follow-auctions epics: entrusts, lists, bids, is outbid with the bell line and the live Annonce, wins, sells with a notable sale in the feed, buys at once, relists an unsold copy, bans a test leader and a test seller and deletes a test account with a balance, then checks the night's reconciliation; reads the prices on a card detail and in the collection; checks after a night that the snapshot is written and the health page and signals read; then closes it again. The author checks that the published capsule odds (pages/_odds_table.html.erb in Comment ça marche) match Game::DrawOdds and that the terms carry story 9's clause in both languages. Then, in the production back-office, the author opens the market through OpenMarket with both confirmations and its announcement, and checks that the market address shows the market screen and that the next morning's snapshot exists."
verify = "In production the market address shows the market screen, the settings version records the opening with both confirmations, and the first daily snapshot is written the next night."
covers = ["R20"]
after = [10]
hitl = true
risk = "high"

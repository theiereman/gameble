# Staging: the home lab LXC behind the author's Traefik, which
# terminates TLS for gameble.dotsncircles.com and forwards plain HTTP to
# kamal-proxy on port 80 of the LXC.
#   bin/kamal deploy -d staging
#
# Kamal reaches the LXC over SSH through Traefik (entrypoint :2224 ->
# the LXC's port 22), so servers use the DNS name, not the LXC's own address,
# which has nothing listening on 2224.
servers:
  web:
    - gameble.dotsncircles.com
  import:
    hosts:
      - gameble.dotsncircles.com
    cmd: bin/jobs -c config/queue_import.yml --skip-recurring

proxy:
  ssl: false                       # Traefik holds the certificate
  host: gameble.dotsncircles.com
  forward_headers: true            # keep Traefik's X-Forwarded-Proto: https

env:
  clear:
    SENTRY_ENVIRONMENT: staging
    PUBLIC_URL: https://gameble.dotsncircles.com
    # Production mode refuses to boot without the legal page's contact and host.
    LEGAL_CONTACT_EMAIL: contact@gameble.net
    LEGAL_HOST_NAME: Thomas Eyermann
    LEGAL_HOST_ADDRESS: France

accessories:
  db:
    host: gameble.dotsncircles.com

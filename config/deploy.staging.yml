# Staging (AD-21): the home lab LXC behind the author's Traefik, which
# terminates TLS for gameble.dotsncircles.com and forwards plain HTTP to
# kamal-proxy on 192.168.1.6:80.
#   bin/kamal deploy -d staging
#
# Kamal reaches the LXC over SSH through Traefik (entrypoint :2224 ->
# 192.168.1.6:22), so servers use the DNS name, not the LXC's own IP, which
# has nothing listening on 2224.
servers:
  web:
    - gameble.dotsncircles.com
  import:
    hosts:
      - gameble.dotsncircles.com
    cmd: bin/jobs -c config/queue_import.yml --skip-recurring

proxy:
  ssl: false                       # Traefik holds the certificate
  host: gameble.dotsncircles.com
  forward_headers: true            # keep Traefik's X-Forwarded-Proto: https

env:
  clear:
    PUBLIC_URL: https://gameble.dotsncircles.com

accessories:
  db:
    host: gameble.dotsncircles.com

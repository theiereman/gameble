# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

# The import worker killed outright loses its page job: put stalled runs
# back on the import queue.
recover_stalled_imports: &recover_stalled_imports
  class: Steam::RecoverStalledImportsJob
  queue: default
  schedule: every 5 minutes

# The weekly goal's total is summed from the players' own contribution rows;
# the gauge moves about every ten seconds.
sum_weekly_goal: &sum_weekly_goal
  class: Game::SumWeeklyGoalJob
  queue: default
  schedule: every 10 seconds

broadcast_goal: &broadcast_goal
  class: LiveGoalJob
  queue: default
  schedule: every 10 seconds

expire_trades: &expire_trades
  class: Game::ExpireTradesJob
  queue: default
  schedule: every minute

# A due auction closes within seconds of its end; a close stuck for minutes is reported.
close_due_auctions: &close_due_auctions
  class: Game::CloseDueAuctionsJob
  queue: default
  schedule: every 10 seconds

# A banned or deleted player's market presence is dropped within a minute.
drop_presence: &drop_presence
  class: Game::Market::DropPresenceJob
  queue: default
  schedule: every minute

check_market_health: &check_market_health
  class: Game::CheckMarketHealthJob
  queue: default
  schedule: every 5 minutes

# The week's Flukeometer verdict goes to the feed once the week has closed.
publish_weekly_verdict: &publish_weekly_verdict
  class: Game::PublishWeeklyVerdictJob
  queue: default
  schedule: every monday at 12:05am

# Personal data is kept no longer than the privacy notice says.
apply_retention: &apply_retention
  class: Accounts::ApplyRetentionJob
  queue: default
  schedule: every day at 4am

# Each player's Steam library set follows their Steam games, once a day.
sync_steam_libraries: &sync_steam_libraries
  class: SyncSteamLibrariesJob
  queue: default
  schedule: every day at 5am

# Every wallet is checked against its ledger entries, and the circulation against what was minted less destroyed.
reconcile_wallets: &reconcile_wallets
  class: Game::ReconcileWalletsJob
  queue: default
  schedule: every day at 12:10am

# The Archives' stock of each edition is summed from the players' deposits.
sum_archive_stocks: &sum_archive_stocks
  class: Game::ArchiveStocksJob
  queue: default
  schedule: every hour

development:
  recover_stalled_imports: *recover_stalled_imports
  sum_weekly_goal: *sum_weekly_goal
  broadcast_goal: *broadcast_goal
  expire_trades: *expire_trades
  close_due_auctions: *close_due_auctions
  drop_presence: *drop_presence
  check_market_health: *check_market_health
  reconcile_wallets: *reconcile_wallets
  sum_archive_stocks: *sum_archive_stocks
  publish_weekly_verdict: *publish_weekly_verdict
  apply_retention: *apply_retention
  sync_steam_libraries: *sync_steam_libraries

production:
  recover_stalled_imports: *recover_stalled_imports
  sum_weekly_goal: *sum_weekly_goal
  broadcast_goal: *broadcast_goal
  expire_trades: *expire_trades
  close_due_auctions: *close_due_auctions
  drop_presence: *drop_presence
  check_market_health: *check_market_health
  reconcile_wallets: *reconcile_wallets
  sum_archive_stocks: *sum_archive_stocks
  publish_weekly_verdict: *publish_weekly_verdict
  apply_retention: *apply_retention
  sync_steam_libraries: *sync_steam_libraries
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

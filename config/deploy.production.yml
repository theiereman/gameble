# Production: gameble.net on a VPS, not set up yet. Fill in the
# server, then create .kamal/secrets.production (its own master key,
# database password, Sentry DSN and Steam key) before
#   bin/kamal deploy -d production
#
# On a VPS kamal-proxy terminates TLS itself (Let's Encrypt), so ports 80
# and 443 must reach it; with Cloudflare in front, set its SSL/TLS mode to
# "Full". The image registry must be reachable from the VPS (e.g. ghcr.io
# with KAMAL_REGISTRY_PASSWORD), not localhost:5555.
servers:
  web: []        # - <VPS address>
  import:
    hosts: []    # - <VPS address>
    cmd: bin/jobs -c config/queue_import.yml --skip-recurring

# Every container logs to journald, which the host keeps 30 days (README, Retention).
logging:
  driver: journald

proxy:
  ssl: true
  host: gameble.net
  forward_headers: true            # keep Cloudflare's X-Forwarded-For: the client's address
  run:
    log_max_size: ""
    options:
      log-driver: journald

env:
  clear:
    PUBLIC_URL: https://gameble.net
    # The legal page's contact and host; each line is hidden while unset.
    LEGAL_CONTACT_EMAIL: contact@gameble.net
    # LEGAL_HOST_NAME: <host company name>
    # LEGAL_HOST_ADDRESS: <host postal address>


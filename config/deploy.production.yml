# Production: gameble.net on its own home lab LXC (192.168.1.44), reached only
# through a Cloudflare Tunnel: cloudflared runs on the LXC as a systemd service
# and forwards plain HTTP to kamal-proxy on localhost:80. No inbound web port
# is open, so no request reaches the app without passing Cloudflare.
#   bin/kamal deploy -d production --skip-push
# run by .github/workflows/deploy-production.yml for each release (RELEASING.md).
#
# The image is the one its candidate ran on staging, copied registry-side to a
# package of its own: the staging cleanup keeps five images of
# ghcr.io/theiereman/gameble and spares none, while releases are never deleted.
image: theiereman/gameble-releases

# Cloudflare terminates TLS at its edge and sets X-Forwarded-For; the
# request then arrives from cloudflared's private address, which Rails
# trusts, so each player keeps their own client address in the rate limits.
#
# Kamal reaches the LXC over SSH through the home lab's Traefik (entrypoint
# :2225 -> 192.168.1.44:22). gameble.net is a tunnel, which carries no SSH,
# so servers use a DNS-only name for the home lab's public address.
servers:
  web:
    - gameble.dotsncircles.com
  import:
    hosts:
      - gameble.dotsncircles.com
    cmd: bin/jobs -c config/queue_import.yml --skip-recurring

ssh:
  port: 2225

# Every container logs to journald, which the host keeps 30 days (README, Retention).
logging:
  driver: journald

proxy:
  ssl: false                       # Cloudflare holds the certificate
  host: gameble.net
  forward_headers: true            # keep Cloudflare's X-Forwarded-For and X-Forwarded-Proto
  run:
    log_max_size: ""
    options:
      log-driver: journald

env:
  clear:
    SENTRY_ENVIRONMENT: production
    PUBLIC_URL: https://gameble.net
    # The legal page's contact and host; each line is hidden while unset.
    LEGAL_CONTACT_EMAIL: contact@gameble.net
    # LEGAL_HOST_NAME: <host company name>
    # LEGAL_HOST_ADDRESS: <host postal address>

accessories:
  db:
    host: gameble.dotsncircles.com

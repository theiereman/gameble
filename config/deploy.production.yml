# Production: gameble.net on its own home lab LXC (192.168.1.44), behind
# Cloudflare and then the author's Traefik, which terminates TLS for
# gameble.net and forwards plain HTTP to kamal-proxy on 192.168.1.44:80.
#   bin/kamal deploy -d production --skip-push
# run by .github/workflows/deploy-production.yml for each release (RELEASING.md).
#
# The image is the one its candidate ran on staging, copied registry-side to a
# package of its own: the staging cleanup keeps five images of
# ghcr.io/theiereman/gameble and spares none, while releases are never deleted.
image: theiereman/gameble-releases

# Cloudflare's SSL/TLS mode is "Full (strict)": Traefik holds a valid
# certificate. Traefik's entrypoint must trust Cloudflare's ranges
# (forwardedHeaders.trustedIPs), or it replaces X-Forwarded-For and every
# player shares one client address in the rate limits.
#
# Kamal reaches the LXC over SSH through Traefik (entrypoint :2225 ->
# 192.168.1.44:22). gameble.net is proxied by Cloudflare, which carries no
# SSH, so servers use a DNS-only name for the same public address.
servers:
  web:
    - gameble.dotsncircles.com
  import:
    hosts:
      - gameble.dotsncircles.com
    cmd: bin/jobs -c config/queue_import.yml --skip-recurring

ssh:
  port: 2225

# Every container logs to journald, which the host keeps 30 days (README, Retention).
logging:
  driver: journald

proxy:
  ssl: false                       # Traefik holds the certificate
  host: gameble.net
  forward_headers: true            # keep Cloudflare's X-Forwarded-For and Traefik's X-Forwarded-Proto
  run:
    log_max_size: ""
    options:
      log-driver: journald

# A destination's list replaces the shared one: production adds its own
# SECRET_KEY_BASE, so a session signed on staging is never valid here.
env:
  secret:
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    - SENTRY_DSN
    - GAMEBLE_DATABASE_PASSWORD
    - STEAM_API_KEY
  clear:
    SENTRY_ENVIRONMENT: production
    PUBLIC_URL: https://gameble.net
    # The legal page's contact and host; each line is hidden while unset.
    LEGAL_CONTACT_EMAIL: contact@gameble.net
    # LEGAL_HOST_NAME: <host company name>
    # LEGAL_HOST_ADDRESS: <host postal address>

accessories:
  db:
    host: gameble.dotsncircles.com

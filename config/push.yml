shared:
  apple:
    key_id: <%= ENV["APNS_KEY_ID"] %>
    encryption_key: <%= ENV["APNS_ENCRYPTION_KEY"]&.dump %>
    team_id: <%= ENV["APNS_TEAM_ID"] %>
    topic: <%= ENV.fetch("APNS_TOPIC", "net.gameble.app") %>
    connect_to_development_server: <%= ENV["APNS_DEVELOPMENT"] == "on" %>
  google:
    encryption_key: <%= ENV["FCM_SERVICE_ACCOUNT"]&.dump %>
    project_id: <%= ENV["FCM_PROJECT_ID"] %>

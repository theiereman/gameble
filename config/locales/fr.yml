      minutes:
        zero: "%{count} minute"
        one: "%{count} minute"
        other: "%{count} minutes"
      selection:
        title: "Quels jeux deviennent des cartes"
        rule: "Chaque carte est un jeu Steam. Un jeu devient une carte s'il est bien un jeu (ni un logiciel, ni une démo, ni un contenu additionnel), s'il a un titre, une date de sortie et une image verticale sur Steam, et s'il compte au moins %{reviews} évaluations."
        seasons: "Chaque nouvelle saison relit Steam : les jeux qui remplissent ces conditions à ce moment-là deviennent ses cartes."
      rarity:
        title: "La rareté"
        rule: "Plus un jeu a d'évaluations sur Steam, plus sa carte est rare."
        score: "Seul le nombre d'évaluations classe les jeux. La part d'évaluations positives ne départage que des jeux qui ont exactement le même nombre d'évaluations : le plus apprécié passe devant."
        # French keeps the singular for 0, which the plural rule here does not.
        cut:
          zero: "À la publication d'une saison, ses cartes sont classées ainsi, du jeu le plus évalué au moins évalué, puis réparties en %{count} rareté dans ces proportions :"
          one: "À la publication d'une saison, ses cartes sont classées ainsi, du jeu le plus évalué au moins évalué, puis réparties en %{count} rareté dans ces proportions :"
          other: "À la publication d'une saison, ses cartes sont classées ainsi, du jeu le plus évalué au moins évalué, puis réparties en %{count} raretés dans ces proportions :"
        ties: "Deux jeux qui ont le même nombre d'évaluations et la même part d'évaluations positives ont toujours la même rareté : les proportions réelles peuvent donc s'écarter un peu de celles-ci."
      packs:
        title: "Capsules et probabilités"
        # French keeps the singular for 0, which the plural rule here does not.
        regular:
          zero: "Une capsule contient %{count} carte. Chaque carte est tirée séparément : d'abord sa rareté, avec les chances ci-dessous, puis un jeu de cette rareté. Une même carte peut donc sortir plusieurs fois."
          one: "Une capsule contient %{count} carte. Chaque carte est tirée séparément : d'abord sa rareté, avec les chances ci-dessous, puis un jeu de cette rareté. Une même carte peut donc sortir plusieurs fois."
          other: "Une capsule contient %{count} cartes. Chaque carte est tirée séparément : d'abord sa rareté, avec les chances ci-dessous, puis un jeu de cette rareté. Une même carte peut donc sortir plusieurs fois."
        bonus: "La capsule quotidienne a de meilleures chances et ne contient jamais de carte %{common} :"
        reward: "La capsule de récompense de l'objectif communautaire :"
        forced: "Si elle ne contient aucune carte %{rarity} ou mieux, l'une de ses cartes, au hasard, est remplacée par une carte tirée avec ces chances :"
        rarity: "Rareté"
        chance: "Chance par carte"
        tables:
          regular: "Capsule standard"
          bonus: "Capsule quotidienne"
          reward: "Capsule de récompense"

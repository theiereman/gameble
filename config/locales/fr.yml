        title: Les saisons
      selection:
        rule: Chaque carte est un jeu Steam. Un jeu devient une carte s'il est bien
          un jeu (ni un logiciel, ni une démo, ni un contenu additionnel), s'il a
          un titre, une date de sortie et une image verticale sur Steam, et s'il compte
          au moins %{reviews} évaluations.
        seasons: 'Chaque nouvelle saison relit Steam : les jeux qui remplissent ces
          conditions à ce moment-là deviennent ses cartes.'
        title: Quels jeux deviennent des cartes
      sets:
        franchises:
          one: 'Les franchises : une série d''au moins %{count} jeu, dont le nom figure
            d''ordinaire dans leurs titres et n''est pas celui d''un studio ou d''un
            éditeur.'
          other: 'Les franchises : une série d''au moins %{count} jeux, dont le nom
            figure d''ordinaire dans leurs titres et n''est pas celui d''un studio
            ou d''un éditeur.'
          zero: 'Les franchises : une série d''au moins %{count} jeu, dont le nom
            figure d''ordinaire dans leurs titres et n''est pas celui d''un studio
            ou d''un éditeur.'
        hall_of_fame:
          intro: 'Le panthéon, d''après la note et le nombre d''évaluations sur Steam
            :'
          row: "%{name} : %{rule}"
          rules:
            intouchables: les jeux très connus et presque unanimement salués ;
            mal-aimes: les jeux très connus mais à l'accueil mitigé ;
            pepites: les jeux presque unanimement salués mais encore peu connus ;
            phenomenes: les jeux qui comptent un nombre énorme d'évaluations.
        intro: Chaque saison regroupe ses cartes en sets, et une carte peut appartenir
          à plusieurs d'entre eux.
        studios:
          one: 'Les studios : au moins %{count} jeu d''un même studio principal, dont
            l''un compte au moins %{reviews} évaluations.'
          other: 'Les studios : au moins %{count} jeux d''un même studio principal,
            dont l''un compte au moins %{reviews} évaluations.'
          zero: 'Les studios : au moins %{count} jeu d''un même studio principal,
            dont l''un compte au moins %{reviews} évaluations.'
        themes:
          one: 'Les thèmes : %{count} thème regroupe les jeux par genre, d''après
            leurs tags Steam les plus votés.'
          other: 'Les thèmes : %{count} thèmes regroupent les jeux par genre, d''après
            leurs tags Steam les plus votés.'
          zero: 'Les thèmes : %{count} thème regroupe les jeux par genre, d''après
            leurs tags Steam les plus votés.'
        tiers: 'Chaque set a des paliers selon sa taille, puis la complétion à 100
          %. Le dernier palier avant la complétion est toujours Maître ; plus le set
          est grand, plus il compte de paliers en dessous : de 3 à 4 cartes, la complétion
          seule ; de 5 à 9, Maître à la moitié ; de 10 à 19, Expert au tiers et Maître
          aux deux tiers ; de 20 à 59, Adepte à 25 %, Expert à 50 % et Maître à 75
          % ; de 60 à 199, Apprenti à 10 %, Adepte à 25 %, Expert à 50 % et Maître
          à 75 % ; à partir de 200, Novice à 10 %, Apprenti à 25 %, Adepte à 50 %,
          Expert à 75 % et Maître à 90 %.'
        title: Les sets
        ufos: "%{name} : les jeux qui n'entrent dans aucun thème."
      timing:
        bank:
          one: Au plus %{count} capsule standard vous attend à la fois, prête ou à
            venir.
          other: Au plus %{count} capsules standard vous attendent à la fois, prêtes
            ou à venir.
          zero: Au plus %{count} capsule standard vous attend à la fois, prête ou
            à venir.
        refill: Des capsules standard ouvertes d'un coup sont donc toutes de retour
          en %{minutes}.
        replace: Chaque capsule ouverte est remplacée %{minutes} après la dernière
          capsule en attente, ou après l'ouverture si toutes étaient prêtes.
        season: À la publication d'une nouvelle saison, les capsules standard qui
          vous manquent sont données aussitôt.
        title: Le rythme des capsules
      title: Comment ça marche
    legal:
      credits_link: Crédits
      ownership:
        affiliation: Gameble n'est affilié ni à Valve ni à Steam, et n'est ni approuvé
          ni soutenu par eux. Steam et le logo Steam sont des marques de Valve Corporation.
        artwork: Toutes les illustrations appartiennent aux éditeurs des jeux et à
          leurs artistes, que nous respectons.
        data: Les noms, couvertures et descriptions des jeux viennent de Steam et
          restent la propriété de leurs ayants droit. Sur demande d'un ayant droit,
          le jeu concerné est retiré sans délai.
        title: Steam, Valve et les jeux
      privacy:
        controller_html: Le responsable du traitement de vos données est Thomas Eyermann,
          éditeur de Gameble, joignable à %{contact}.
        cookies: 'Gameble n''utilise que des cookies strictement nécessaires, exemptés
          de consentement : celui de la session, qui protège les formulaires et vous
          garde connecté pendant 30 jours après votre dernière visite, ou jusqu''à
          la déconnexion, et celui qui retient votre choix d''animations réduites,
          pendant un an. Cloudflare peut y ajouter un cookie de sécurité qui filtre
          les robots. Le stockage de votre navigateur garde aussi vos brouillons d''échange
          et l''état de l''interface, sur votre appareil seulement. Aucun traceur
          publicitaire ni de mesure d''audience.'
        deletion: Quand vous supprimez votre compte, votre identifiant Steam, votre
          nom de profil, l'heure de votre dernière visite, votre dernier export de
          données, votre dernière activité, votre collection, votre vitrine, vos paliers
          de sets, vos succès, vos capsules, vos bonus du jour, vos récompenses de
          l'objectif communautaire, vos amitiés, vos invitations, votre code ami et
          vos entrées du fil d'activité sont effacés, vos échanges en cours sont annulés
          et votre profil disparaît. Ce qui concerne aussi d'autres joueurs, la communauté
          ou la modération (échanges passés, premières découvertes, contributions
          à l'objectif communautaire, signalements, historique de modération, journal
          des actions du jeu) est conservé sans votre identifiant Steam ni votre nom,
          pendant les durées indiquées plus haut.
        nothing_else: Pas de mesure d'audience, pas de publicité, pas d'argent réel.
          Vos données ne sont ni vendues ni cédées.
        purposes:
          game: 'faire fonctionner votre compte et le jeu (collection, capsules, échanges,
            amis, profil, fil d''activité) : exécution des conditions d''utilisation
            que vous acceptez en vous connectant (art. 6.1.b du RGPD) ;'
          intro: 'Pourquoi et sur quelle base :'
          moderation: 'modérer la communauté (signalements, bannissements, historique
            de modération) : intérêt légitime de l''éditeur à faire respecter les
            règles et à protéger les joueurs (art. 6.1.f) ;'
          no_automation: Aucune décision vous concernant n'est prise de façon automatisée.
          requests: 'répondre à vos messages et à vos demandes sur vos données : obligation
            légale (art. 6.1.c).'
          security: 'sécuriser le site et corriger les erreurs (journaux du serveur,
            limitation des abus, suivi d''erreurs, Cloudflare) : intérêt légitime
            à assurer la sécurité et le bon fonctionnement du service (art. 6.1.f)
            ;'
        retention:
          account: 'votre compte, votre activité de jeu et vos réglages : tant que
            le compte existe ; un compte sans aucune visite connectée depuis trois
            ans est supprimé comme si vous l''aviez supprimé vous-même, sauf ceux
            des modérateurs et des administrateurs ;'
          backups: 'les sauvegardes de la base de données, chiffrées et conservées
            en France : les 7 dernières sauvegardes quotidiennes, soit 7 jours en
            temps normal ; un compte supprimé en disparaît au bout de 7 jours, un
            peu plus si une sauvegarde a échoué ;'
          banned_steam_id: 'l''identifiant Steam d''un compte suspendu : tant que
            la suspension dure, pour refuser une nouvelle inscription ;'
          errors: 'les erreurs techniques reçues par Sentry : 30 jours ;'
          intro: 'Combien de temps vos données sont conservées :'
          leftovers: 'ce qu''un compte supprimé laisse et qui concerne d''autres joueurs
            ou la communauté (échanges passés, premières découvertes, contributions
            à l''objectif communautaire, journal des actions du jeu) : tant que le
            jeu existe, sans identifiant Steam ni nom.'
          logs: 'les journaux du serveur : 30 jours ;'
          moderation: 'l''historique de modération, motifs compris : une suspension
            tant qu''elle dure, puis un an après sa levée ; un classement de signalements,
            un an ; l''historique d''un compte supprimé, jusqu''à un an après la suppression
            ; le journal des actions du jeu garde la date de chaque décision et les
            comptes concernés, sans le motif ;'
          reports: 'un signalement : jusqu''à ce qu''un modérateur le traite, puis
            un an ; s''il vise un compte supprimé avant d''être traité, un an après
            la suppression ;'
        rights:
          access: 'accès : depuis les paramètres, avec « Exporter » dans « Mes données
            », qui télécharge une copie de vos données dans un fichier réutilisable
            ;'
          authority: CNIL
          banned_html: 'compte suspendu : il ne peut plus se connecter ; le motif
            de la suspension s''affiche quand vous tentez de vous connecter ; écrivez
            à %{contact} pour contester la décision, obtenir vos données ou l''effacement
            de votre compte ;'
          complaint_html: 'réclamation : auprès de la %{authority}.'
          death_html: 'après votre décès : indiquez à %{contact} à qui vos données
            doivent être communiquées ou si elles doivent être effacées ;'
          erasure: 'suppression : depuis les paramètres, avec « Supprimer mon compte
            » ;'
          intro: Vous pouvez accéder à vos données, les faire rectifier ou effacer,
            en limiter le traitement, vous opposer à un traitement fondé sur l'intérêt
            légitime et en recevoir une copie réutilisable. Vous pouvez aussi indiquer
            ce que deviennent vos données après votre décès. Nous répondons sous un
            mois.
          objection_html: 'opposition : rendez votre profil privé dans les paramètres,
            ou écrivez à %{contact} ;'
          rectification_html: 'rectification : votre nom de profil suit celui de Steam
            et il est relu à chaque connexion ; pour le reste, écrivez à %{contact}
            ;'
        services:
          cloudflare: 'Cloudflare, Inc. se place devant le site pour le protéger et
            l''accélérer : il voit passer ses requêtes, dont votre adresse IP, et
            les traite notamment aux États-Unis. Ce transfert repose sur la décision
            d''adéquation de la Commission européenne du 10 juillet 2023 (Data Privacy
            Framework), à laquelle Cloudflare adhère ;'
          host: Le site tourne sur des serveurs exploités par %{name}, en %{address}
            ;
          images: les images des cartes se chargent depuis le réseau de diffusion
            de Steam, que votre navigateur contacte directement.
          intro: 'Quelques services extérieurs interviennent :'
          ovh: 'OVH SAS conserve les sauvegardes de la base de données, chiffrées
            avant de quitter le serveur : il ne peut pas les lire. Données hébergées
            en France ;'
          sentry: 'Sentry (Functional Software, Inc.) reçoit les erreurs techniques
            : l''adresse de la page et celle d''où vous venez, le navigateur utilisé
            et sa langue, et votre identifiant interne de joueur, jamais votre nom
            ni votre identifiant Steam. Votre navigateur lui envoie aussi directement
            les rapports de sécurité de la page, avec votre adresse IP. Données hébergées
            dans l''Union européenne ;'
          steam: Steam (Valve) gère la connexion et fournit votre nom de profil ;
        stored:
          activity: 'votre activité de jeu : cartes, capsules, échanges, amis et invitations,
            code ami, entrées du fil d''activité ;'
          intro: 'Pour faire fonctionner le jeu, Gameble conserve :'
          last_seen: la date de création de votre compte, l'heure de votre dernière
            visite, et votre dernier export de données (son fichier et son heure),
            gardé jusqu'à l'export suivant ;
          moderation: les signalements que vous faites, ceux qui visent votre profil
            (leur auteur ne vous est pas communiqué) et les décisions de modération
            qui vous concernent, avec leur motif ;
          settings: vos réglages (visibilité du profil, animations réduites) ;
          steam: votre identifiant Steam et votre nom de profil Steam ;
          technical: 'des données techniques : adresse IP et navigateur, dans les
            journaux du serveur et le suivi d''erreurs.'
        title: Confidentialité
        visibility: 'Votre profil est public par défaut : votre nom de profil, votre
          collection et vos entrées du fil d''activité sont visibles de tous, y compris
          des visiteurs non connectés. Vous pouvez le réserver à vos amis ou le rendre
          privé dans les paramètres. Les modérateurs de Gameble peuvent consulter
          tout profil, quel que soit son réglage.'
      publisher:
        contact: Contact
        host: Hébergeur
        individual: Thomas Eyermann, particulier, à titre non professionnel et non
          commercial. Ses coordonnées personnelles sont connues de l'hébergeur.
        publisher: Éditeur
        title: Éditeur et hébergeur
      source:
        link: Code source
        text: 'Le code de Gameble est libre, sous licence GNU AGPL v3.0. Son pixel
          art est sous licence Creative Commons BY-NC-SA 4.0 : réutilisable en citant
          Gameble, jamais à des fins commerciales. Le nom Gameble et son logo restent
          réservés.'
        title: Code source
      support:
        link: Soutenir
        text: Gameble est gratuit et le restera. Si le jeu vous plaît, vous pouvez
          aider à payer son hébergement. Les dons sont facultatifs et ne donnent aucun
          avantage dans le jeu. Ils passent par Buy Me a Coffee, selon ses propres
          conditions. L'éditeur reçoit ce que vous choisissez d'y indiquer (nom, message).
        title: Soutenir Gameble
      terms:
        acceptance: En vous connectant avec Steam, vous acceptez ces conditions.
        changes: Ces conditions peuvent évoluer. Une modification importante est annoncée
          dans le jeu avant de s'appliquer. La version en vigueur est celle de cette
          page.
        fair_play: 'Jouez loyalement : pas de bot, de script ni d''automatisation,
          pas de comptes multiples, pas d''exploitation de bug.'
        free: Gameble est un jeu gratuit, sans publicité et sans achat.
        law: Elles sont régies par le droit français.
        moderation_html: Les joueurs peuvent signaler un profil. Des modérateurs examinent
          chaque signalement et peuvent suspendre un compte qui enfreint ces règles.
          La décision est toujours prise par une personne. Le joueur suspendu voit
          le motif de la décision quand il tente de se connecter et peut la contester
          en écrivant à %{contact}.
        no_guarantee: Le service est gratuit et fourni tel quel. Il peut être interrompu
          pour maintenance ou modifié. S'il devait fermer définitivement, la fermeture
          serait annoncée sur le site au moins 30 jours à l'avance.
        no_money: 'Aucun argent réel n''y circule : rien ne s''y achète, rien ne s''y
          vend.'
        no_property: 'Les cartes, capsules et dos de cartes sont des éléments du jeu
          : ils ne sont pas votre propriété et n''ont aucune valeur, ni en argent
          ni hors de Gameble. Aucune carte ne peut être vendue ou échangée contre
          de l''argent, dans Gameble ou en dehors.'
        notice_html: 'Même sans compte Gameble, vous pouvez signaler un contenu illicite
          ou demander le retrait d''un jeu dont vous détenez les droits : écrivez
          à %{contact} en indiquant l''adresse de la page et la raison de votre demande.'
        title: Conditions d'utilisation
      title: Mentions légales et confidentialité
      updated: 'Dernière mise à jour : 20 octobre 2026'

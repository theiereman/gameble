  # Number formats (number_with_delimiter, number_with_precision,
  # number_to_percentage). Defined here so test and production render the
  # same (production falls back to en). The delimiter is a no-break space
  # (U+00A0), as DESIGN.md groups digits ("31 420").
  number:
    format:
      separator: ","
      delimiter: "\u00A0"
    precision:
      format:
        delimiter: ""
    percentage:
      format:
        delimiter: ""
        format: "%n\u00A0%"

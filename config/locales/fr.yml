      terms:
        title: "Conditions d'utilisation"
        acceptance: "En vous connectant avec Steam, vous acceptez ces conditions."
        free: "gameble est un jeu gratuit, sans publicité et sans achat."
        no_money: "Aucun argent réel n'y circule : rien ne s'y achète, rien ne s'y vend."
        no_property: "Les cartes, boosters et dos de cartes sont des éléments du jeu : ils ne sont pas votre propriété et n'ont aucune valeur, ni en argent ni hors de gameble. Aucune carte ne peut être vendue ou échangée contre de l'argent, dans gameble ou en dehors."
        fair_play: "Jouez loyalement : pas de bot, de script ni d'automatisation, pas de comptes multiples, pas d'exploitation de bug."
        moderation_html: "Les joueurs peuvent signaler un profil. Des modérateurs examinent chaque signalement et peuvent suspendre un compte qui enfreint ces règles. La décision est toujours prise par une personne. Le joueur suspendu voit le motif de la décision quand il tente de se connecter et peut la contester en écrivant à %{contact}."
        notice_html: "Même sans compte gameble, vous pouvez signaler un contenu illicite ou demander le retrait d'un jeu dont vous détenez les droits : écrivez à %{contact} en indiquant l'adresse de la page et la raison de votre demande."
        no_guarantee: "Le service est gratuit et fourni tel quel. Il peut être interrompu pour maintenance ou modifié. S'il devait fermer définitivement, la fermeture serait annoncée sur le site au moins 30 jours à l'avance."
        changes: "Ces conditions peuvent évoluer. Une modification importante est annoncée dans le jeu avant de s'appliquer. La version en vigueur est celle de cette page."
        law: "Elles sont régies par le droit français."
      privacy:
        title: "Confidentialité"
        controller_html: "Le responsable du traitement de vos données est Thomas Eyermann, éditeur de gameble, joignable à %{contact}."
        controller: "Le responsable du traitement de vos données est Thomas Eyermann, éditeur de gameble."
        stored:
          intro: "Pour faire fonctionner le jeu, gameble conserve :"
          steam: "votre identifiant Steam et votre nom de profil Steam ;"
          activity: "votre activité de jeu : cartes, boosters, échanges, amis et invitations, code ami, entrées du fil d'activité ;"
          moderation: "les signalements que vous faites, ceux qui visent votre profil (leur auteur ne vous est pas communiqué) et les décisions de modération qui vous concernent, avec leur motif ;"
          settings: "vos réglages (visibilité du profil, animations réduites) ;"
          last_seen: "la date de création de votre compte et l'heure de votre dernière visite ;"
          technical: "des données techniques : adresse IP et navigateur, dans les journaux du serveur et le suivi d'erreurs."
        purposes:
          intro: "Pourquoi et sur quelle base :"
          game: "faire fonctionner votre compte et le jeu (collection, boosters, échanges, amis, profil, fil d'activité) : exécution des conditions d'utilisation que vous acceptez en vous connectant (art. 6.1.b du RGPD) ;"
          moderation: "modérer la communauté (signalements, bannissements, historique de modération) : intérêt légitime de l'éditeur à faire respecter les règles et à protéger les joueurs (art. 6.1.f) ;"
          security: "sécuriser le site et corriger les erreurs (journaux du serveur, limitation des abus, suivi d'erreurs, Cloudflare) : intérêt légitime à assurer la sécurité et le bon fonctionnement du service (art. 6.1.f) ;"
          requests: "répondre à vos messages et à vos demandes sur vos données : obligation légale (art. 6.1.c)."
          no_automation: "Aucune décision vous concernant n'est prise de façon automatisée."
        visibility: "Votre profil est public par défaut : votre nom de profil, votre collection et vos entrées du fil d'activité sont visibles de tous, y compris des visiteurs non connectés. Vous pouvez le réserver à vos amis ou le rendre privé dans les paramètres. Les modérateurs de gameble peuvent consulter tout profil, quel que soit son réglage."
        cookies: "gameble n'utilise que des cookies strictement nécessaires, exemptés de consentement : celui de la session, qui protège les formulaires et vous garde connecté pendant 30 jours après votre dernière visite, ou jusqu'à la déconnexion, et celui qui retient votre choix d'animations réduites, pendant un an. Cloudflare peut y ajouter un cookie de sécurité qui filtre les robots. Le stockage de votre navigateur garde aussi vos brouillons d'échange et l'état de l'interface, sur votre appareil seulement. Aucun traceur publicitaire ni de mesure d'audience."
        nothing_else: "Pas de mesure d'audience, pas de publicité, pas d'argent réel. Vos données ne sont ni vendues ni cédées."
        services:
          intro: "Quelques services extérieurs interviennent :"
          steam: "Steam (Valve) gère la connexion et fournit votre nom de profil ;"
          sentry: "Sentry (Functional Software, Inc.) reçoit les erreurs techniques : l'adresse de la page et celle d'où vous venez, le navigateur utilisé et sa langue, et votre identifiant interne de joueur, jamais votre nom ni votre identifiant Steam. Votre navigateur lui envoie aussi directement les rapports de sécurité de la page, avec votre adresse IP. Données hébergées dans l'Union européenne ;"
          cloudflare: "Cloudflare, Inc. se place devant le site pour le protéger et l'accélérer : il voit passer ses requêtes, dont votre adresse IP, et les traite notamment aux États-Unis. Ce transfert repose sur la décision d'adéquation de la Commission européenne du 10 juillet 2023 (Data Privacy Framework), à laquelle Cloudflare adhère ;"
          images: "les images des cartes se chargent depuis le réseau de diffusion de Steam, que votre navigateur contacte directement."
        retention:
          intro: "Combien de temps vos données sont conservées :"
          account: "votre compte, votre activité de jeu et vos réglages : tant que le compte existe ; un compte sans aucune visite connectée depuis trois ans est supprimé comme si vous l'aviez supprimé vous-même, sauf ceux des modérateurs et des administrateurs ;"
          reports: "un signalement : jusqu'à ce qu'un modérateur le traite, puis un an ; s'il vise un compte supprimé avant d'être traité, un an après la suppression ;"
          moderation: "l'historique de modération, motifs compris : une suspension tant qu'elle dure, puis un an après sa levée ; un classement de signalements, un an ; l'historique d'un compte supprimé, jusqu'à un an après la suppression ; le journal des actions du jeu garde la date de chaque décision et les comptes concernés, sans le motif ;"
          banned_steam_id: "l'identifiant Steam d'un compte suspendu : tant que la suspension dure, pour refuser une nouvelle inscription ;"
          logs: "les journaux du serveur : 30 jours ;"
          errors: "les erreurs techniques reçues par Sentry : 90 jours au plus, selon l'offre Sentry de l'éditeur ;"
          leftovers: "ce qu'un compte supprimé laisse et qui concerne d'autres joueurs ou la communauté (échanges passés, premières découvertes, contributions à l'objectif communautaire, journal des actions du jeu) : tant que le jeu existe, sans identifiant Steam ni nom."
        deletion: "Quand vous supprimez votre compte, votre identifiant Steam, votre nom de profil, l'heure de votre dernière visite, votre collection, vos boosters, vos amitiés, vos invitations, votre code ami et vos entrées du fil d'activité sont effacés, vos échanges en cours sont annulés et votre profil disparaît. Ce qui concerne aussi d'autres joueurs, la communauté ou la modération (échanges passés, premières découvertes, contributions à l'objectif communautaire, signalements, historique de modération, journal des actions du jeu) est conservé sans votre identifiant Steam ni votre nom, pendant les durées indiquées plus haut."
        rights:
          intro: "Vous pouvez accéder à vos données, les faire rectifier ou effacer, en limiter le traitement, vous opposer à un traitement fondé sur l'intérêt légitime et en recevoir une copie réutilisable. Vous pouvez aussi indiquer ce que deviennent vos données après votre décès. Nous répondons sous un mois."
          access_html: "accès : demandez une copie de vos données par e-mail, à %{contact} ;"
          access_publisher: "accès : demandez une copie de vos données à l'éditeur ;"
          rectification_html: "rectification : votre nom de profil suit celui de Steam et il est relu à chaque connexion ; pour le reste, écrivez à %{contact} ;"
          erasure: "suppression : depuis les paramètres, avec « Supprimer mon compte » ;"
          objection_html: "opposition : rendez votre profil privé dans les paramètres, ou écrivez à %{contact} ;"
          death_html: "après votre décès : indiquez à %{contact} à qui vos données doivent être communiquées ou si elles doivent être effacées ;"
          banned_html: "compte suspendu : il ne peut plus se connecter ; le motif de la suspension s'affiche quand vous tentez de vous connecter ; écrivez à %{contact} pour contester la décision, obtenir vos données ou l'effacement de votre compte ;"
          complaint_html: "réclamation : auprès de la %{authority}."
          authority: "CNIL"
      support:
        title: "Soutenir gameble"
        text: "gameble est gratuit et le restera. Si le jeu vous plaît, vous pouvez aider à payer son hébergement. Les dons sont facultatifs et ne donnent aucun avantage dans le jeu. Ils passent par Buy Me a Coffee, selon ses propres conditions. L'éditeur reçoit ce que vous choisissez d'y indiquer (nom, message)."
        link: "Soutenir"
    how_it_works:
      title: "Comment ça marche"
      more: "Plus"
      intro: "Les règles du jeu, telles qu'il les applique."
      # French keeps the singular for 0, which the plural rule here does not.
      minutes:
        zero: "%{count} minute"
        one: "%{count} minute"
        other: "%{count} minutes"
      selection:
        title: "Quels jeux deviennent des cartes"
        rule: "Chaque carte est un jeu Steam. Un jeu devient une carte s'il est bien un jeu (ni un logiciel, ni une démo, ni un contenu additionnel), s'il a un titre, une date de sortie et une image verticale sur Steam, et s'il compte au moins %{reviews} évaluations."
        seasons: "Chaque nouvelle saison relit Steam : les jeux qui remplissent ces conditions à ce moment-là deviennent ses cartes."
      rarity:
        title: "La rareté"
        rule: "La rareté d'une carte vient de son jeu sur Steam : plus le jeu est connu et apprécié, plus sa carte est rare."
        score: "Chaque jeu reçoit un score. Le nombre d'évaluations compte d'abord : le score gagne un point chaque fois que ce nombre est multiplié par dix. La part d'évaluations positives s'y ajoute, multipliée par %{weight}, et départage les jeux connus de façon semblable. Sur peu d'évaluations, cette part est estimée avec prudence."
        # French keeps the singular for 0, which the plural rule here does not.
        cut:
          zero: "À la publication d'une saison, ses cartes sont classées par score, du plus haut au plus bas, puis réparties en %{count} rareté dans ces proportions :"
          one: "À la publication d'une saison, ses cartes sont classées par score, du plus haut au plus bas, puis réparties en %{count} rareté dans ces proportions :"
          other: "À la publication d'une saison, ses cartes sont classées par score, du plus haut au plus bas, puis réparties en %{count} raretés dans ces proportions :"
        ties: "Deux jeux de même score ont toujours la même rareté : les proportions réelles peuvent donc s'écarter un peu de celles-ci."
      packs:
        title: "Boosters et probabilités"
        # French keeps the singular for 0, which the plural rule here does not.
        regular:
          zero: "Un booster contient %{count} carte. Chaque carte est tirée séparément : d'abord sa rareté, avec les chances ci-dessous, puis un jeu de cette rareté. Une même carte peut donc sortir plusieurs fois."
          one: "Un booster contient %{count} carte. Chaque carte est tirée séparément : d'abord sa rareté, avec les chances ci-dessous, puis un jeu de cette rareté. Une même carte peut donc sortir plusieurs fois."
          other: "Un booster contient %{count} cartes. Chaque carte est tirée séparément : d'abord sa rareté, avec les chances ci-dessous, puis un jeu de cette rareté. Une même carte peut donc sortir plusieurs fois."
        bonus: "Le booster quotidien a de meilleures chances et ne contient jamais de carte %{common} :"
        reward: "Le booster de récompense de l'objectif communautaire :"
        forced: "S'il ne contient aucune carte %{rarity} ou mieux, l'une de ses cartes, au hasard, est remplacée par une carte tirée avec ces chances :"
        rarity: "Rareté"
        chance: "Chance par carte"
        tables:
          regular: "Booster standard"
          bonus: "Booster quotidien"
          reward: "Booster de récompense"
          epic_or_better: "Carte de remplacement"
      timing:
        title: "Le rythme des boosters"
        # French keeps the singular for 0, which the plural rule here does not.
        bank:
          zero: "Au plus %{count} booster standard vous attend à la fois, prêt ou à venir."
          one: "Au plus %{count} booster standard vous attend à la fois, prêt ou à venir."
          other: "Au plus %{count} boosters standard vous attendent à la fois, prêts ou à venir."
        replace: "Chaque booster ouvert est remplacé %{minutes} après le dernier booster en attente, ou après l'ouverture si tous étaient prêts."
        refill: "Des boosters standard ouverts d'un coup sont donc tous de retour en %{minutes}."
        season: "À la publication d'une nouvelle saison, les boosters standard qui vous manquent sont donnés aussitôt."
      daily:
        title: "Le booster quotidien"
        once: "Une fois par jour, un booster offert vous attend sur le pont. Le jour se compte en temps universel (UTC)."
        # French keeps the singular for 0, which the plural rule here does not.
        content:
          zero: "Il contient %{count} carte, aucune %{common}."
          one: "Il contient %{count} carte, aucune %{common}."
          other: "Il contient %{count} cartes, aucune %{common}."
        outside: "Il s'ajoute aux boosters standard, sans compter dans leur limite et sans les retarder."
        # French keeps the singular for 0, which the plural rule here does not.
        full:
          zero: "Il est refusé tant que votre réserve compte %{count} booster ou plus prêt à ouvrir : ouvrez-en un d'abord."
          one: "Il est refusé tant que votre réserve compte %{count} booster ou plus prêt à ouvrir : ouvrez-en un d'abord."
          other: "Il est refusé tant que votre réserve compte %{count} boosters ou plus prêts à ouvrir : ouvrez-en un d'abord."
      goal:
        title: "L'objectif communautaire"
        week: "Chaque semaine, du lundi à minuit (UTC) au dimanche soir, tous les joueurs visent ensemble un même objectif."
        counts: "Chaque booster ouvert y compte, de même que chaque échange conclu, qui fait des deux joueurs des contributeurs."
        # French keeps the singular for 0, which the plural rule here does not.
        reward:
          zero: "Si l'objectif est atteint, chaque joueur qui y a contribué reçoit un booster de récompense : %{count} carte, dont au moins une %{rarity} ou mieux."
          one: "Si l'objectif est atteint, chaque joueur qui y a contribué reçoit un booster de récompense : %{count} carte, dont au moins une %{rarity} ou mieux."
          other: "Si l'objectif est atteint, chaque joueur qui y a contribué reçoit un booster de récompense : %{count} cartes, dont au moins une %{rarity} ou mieux."
      seasons:
        title: "Les saisons"
        frozen: "Une saison est tirée de Steam. Dès sa publication, la rareté, le numéro et les sets de chacune de ses cartes sont figés : ils ne changent plus pendant la saison."
        next: "La saison suivante relit Steam : de nouveaux jeux entrent, les scores sont recalculés et la rareté d'un même jeu peut changer d'une saison à l'autre."
      sets:
        title: "Les sets"
        intro: "Chaque saison regroupe ses cartes en sets, et une carte peut appartenir à plusieurs d'entre eux."
        # French keeps the singular for 0, which the plural rule here does not.
        themes:
          zero: "Les thèmes : %{count} thème regroupe les jeux par genre, d'après leurs tags Steam les plus votés."
          one: "Les thèmes : %{count} thème regroupe les jeux par genre, d'après leurs tags Steam les plus votés."
          other: "Les thèmes : %{count} thèmes regroupent les jeux par genre, d'après leurs tags Steam les plus votés."
        # French keeps the singular for 0, which the plural rule here does not.
        franchises:
          zero: "Les franchises : une série d'au moins %{count} jeu."
          one: "Les franchises : une série d'au moins %{count} jeu."
          other: "Les franchises : une série d'au moins %{count} jeux."
        # French keeps the singular for 0, which the plural rule here does not.
        studios:
          zero: "Les studios : au moins %{count} jeu d'un même studio, dont l'un compte au moins %{reviews} évaluations."
          one: "Les studios : au moins %{count} jeu d'un même studio, dont l'un compte au moins %{reviews} évaluations."
          other: "Les studios : au moins %{count} jeux d'un même studio, dont l'un compte au moins %{reviews} évaluations."
        hall_of_fame:
          intro: "Le panthéon, d'après la note et le nombre d'évaluations sur Steam :"
          row: "%{name} : %{rule}"
          rules:
            intouchables: "les jeux très connus et presque unanimement salués ;"
            pepites: "les jeux presque unanimement salués mais encore peu connus ;"
            mal-aimes: "les jeux très connus mais à l'accueil mitigé ;"
            phenomenes: "les jeux qui comptent le plus d'évaluations."
        ufos: "%{name} : les jeux qui n'entrent dans aucun thème."
        tiers: "Les thèmes et le panthéon ont des paliers : bronze à %{bronze} de leurs cartes, argent à %{silver}, or à %{gold}, puis la complétion. Les autres sets se complètent seulement."
      completion:
        title: "Compléter un set"
        rule: "Un set est complet quand vous possédez en même temps toutes ses cartes. Les doubles ne comptent qu'une fois, et une carte compte dans chaque set où elle figure."
        once: "Une complétion n'est enregistrée qu'une fois : une carte échangée puis récupérée ne complète rien de nouveau. Votre profil compte les sets que vous possédez complets en ce moment."
  back_office:
    dashboard:
      show:
        heading: "Le back-office de la Confrérie"
        queue:
          zero: "Aucun joueur signalé n'attend les officiers."
          one: "Un joueur signalé attend les officiers."
          other: "%{count} joueurs signalés attendent les officiers."
        players: "Les joueurs"
        reports: "Les signalements"
        bans: "Les bannis"
        history: "L'historique"
        jobs: "La file des tâches"
        import_runs: "L'import Steam"
        seasons: "Les saisons du catalogue"
        cards: "La presse à cartes"
    reports:
      index:
        heading: "Les signalements"

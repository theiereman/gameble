    how_it_works:
      completion:
        once: 'A completion is recorded only once: a card traded away and gained again
          completes nothing new. Your profile counts the sets you hold complete right
          now.'
        rule: A set is complete when you hold all of its cards at the same time. Duplicates
          count once, and a card counts in every set it belongs to.
        title: Completing a set
      daily:
        content:
          one: It holds %{count} card, never a %{common} one.
          other: It holds %{count} cards, never a %{common} one.
        once: Once a day, a free capsule waits for you on the bridge. The day changes
          at %{time}.
        outside: It comes on top of the standard capsules, without counting toward
          their limit and without delaying them.
        special: 'It joins your special reserve, which has no limit: it is never refused,
          even when your standard reserve is full.'
        title: The daily capsule
      goal:
        counts: Every capsule opened counts toward it, and so does every completed
          trade, which makes both players contributors.
        reward:
          one: 'When the goal is reached, every player who contributed earns a reward
            capsule: %{count} card, at least one of them %{rarity} or better. If you
            contributed, you collect it on the hub and it joins your special reserve.'
          other: 'When the goal is reached, every player who contributed earns a reward
            capsule: %{count} cards, at least one of them %{rarity} or better. If
            you contributed, you collect it on the hub and it joins your special reserve.'
        title: The community goal
        week: Every week, for seven days from %{time}, all players aim at one goal
          together.
      intro: The rules of the game, as it applies them.
      local_time: ", local time"
      minutes:
        one: "%{count} minute"
        other: "%{count} minutes"
      more: More
      packs:
        bonus: 'The daily capsule has better odds and never holds a %{common} card:'
        chance: Chance per card
        forced: 'When none of its cards is %{rarity} or better, one of them, at random,
          is replaced by a card drawn with these odds:'
        rarity: Rarity
        regular:
          one: 'A capsule holds %{count} card. Each card is drawn on its own: first
            its rarity, with the odds below, then a game of that rarity. The same
            card can therefore come up more than once.'
          other: 'A capsule holds %{count} cards. Each card is drawn on its own: first
            its rarity, with the odds below, then a game of that rarity. The same
            card can therefore come up more than once.'
        reward: 'The community goal''s reward capsule:'
        tables:
          bonus: Daily capsule
          epic_or_better: Replacement card
          regular: Standard capsule
          reward: Reward capsule
        title: Capsules and odds
      rarity:
        cut:
          one: 'When a season is published, its cards are ranked this way, from the
            most reviewed game to the least, then split into %{count} rarity in these
            proportions:'
          other: 'When a season is published, its cards are ranked this way, from
            the most reviewed game to the least, then split into %{count} rarities
            in these proportions:'
        rule: The more reviews a game has on Steam, the rarer its card.
        score: 'The review count alone ranks the games. The share of positive reviews
          only orders games with exactly the same number of reviews: the better liked
          one ranks higher.'
        ties: Two games with the same number of reviews and the same share of positive
          reviews always share a rarity, so the actual proportions can differ slightly
          from these.
        title: Rarity
      seasons:
        frozen: 'A season is drawn from Steam. Once it is published, the rarity, number
          and sets of each of its cards are fixed: they no longer change during the
          season.'
        next: 'The next season reads Steam again: new games come in, scores are computed
          again, and the same game''s rarity can change from one season to the next.'
        title: Seasons
      selection:
        rule: Every card is a Steam game. A game becomes a card when it is a game
          (not software, a demo or downloadable content), has a title, a release date
          and a vertical image on Steam, and counts at least %{reviews} reviews.
        seasons: 'Each new season reads Steam again: the games that meet these conditions
          at that moment become its cards.'
        title: Which games become cards
      sets:
        franchises:
          one: 'Franchises: a series of at least %{count} game, its name usually in
            their titles and not a studio''s or a publisher''s.'
          other: 'Franchises: a series of at least %{count} games, its name usually
            in their titles and not a studio''s or a publisher''s.'
        hall_of_fame:
          intro: 'The hall of fame, from the rating and the review count on Steam:'
          row: "%{name}: %{rule}"
          rules:
            intouchables: very well-known games acclaimed almost unanimously;
            mal-aimes: very well-known games with a mixed reception;
            pepites: games acclaimed almost unanimously but still little known;
            phenomenes: the games with a huge number of reviews.
        intro: Each season groups its cards into sets, and a card can belong to several
          of them.
        studios:
          one: 'Studios: at least %{count} game with the same lead studio, one of
            them with at least %{reviews} reviews.'
          other: 'Studios: at least %{count} games with the same lead studio, one
            of them with at least %{reviews} reviews.'
        themes:
          one: 'Themes: %{count} theme groups games by genre, from their most-voted
            Steam tags.'
          other: 'Themes: %{count} themes group games by genre, from their most-voted
            Steam tags.'
        tiers: 'Every set has tiers by its size, then completion at 100 %. The last
          tier before completion is always Master; the larger the set, the more tiers
          below it: 3 to 4 cards, completion only; 5 to 9, Master at half; 10 to 19,
          Expert at a third and Master at two thirds; 20 to 59, Adept at 25 %, Expert
          at 50 % and Master at 75 %; 60 to 199, Apprentice at 10 %, Adept at 25 %,
          Expert at 50 % and Master at 75 %; from 200, Novice at 10 %, Apprentice
          at 25 %, Adept at 50 %, Expert at 75 % and Master at 90 %.'
        title: Sets
        ufos: "%{name}: the games that fit no theme."
      timing:
        bank:
          one: At most %{count} standard capsule waits for you at a time, ready or
            on its way.
          other: At most %{count} standard capsules wait for you at a time, ready
            or on their way.
        refill: Standard capsules opened all at once are therefore all back within
          %{minutes}.
        replace: Each capsule opened is replaced %{minutes} after the last capsule
          waiting, or after the opening when all of them were ready.
        season: When a new season is published, the standard capsules you are missing
          are given at once.
        title: The pace of capsules
      title: How it works
    legal:
      credits_link: Credits
      ownership:
        affiliation: Gameble is not affiliated with Valve or Steam, and is not endorsed
          or sponsored by them. Steam and the Steam logo are trademarks of Valve Corporation.
        artwork: All artwork belongs to the games' publishers and their artists, whom
          we respect.
        data: The games' names, covers and descriptions come from Steam and remain
          the property of their rights holders. At a rights holder's request, the
          game concerned is removed without delay.
        title: Steam, Valve and the games
      privacy:
        controller_html: The controller of your data is Thomas Eyermann, publisher
          of Gameble, reachable at %{contact}.
        cookies: 'Gameble only uses strictly necessary cookies, exempt from consent:
          the session cookie, which protects forms and keeps you signed in for 30
          days after your last visit, or until you sign out, and the one that remembers
          your reduced motion choice, for one year. Cloudflare may add a security
          cookie that filters out bots. Your browser''s storage also keeps your trade
          drafts and the interface''s state, on your device only. No advertising or
          audience measurement trackers.'
        deletion: When you delete your account, your Steam id, your sign-in methods (and, at Clerk, the user that holds your email address, which is deleted there too), your profile name,
          the time of your last visit, your last data export, your latest activity,
          your collection, your showcase, your set tiers, your achievements, your
          card back unlocks and your choice of active card back, your capsules, your daily bonuses, your community goal rewards, your friendships,
          your invitations, your friend code and your activity feed entries are erased,
          your open trades are cancelled and your profile disappears. What also concerns
          other players, the community or moderation (past trades, first discoveries,
          contributions to the community goal, reports, moderation history, the log
          of game actions) is kept without your Steam id or your name, for the periods
          given above.
        nothing_else: No analytics, no ads, no real money. Your data is neither sold
          nor handed over.
        purposes:
          game: 'running your account and the game (collection, capsules, trades,
            friends, profile, activity feed): performance of the terms of use you
            accept by signing in (GDPR Article 6(1)(b));'
          intro: 'Why, and on what basis:'
          moderation: 'moderating the community (reports, bans, moderation history):
            the publisher''s legitimate interest in enforcing the rules and protecting
            players (Article 6(1)(f));'
          no_automation: No decision about you is made by automated means.
          requests: 'answering your messages and your requests about your data: legal
            obligation (Article 6(1)(c)).'
          security: 'securing the site and fixing errors (server logs, abuse limiting,
            error tracking, Cloudflare): legitimate interest in keeping the service
            secure and working properly (Article 6(1)(f));'
        retention:
          account: 'your account, your game activity and your settings: as long as
            the account exists; an account with no signed-in visit for three years
            is deleted as if you had deleted it yourself, except those of moderators
            and administrators;'
          backups: 'the database backups, encrypted and kept in France: the last 7
            daily backups, that is 7 days in normal times; a deleted account is gone
            from them after 7 days, a little longer if a backup failed;'
          banned_steam_id: 'the Steam id of a suspended account: as long as the suspension
            lasts, to refuse a new sign-up;'
          clerk: 'the Clerk user created for a Discord, Google or email code sign-in, with
            your email address and its sessions: as long as the account exists; it is
            deleted from Clerk when you delete your account;'
          errors: 'technical errors received by Sentry: 30 days;'
          intro: 'How long your data is kept:'
          leftovers: 'what a deleted account leaves behind that concerns other players
            or the community (past trades, first discoveries, contributions to the
            community goal, the log of game actions): as long as the game exists,
            without a Steam id or a name.'
          logs: 'the server''s logs: 30 days;'
          moderation: 'the moderation history, reasons included: a ban as long as
            it lasts, then one year after it is lifted; a dismissal of reports, one
            year; the history of a deleted account, until one year after the deletion;
            the log of game actions keeps each decision''s date and the accounts concerned,
            without the reason;'
          reports: 'a report: until a moderator handles it, then one year; if it targets
            an account deleted before it was handled, one year after the deletion;'
        rights:
          access: 'access: from the settings, with "Export" under "My data", which
            downloads a copy of your data in a reusable file, your sign-in methods
            included;'
          authority: CNIL
          banned_html: 'suspended account: it can no longer sign in; the reason for
            the suspension is shown when you try to sign in; write to %{contact} to
            contest the decision, obtain your data or have your account erased;'
          complaint_html: 'complaint: to the %{authority}, the French data protection
            authority.'
          death_html: 'after your death: tell %{contact} who your data should be passed
            on to or whether it should be erased;'
          erasure: 'deletion: from the settings, with "Delete my account";'
          intro: You can access your data, have it rectified or erased, restrict its
            processing, object to processing based on legitimate interest and receive
            a reusable copy of it. You can also say what becomes of your data after
            your death. We reply within one month.
          objection_html: 'objection: make your profile private in the settings, or
            write to %{contact};'
          rectification_html: 'rectification: a Steam profile name is read again at each
            Steam sign-in; for anything else, write to %{contact};'
        services:
          clerk: 'Clerk, Inc. handles sign-in through Discord, Google or an email code,
            as our processor: it holds the Clerk user created for you (your email address,
            the identifier Discord or Google gives for you, and your sign-in sessions),
            and may process it in the United States among other places. Your browser
            contacts it directly on the sign-in screen and in the settings. Gameble
            keeps only the Clerk user''s identifier and a one-way hash of your verified
            email address, never the address itself;'
          cloudflare: 'Cloudflare, Inc. sits in front of the site to protect and speed
            it up: it sees its requests, your IP address included, and processes them
            in the United States among other places. This transfer relies on the European
            Commission''s adequacy decision of 10 July 2023 (Data Privacy Framework),
            to which Cloudflare adheres;'
          host: The site runs on servers operated by %{name}, in %{address};
          images: card images load from Steam's content delivery network, which your
            browser contacts directly.
          intro: 'A few outside services take part:'
          ovh: OVH SAS stores the database backups, encrypted before they leave the
            server, so it cannot read them. Data hosted in France;
          sentry: 'Sentry (Functional Software, Inc.) receives technical errors: the
            page''s address and the one you came from, the browser used and its language,
            and your internal player id, never your name or your Steam id. Your browser
            also sends it the page''s security reports directly, with your IP address.
            Data hosted in the European Union;'
          steam: Steam (Valve) handles sign-in and provides your profile name;
        stored:
          activity: 'your game activity: cards, capsules, trades, friends and invitations,
            friend code, activity feed entries;'
          identities: 'your sign-in methods: Steam, Discord, Google or an email code, each
            with its identifier at that provider, the date it was added and, for the
            last three, a one-way hash of your verified email address, never the address
            itself;'
          intro: 'To run the game, Gameble keeps:'
          last_seen: the date your account was created, the time of your last visit,
            and your last data export (its file and its time), kept until the next
            one;
          moderation: the reports you make, those aimed at your profile (their author
            is not disclosed to you) and the moderation decisions that concern you,
            with their reason;
          settings: your settings (profile visibility, reduced motion);
          steam: your Steam id and your Steam profile name;
          technical: 'technical data: IP address and browser, in the server logs and
            error tracking.'
        title: Privacy
        visibility: 'Your profile is public by default: your profile name, your collection
          and your activity feed entries are visible to everyone, including visitors
          who are not signed in. You can restrict it to your friends or make it private
          in the settings. Gameble''s moderators can view any profile, whatever its
          setting.'
      publisher:
        contact: Contact
        host: Host
        individual: Thomas Eyermann, a private individual, on a non-professional and
          non-commercial basis, whose personal details are known to the host.
        publisher: Publisher
        title: Publisher and host
      source:
        link: Source code
        text: 'Gameble''s code is free software under the GNU AGPL v3.0 license. Its
          pixel art is under the Creative Commons BY-NC-SA 4.0 license: reusable with
          credit, never for a commercial purpose. The Gameble name and logo remain
          reserved.'
        title: Source code
      support:
        link: Support
        text: Gameble is free and will stay free. If you enjoy the game, you can help
          pay for its hosting. Donations are optional and give no advantage in the
          game. They go through Buy Me a Coffee, under its own terms. The publisher
          receives whatever you choose to enter there (name, message).
        title: Support Gameble
      terms:
        acceptance: By signing in, you accept these terms.
        changes: These terms may change. A significant change is announced in the
          game before it applies. The version in force is the one on this page.
        fair_play: 'Play fair: no bots, scripts or automation, no multiple accounts,
          no exploiting bugs.'
        free: Gameble is a free game, with no ads and no purchases.
        law: They are governed by French law.
        moderation_html: Players can report a profile. Moderators review every report
          and may suspend an account that breaks these rules. The decision is always
          made by a person. A suspended player sees the reason for the decision when
          trying to sign in and can contest it by writing to %{contact}.
        no_guarantee: The service is free and provided as is. It may be interrupted
          for maintenance or changed. Should it close for good, the closure would
          be announced on the site at least 30 days in advance.
        no_money: 'No real money flows through it: nothing is bought, nothing is sold.'
        no_property: 'Cards, capsules and card backs are parts of the game: they are
          not your property and have no value, neither in money nor outside Gameble.
          No card may be sold or exchanged for money, in Gameble or outside it.'
        notice_html: 'Even without a Gameble account, you can report illegal content
          or ask for the removal of a game whose rights you hold: write to %{contact}
          with the page''s address and the reason for your request.'
        title: Terms of use
      title: Legal notice and privacy
      updated: 'Last updated: 20 October 2026'

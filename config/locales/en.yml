        title: "Steam, Valve and the games"
        affiliation: "gameble is not affiliated with Valve or Steam, and is not endorsed or sponsored by them. Steam and the Steam logo are trademarks of Valve Corporation."
        artwork: "All artwork belongs to the games' publishers and their artists, whom we respect."
        data: "The games' names, covers and descriptions come from Steam and remain the property of their rights holders. At a rights holder's request, the game concerned is removed without delay."
      terms:
        title: "Terms of use"
        acceptance: "By signing in with Steam, you accept these terms."
        free: "gameble is a free game, with no ads and no purchases."
        no_money: "No real money flows through it: nothing is bought, nothing is sold."
        no_property: "Cards, boosters and card backs are parts of the game: they are not your property and have no value, neither in money nor outside gameble. No card may be sold or exchanged for money, in gameble or outside it."
        fair_play: "Play fair: no bots, scripts or automation, no multiple accounts, no exploiting bugs."
        moderation_html: "Players can report a profile. Moderators review every report and may suspend an account that breaks these rules. The decision is always made by a person. A suspended player sees the reason for the decision when trying to sign in and can contest it by writing to %{contact}."
        notice_html: "Even without a gameble account, you can report illegal content or ask for the removal of a game whose rights you hold: write to %{contact} with the page's address and the reason for your request."
        no_guarantee: "The service is free and provided as is. It may be interrupted for maintenance or changed. Should it close for good, the closure would be announced on the site at least 30 days in advance."
        changes: "These terms may change. A significant change is announced in the game before it applies. The version in force is the one on this page."
        law: "They are governed by French law."
      privacy:
        title: "Privacy"
        controller_html: "The controller of your data is Thomas Eyermann, publisher of gameble, reachable at %{contact}."
        controller: "The controller of your data is Thomas Eyermann, publisher of gameble."
        stored:
          intro: "To run the game, gameble keeps:"
          steam: "your Steam id and your Steam profile name;"
          activity: "your game activity: cards, boosters, trades, friends and invitations, friend code, activity feed entries;"
          moderation: "the reports you make, those aimed at your profile (their author is not disclosed to you) and the moderation decisions that concern you, with their reason;"
          settings: "your settings (profile visibility, reduced motion);"
          last_seen: "the date your account was created and the time of your last visit;"
          technical: "technical data: IP address and browser, in the server logs and error tracking."
        purposes:
          intro: "Why, and on what basis:"
          game: "running your account and the game (collection, boosters, trades, friends, profile, activity feed): performance of the terms of use you accept by signing in (GDPR Article 6(1)(b));"
          moderation: "moderating the community (reports, bans, moderation history): the publisher's legitimate interest in enforcing the rules and protecting players (Article 6(1)(f));"
          security: "securing the site and fixing errors (server logs, abuse limiting, error tracking, Cloudflare): legitimate interest in keeping the service secure and working properly (Article 6(1)(f));"
          requests: "answering your messages and your requests about your data: legal obligation (Article 6(1)(c))."
          no_automation: "No decision about you is made by automated means."
        visibility: "Your profile is public by default: your profile name, your collection and your activity feed entries are visible to everyone, including visitors who are not signed in. You can restrict it to your friends or make it private in the settings. gameble's moderators can view any profile, whatever its setting."
        cookies: "gameble only uses strictly necessary cookies, exempt from consent: the session cookie, which protects forms and keeps you signed in until you sign out or close your browser, and the one that remembers your reduced motion choice, for one year. Cloudflare may add a security cookie that filters out bots. Your browser's storage also keeps your trade drafts and the interface's state, on your device only. No advertising or audience measurement trackers."
        nothing_else: "No analytics, no ads, no real money. Your data is neither sold nor handed over."
        services:
          intro: "A few outside services take part:"
          steam: "Steam (Valve) handles sign-in and provides your profile name;"
          sentry: "Sentry (Functional Software, Inc.) receives technical errors: the page's address and the one you came from, the browser used and its language, and your internal player id, never your name or your Steam id. Your browser also sends it the page's security reports directly, with your IP address. Data hosted in the European Union;"
          cloudflare: "Cloudflare sits in front of the site and sees its requests;"
          images: "card images load from Steam's content delivery network, which your browser contacts directly."
        deletion: "When you delete your account, your Steam id, your profile name, the time of your last visit, your collection, your boosters, your friendships, your invitations, your friend code and your activity feed entries are erased, your open trades are cancelled and your profile disappears. What also concerns other players, the community or moderation (past trades, first discoveries, contributions to the community goal, reports, moderation history, the log of game actions) is kept without your Steam id or your name."
        rights:
          intro: "You can access your data, have it rectified or erased, restrict its processing, object to processing based on legitimate interest and receive a reusable copy of it. You can also say what becomes of your data after your death. We reply within one month."
          access_html: "access: ask for a copy of your data by e-mail, at %{contact};"
          access_publisher: "access: ask the publisher for a copy of your data;"
          rectification_html: "rectification: your profile name follows your Steam one and is read again at each sign-in; for anything else, write to %{contact};"
          erasure: "deletion: from the settings, with \"Delete my account\";"
          objection_html: "objection: make your profile private in the settings, or write to %{contact};"
          death_html: "after your death: tell %{contact} who your data should be passed on to or whether it should be erased;"
          banned_html: "suspended account: it can no longer sign in; the reason for the suspension is shown when you try to sign in; write to %{contact} to contest the decision, obtain your data or have your account erased;"
          complaint_html: "complaint: to the %{authority}, the French data protection authority."
          authority: "CNIL"
      support:
        title: "Support gameble"
        text: "gameble is free and will stay free. If you enjoy the game, you can help pay for its hosting. Donations are optional and give no advantage in the game. They go through Buy Me a Coffee, under its own terms. The publisher receives whatever you choose to enter there (name, message)."

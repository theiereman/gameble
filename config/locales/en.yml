      statuses:
        draft: "Draft"
        published: "Published"
      index:
        heading: "The catalog seasons"
        intro: "Imports fill the draft season. Publishing it cuts its cards into the five rarities, settles the dust on their backs, binds them into publisher sets, genre tomes and the best of each year, and opens it to the draw, all at once. A published season never changes again."

        started: "The import is under way, officer. The scribes are copying the first page."
      resume:
        resumed: "The import resumes from where it stopped, officer."
      rescore:
        rescoring: "The scribes are writing the cards again with the new formula, officer. The season cannot be published until they finish."
        run_in_progress: "An import is under way, officer. Let it finish, or wait for it to halt, before rescoring the cards."
      abandon:
        abandoned: "The run is abandoned, officer. The scribes close its ledger for good; the draft season keeps the cards it holds."
    cards:
      index:
        heading: "The card press"
        intro: "Every rarity's face and back at both sizes, then one back under each level of dust: on the left as the pages draw them, on the right as the reveal will. The two must match line for line. The art is a sample from the Brotherhood's own chest; the emerald's art is missing on purpose, to show a card without it."

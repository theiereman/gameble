        rescoring: "The scribes are writing the cards again with the new formula, officer. The season cannot be published until they finish."
        run_in_progress: "An import is under way, officer. Let it finish, or wait for it to halt, before rescoring the cards."
      abandon:
        abandoned: "The run is abandoned, officer. The scribes close its ledger for good; the draft season is left as it stands."
    cards:
      index:
        heading: "The card press"
        intro: "Every rarity's face at the four sizes, then each rarity at size M with the booster's effects. Hover a card to tilt it. The art is a sample from the Brotherhood's own chest; the uncommon's art is missing on purpose, to show a card without it."

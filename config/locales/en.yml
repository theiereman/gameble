  # Number formats (number_with_delimiter, number_with_precision,
  # number_to_percentage), as Rails' own defaults; the twin of fr.yml's.
  number:
    format:
      separator: "."
      delimiter: ","
    precision:
      format:
        delimiter: ""
    percentage:
      format:
        delimiter: ""
        format: "%n%"

# i18n-tasks finds translation keys used in code but missing from the locale files.
# https://github.com/glebm/i18n-tasks

base_locale: en
locales: [en, fr]

data:
  read:
    - config/locales/**/*%{locale}.yml

search:
  paths:
    - app/
    - app/domains/
    # The sign-in throttle's 429 body (rack_attack.rb).
    - config/initializers/

# Failure keys are built from failure codes at runtime (Steam::SignInIdentity.failure_key,
# Accounts::SignIn.failure_key, Game::Operation), which the static search cannot see.
ignore_unused:
  - "errors.*"
  # Model validation messages, looked up by Active Record from errors.add symbols.
  - "activerecord.errors.messages.*"
  # Number formats, read by the number helpers (number_with_delimiter, …).
  - "number.*"
  # Date and time formats and names, read by I18n.l.
  - "date.*"
  - "time.*"
  # Hall of fame set names, looked up by a hall of fame set's key (SetLabel).
  - "catalog.hall_of_fame.*"
  # Pagy's dictionary, read by Pagy::I18n, not by the I18n gem.
  - "pagy.*"
  # The booster screen's run-time templates, passed whole to its root controller (BoostersHelper#booster_root_data).
  - "booster.strings.*"
  # The trade board's run-time templates, passed whole to its root controller (TradesHelper#trade_board_root_data).
  - "trade_board.strings.*"
  # Achievement names, looked up by the key an unlock carries (the player stream's toast).
  - "achievements.names.*"
  # Achievement conditions, read by catalogue key on the achievements screen.
  - "achievements.conditions.*"
  # The throttled request's 429 message, picked by the matched throttle (rack_attack.rb).
  - "rate_limit.*"
  # The Clerk messages go whole to the sign-in controller; provider names are picked by the identity's provider.
  - "sign_ins.clerk.messages.*"
  - "sign_ins.providers.*"
  - "accounts.destroy.throttled"
  - "daily_bonuses.create.throttled"
  - "friends.throttled"
  - "goal_rewards.create.throttled"
  - "invitations.throttled"
  - "reports.create.throttled"
  - "season_allocations.create.throttled"
  - "trades.throttled"
  - "custom_sets.throttled"
  # Month and day names, read by I18n.l for %b and %A in the local time formats.
  - "date.abbr_month_names"
  - "date.day_names"
  # The local time formats, read by I18n.l from a style (LocalTimeHelper#local_time_text).
  - "time.formats.local_*"
  # The landing's unlock tiles, named under a prefix held in a variable (landings/_unlock).
  - "landings.show.unlock.tiles.*"

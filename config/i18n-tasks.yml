# i18n-tasks finds translation keys used in code but missing from the locale files (AD-18).
# https://github.com/glebm/i18n-tasks

base_locale: en
locales: [en, fr]

data:
  read:
    - config/locales/**/*%{locale}.yml

search:
  paths:
    - app/
    - packs/
    # The sign-in throttle's 429 body (rack_attack.rb).
    - config/initializers/

# Failure keys are built from failure codes at runtime (Steam::SignInIdentity.failure_key,
# Accounts::SignIn.failure_key, Game::Operation), which the static search cannot see.
ignore_unused:
  - "errors.*"
  # Model validation messages, looked up by Active Record from errors.add symbols.
  - "activerecord.errors.messages.*"
  # Number formats, read by the number helpers (number_with_delimiter, …).
  - "number.*"
  # Genre labels, looked up by the genre key a tome's params carry (SetLabel).
  - "catalog.genres.*"
  # Theme names, looked up by a theme set's key and a card's main theme (SetLabel).
  - "catalog.themes.*"
  # Hall of fame set names, looked up by a hall of fame set's key (SetLabel).
  - "catalog.hall_of_fame.*"
  # Pagy's dictionary, read by Pagy::I18n, not by the I18n gem.
  - "pagy.*"
  # The Booster island's words, passed whole to its props (BoostersHelper#booster_props).
  - "boosters.island.*"
  # The TradeBoard island's words, by side and passed whole to its props (TradesHelper#trade_board_props).
  - "trades.island.*"
  # Achievement names, looked up by the key an unlock carries (the player stream's toast).
  - "achievements.names.*"
  # Achievement conditions, read by catalogue key on the achievements screen.
  - "achievements.conditions.*"

# The import worker: one process, one thread, the `import` and
# `steam_library` queues only, so Steam is called one request at a time.
# Run with `bin/jobs -c config/queue_import.yml --skip-recurring`. It has no
# dispatcher: the jobs process (config/queue.yml) dispatches scheduled retries.
default: &default
  workers:
    - queues: [ import, steam_library ]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

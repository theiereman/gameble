# The jobs process (bin/jobs): every queue but `import` and `steam_library`,
# which have their own process (config/queue_import.yml). Solid Queue cannot
# exclude a queue, so the queues are listed: add a new queue here. A worker
# costs 14 connections: duels shares the default worker, ahead of it, rather than adding one.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: [ duels, default ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 0.1
    - queues: [ share_images ]
      threads: 1
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default

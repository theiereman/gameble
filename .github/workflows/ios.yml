name: iOS app

on:
  push:
    paths: [ "mobile/ios/**", ".github/workflows/ios.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile/ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for a device, unsigned
        run: |
          xcodebuild build -project Gameble.xcodeproj -scheme Gameble -configuration Release \
            -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO

name: Deploy to production

# Production runs releases only (RELEASING.md). Run by hand from an accepted
# candidate's tag vX.Y.Z-rc.N (Actions → Run workflow → Use workflow from the
# tag, or bin/promote), it promotes that candidate: it checks the candidate
# ran on staging and main fast-forwards to it, runs the browser tests, copies
# the image staging ran to the release package, then waits for the author's approval in the environment `production` before
# deploying that image to https://gameble.net. Only once the deploy succeeded
# does it fast-forward main to the candidate and publish the release vX.Y.Z on
# it: a failed or rejected run leaves main and the releases as they were.
# Nothing is built here; before the first deploy, the database accessory is
# booted by hand (RELEASING.md, Setup).
#
# Run from main with `rollback to` a release, it starts that release's
# container again, after the same approval.
on:
  workflow_dispatch:
    inputs:
      rollback_to:
        description: To roll back, the release to go back to (vX.Y.Z), run from main; empty to promote the candidate tag chosen above
        required: false
        type: string

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  STAGING_IMAGE: ghcr.io/theiereman/gameble
  RELEASE_IMAGE: ghcr.io/theiereman/gameble-releases

jobs:
  # Before anything is copied, tested or approved: a candidate that may not
  # become a release stops here.
  release-check:
    if: inputs.rollback_to == ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: read
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      release: ${{ steps.check.outputs.release }}
      previous: ${{ steps.check.outputs.previous }}
    env:
      CANDIDATE: ${{ github.ref_name }}

    steps:
      - name: Checkout the candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Check the candidate may become the release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! printf '%s\n' "$CANDIDATE" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$'; then
            echo "::error::$CANDIDATE is not a release candidate (vX.Y.Z-rc.N): use workflow from the candidate's tag, or give rollback to from main."
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$CANDIDATE" ]; then
            echo "::error::The run starts from the branch $CANDIDATE: to promote, use workflow from the candidate's tag."
            exit 1
          fi
          release="${CANDIDATE%-rc.*}"
          sha=$(git rev-parse "refs/tags/$CANDIDATE^{commit}")
          git fetch --quiet origin main develop
          if ! git merge-base --is-ancestor "$sha" origin/develop; then
            echo "::error::$CANDIDATE is not on develop."
            exit 1
          fi
          if git rev-parse --verify --quiet "refs/tags/$release" > /dev/null || gh release view "$release" > /dev/null 2>&1; then
            echo "::error::$release already exists."
            exit 1
          fi
          if ! git merge-base --is-ancestor origin/main "$sha"; then
            echo "::error::main is not an ancestor of $CANDIDATE: a commit reached main outside a promotion."
            exit 1
          fi
          staging=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/status" \
            --jq '[.statuses[] | select(.context == "staging")][0].state // "missing"')
          if [ "$staging" != "success" ]; then
            echo "::error::$sha has no successful staging status ($staging): it never ran on staging."
            exit 1
          fi
          previous=$(git tag --list 'v*' --merged "$sha" --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          {
            echo "sha=$sha"
            echo "release=$release"
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"

  # The browser tests of the candidate's commit: a failure stops the release here.
  system-tests:
    needs: release-check
    uses: ./.github/workflows/system-tests.yml

  # Before the approval, so a rejected run still leaves the release image.
  release-image:
    needs: [ release-check, system-tests ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # the release package is created and written here

    steps:
      - name: Log in to the container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Copy the staging image to the release package
        env:
          SHA: ${{ needs.release-check.outputs.sha }}
        run: docker buildx imagetools create --tag "$RELEASE_IMAGE:$SHA" "$STAGING_IMAGE:$SHA"

  deploy:
    needs: [ release-check, release-image ]
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # the hook pushes the deployed/production tag
      packages: read    # the servers pull the release image

    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit checked before the approval, even if the tag moved since.
          ref: ${{ needs.release-check.outputs.sha }}
          # The changelog reads the commits since the deployed/production tag.
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Write the SSH access to the production LXC
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install cloudflared, which carries SSH through the tunnel
        env:
          CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          CLOUDFLARED_SHA256: 77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cloudflared" "$CLOUDFLARED_URL"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

      - name: Write the secret files read by .kamal/secrets.production and the hook
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_ENCRYPTION_KEY: ${{ secrets.APNS_ENCRYPTION_KEY }}
          APNS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_PRODUCTION: ${{ secrets.DISCORD_WEBHOOK_PRODUCTION }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          printf '%s' "$SECRET_KEY_BASE" > config/secret_key_base.production.key
          printf '%s' "$SENTRY_DSN" > config/sentry_dsn.key
          printf '%s' "$DATABASE_PASSWORD" > config/database_password.production.key
          printf '%s' "$DATABASE_APP_PASSWORD" > config/database_app_password.production.key
          printf '%s' "$STEAM_API_KEY" > config/steam_api.key
          printf '%s' "$CLERK_SECRET_KEY" > config/clerk_secret.key
          printf '%s' "$APNS_KEY_ID" > config/apns_key_id.key
          printf '%s' "$APNS_ENCRYPTION_KEY" > config/apns_encryption.key
          printf '%s' "$APNS_TEAM_ID" > config/apns_team_id.key
          printf '%s' "$FCM_PROJECT_ID" > config/fcm_project_id.key
          printf '%s' "$FCM_SERVICE_ACCOUNT" > config/fcm_service_account.key
          printf '%s' "$DISCORD_WEBHOOK_PRODUCTION" > config/discord_webhook.production.key
          printf '%s' "$REGISTRY_PASSWORD" > config/registry_password.key

      # Local only: the shown version, the pre-deploy hook and the announcement
      # read the release tag; it reaches origin with the release, once deployed.
      - name: Tag the release in the checkout
        env:
          RELEASE: ${{ needs.release-check.outputs.release }}
          SHA: ${{ needs.release-check.outputs.sha }}
        run: git tag "$RELEASE" "$SHA"

      - name: Deploy the release image
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: bin/kamal deploy -d production --skip-push

  # Its own job, so a failed publish is re-run alone, without deploying again.
  # main is pushed with the deploy key MAIN_PUSH_KEY, the bypass actor of
  # main's ruleset; GitHub Actions cannot be one on a personal repository.
  publish:
    needs: [ release-check, deploy ]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # main is pushed and the release published here
    env:
      RELEASE: ${{ needs.release-check.outputs.release }}
      SHA: ${{ needs.release-check.outputs.sha }}
      PREVIOUS: ${{ needs.release-check.outputs.previous }}

    steps:
      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-check.outputs.sha }}
          fetch-depth: 0
          ssh-key: ${{ secrets.MAIN_PUSH_KEY }}

      - name: Fast-forward main to the release
        run: git push origin "$SHA:refs/heads/main"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE" > /dev/null 2>&1; then
            echo "$RELEASE is already published."
            exit 0
          fi
          set -- release create "$RELEASE" --target "$SHA" --title "$RELEASE" --latest --generate-notes
          if [ -n "$PREVIOUS" ]; then set -- "$@" --notes-start-tag "$PREVIOUS"; fi
          gh "$@"

  rollback-target:
    if: inputs.rollback_to != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    env:
      TAG: ${{ inputs.rollback_to }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Find the release to roll back to
        id: target
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$TAG is not a release tag (vX.Y.Z)."
            exit 1
          fi
          if ! sha=$(git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"); then
            echo "::error::There is no tag $TAG."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  rollback:
    needs: rollback-target
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write   # the hook moves the deployed/production tag back
      packages: read

    steps:
      - name: Checkout the release to roll back to
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit the tag named when the run started, even if it moved since.
          ref: ${{ needs.rollback-target.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Ruby
        uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          bundler-cache: true

      - name: Write the SSH access to the production LXC
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install cloudflared, which carries SSH through the tunnel
        env:
          CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          CLOUDFLARED_SHA256: 77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cloudflared" "$CLOUDFLARED_URL"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

      - name: Write the secret files read by .kamal/secrets.production and the hook
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_ENCRYPTION_KEY: ${{ secrets.APNS_ENCRYPTION_KEY }}
          APNS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_PRODUCTION: ${{ secrets.DISCORD_WEBHOOK_PRODUCTION }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          printf '%s' "$SECRET_KEY_BASE" > config/secret_key_base.production.key
          printf '%s' "$SENTRY_DSN" > config/sentry_dsn.key
          printf '%s' "$DATABASE_PASSWORD" > config/database_password.production.key
          printf '%s' "$DATABASE_APP_PASSWORD" > config/database_app_password.production.key
          printf '%s' "$STEAM_API_KEY" > config/steam_api.key
          printf '%s' "$CLERK_SECRET_KEY" > config/clerk_secret.key
          printf '%s' "$APNS_KEY_ID" > config/apns_key_id.key
          printf '%s' "$APNS_ENCRYPTION_KEY" > config/apns_encryption.key
          printf '%s' "$APNS_TEAM_ID" > config/apns_team_id.key
          printf '%s' "$FCM_PROJECT_ID" > config/fcm_project_id.key
          printf '%s' "$FCM_SERVICE_ACCOUNT" > config/fcm_service_account.key
          printf '%s' "$DISCORD_WEBHOOK_PRODUCTION" > config/discord_webhook.production.key
          printf '%s' "$REGISTRY_PASSWORD" > config/registry_password.key

      - name: Roll back
        shell: bash
        env:
          TAG: ${{ inputs.rollback_to }}
          SHA: ${{ needs.rollback-target.outputs.sha }}
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: |
          bin/kamal rollback -d production "$SHA" 2>&1 | tee "$RUNNER_TEMP/rollback.log"
          # Kamal exits 0 when the version has no container left on the server.
          if grep -q "is not available as a container" "$RUNNER_TEMP/rollback.log"; then
            echo "::error::$TAG has no container left on the server: bin/kamal app containers -d production lists the versions a rollback reaches."
            exit 1
          fi

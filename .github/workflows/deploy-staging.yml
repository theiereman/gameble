name: Deploy to staging

# Deploys develop to https://gameble.dotsncircles.com once CI has passed on it.
# main is never deployed here: production stays a manual `bin/kamal deploy -d production`.
on:
  workflow_run:
    workflows: [ CI ]
    types: [ completed ]
    branches: [ develop ]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read

    steps:
      - name: Checkout the commit CI validated
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Write the SSH access to the staging LXC
        env:
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$STAGING_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Write the secret files read by .kamal/secrets.staging
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          umask 077
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          printf '%s' "$SENTRY_DSN" > config/sentry_dsn.key
          printf '%s' "$DATABASE_PASSWORD" > config/database_password.key
          printf '%s' "$STEAM_API_KEY" > config/steam_api.key

      - name: Deploy
        run: bin/kamal deploy -d staging

name: Deploy a branch to staging

# Deploys any branch to https://test.gameble.net by hand, to try work that is not on develop yet.
# It skips CI, the release-tag requirement and the post-deploy hook, so no Discord message is sent
# and the deployed/staging tag does not move. The next release candidate replaces it.
# Never run it on main: production has its own workflow.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The branch to deploy
        required: true
        default: feature/hotwire-native

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write   # the image and its build cache live on ghcr.io
    env:
      BRANCH: ${{ inputs.branch }}

    steps:
      - name: Refuse main
        run: |
          if [ "$BRANCH" = "main" ]; then echo "main is released to production, not deployed by hand to staging"; exit 1; fi

      - name: Checkout the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          bundler-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Write the SSH access to the staging LXC
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Install cloudflared, which carries SSH through the tunnel
        env:
          CLOUDFLARED_URL: https://github.com/cloudflare/cloudflared/releases/download/2026.9.3/cloudflared-linux-amd64
          CLOUDFLARED_SHA256: 77e26d8d900e0b8469f416239d14b5f296525fdf79fee6f511ef55609e3fbac2
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/cloudflared" "$CLOUDFLARED_URL"
          echo "$CLOUDFLARED_SHA256  $RUNNER_TEMP/cloudflared" | sha256sum --check --strict
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared

      - name: Write the secret files read by .kamal/secrets.staging and the hook
        env:
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          DATABASE_APP_PASSWORD: ${{ secrets.DATABASE_APP_PASSWORD }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_ENCRYPTION_KEY: ${{ secrets.APNS_ENCRYPTION_KEY }}
          APNS_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          DISCORD_WEBHOOK_STAGING: ${{ secrets.DISCORD_WEBHOOK_STAGING }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          umask 077
          printf '%s' "$RAILS_MASTER_KEY" > config/master.key
          printf '%s' "$SECRET_KEY_BASE" > config/secret_key_base.staging.key
          printf '%s' "$SENTRY_DSN" > config/sentry_dsn.key
          printf '%s' "$DATABASE_PASSWORD" > config/database_password.staging.key
          printf '%s' "$DATABASE_APP_PASSWORD" > config/database_app_password.staging.key
          printf '%s' "$STEAM_API_KEY" > config/steam_api.key
          printf '%s' "$CLERK_SECRET_KEY" > config/clerk_secret.key
          printf '%s' "$APNS_KEY_ID" > config/apns_key_id.key
          printf '%s' "$APNS_ENCRYPTION_KEY" > config/apns_encryption.key
          printf '%s' "$APNS_TEAM_ID" > config/apns_team_id.key
          printf '%s' "$FCM_PROJECT_ID" > config/fcm_project_id.key
          printf '%s' "$FCM_SERVICE_ACCOUNT" > config/fcm_service_account.key
          printf '%s' "$DISCORD_WEBHOOK_STAGING" > config/discord_webhook.staging.key
          printf '%s' "$REGISTRY_PASSWORD" > config/registry_password.key

      - name: Deploy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
        run: bin/kamal deploy -d staging --skip-hooks

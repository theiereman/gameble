name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: ${{ github.event.pull_request.base.ref }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request the way a senior engineer on this repo would before merging it.

            ## Read before reviewing
            - `AGENTS.md`: the repo's rules. Its "Rules that break other files" section lists the rules a change must not break.
            - The full diff (`gh pr diff`), the PR title and description, and the earlier comments on the PR (`gh pr view --comments`).
            - For every changed file, the surrounding code: callers, the operation or query it goes through, the tests that cover it. Do not judge a hunk from the diff alone.

            ## What to look for
            1. Bugs: wrong logic, unhandled edge cases (nil, empty, boundaries, time zones, concurrency, retries), race conditions, broken i18n keys, missing translations in `en.yml` or `fr.yml`.
            2. Rule violations from `AGENTS.md`: writes outside an operation, a GET that writes, broadcasts inside a transaction, database ids exposed, a controller action without a Pundit policy, a pack dependency that breaks the architecture, a non expand/contract migration, comments that should be names.
            3. Tests: behaviour the change adds or fixes that no test pins, tests that would pass even if the fix were reverted, flaky timing assertions.
            4. Design and refactoring: duplication with existing code (name the existing helper), a method or object that would read better extracted or renamed, dead code left behind, a simpler way to get the same result.
            5. Security and performance: N+1 queries, missing indexes for new queries, unescaped output, authorization gaps.

            ## How to report
            Put the whole review in your tracking comment, in this order:
            - **Blocking**: must be fixed before merge.
            - **Should fix**: real problems that can be argued.
            - **Refactor (optional)**: concrete improvements, each with the change you suggest.
            - **Nits**: at most five.
            - **Checked**: one line on what you verified and found sound.
            Omit an empty section. Every point cites `path:line` and says why it matters.
            For each Blocking or Should fix point, also post an inline comment with `mcp__github_inline_comment__create_inline_comment` (with `confirmed: true`), with a suggestion block when the fix is small and complete.

            Do not invent problems to fill a section: an empty Blocking section is a valid outcome, but a review that found nothing at all must say what it checked.
            If you reviewed this PR before, say which of your earlier points the new commits resolve and review only what changed since.
            You cannot run the Ruby or JS test suites here; do not claim a test passes.
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),mcp__github_inline_comment__create_inline_comment"
